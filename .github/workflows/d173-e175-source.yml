name: D173 E175 Unified Network, Logs and Agent Overview
on:
  pull_request:
    paths:
      - "relay-agent/**"
      - "service/**"
      - "web/**"
      - "android/**"
      - "firebase/firestore.rules"
      - "tests/d173-e175-unified-network.test.mjs"
      - "tools/d173_e175_release_gate.py"
      - "ops/d173-e175-release-authorization.json"
      - ".github/workflows/d173-e175-source.yml"
permissions:
  contents: read
jobs:
  source-and-d172:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: E175 contract tests
        run: node --test tests/d173-e175-unified-network.test.mjs
      - name: E175 Owner scope preflight for each shipping component
        if: github.head_ref != 'feat/d173-e179-agent178-no-scroll-50-50-20261110' && github.head_ref != 'fix/d173-e181-agent179-overview-40-60-web-presence-20261110' && github.head_ref != 'fix/d173-e182-agent180-layout-network-20261110' && github.head_ref != 'fix/d173-e182-agent180-field-layout-autowidth-20261110'
        run: |
          python3 tools/d173_e175_release_gate.py --component worker --preflight
          python3 tools/d173_e175_release_gate.py --component firestore --preflight
          python3 tools/d173_e175_release_gate.py --component agent --preflight
          python3 tools/d173_e175_release_gate.py --component android --preflight
      - name: E179 Agent178 independent Owner code-only source preflight
        if: github.head_ref == 'feat/d173-e179-agent178-no-scroll-50-50-20261110'
        run: |
          node --test tests/d173-e179-agent178-layout.test.mjs
          python3 tools/d173_e060_vps_usage_guard.py
          python3 tools/d173_e064_agent_history_usage_guard.py
          node --test tests/d173-e175-unified-network.test.mjs
      - name: E181 Agent179 independent Owner source, Web presence and D172 isolation
        if: github.head_ref == 'fix/d173-e181-agent179-overview-40-60-web-presence-20261110'
        run: |
          python3 tools/d173_e181_agent179_release_gate.py --component agent --preflight
          node --test tests/d173-e181-agent179-layout-web-presence.test.mjs
          python3 tools/d173_e060_vps_usage_guard.py
          python3 tools/d173_e064_agent_history_usage_guard.py
          node --test tests/d173-e175-unified-network.test.mjs
      - name: E182 Agent180 independent Owner layout/network and D172 isolation
        if: github.head_ref == 'fix/d173-e182-agent180-layout-network-20261110'
        run: |
          python3 tools/d173_e182_agent180_release_gate.py --component agent --preflight
          node --test tests/d173-e182-agent180-layout-network.test.mjs
          python3 tools/d173_e060_vps_usage_guard.py
          python3 tools/d173_e064_agent_history_usage_guard.py
          node --test tests/d173-e175-unified-network.test.mjs
      - name: E182 Agent180 FIELD repair code-only geometry and D172 isolation
        if: github.head_ref == 'fix/d173-e182-agent180-field-layout-autowidth-20261110'
        run: |
          python3 tools/d173_e182_agent181_release_gate.py --component agent --preflight
          node --test tests/d173-e182-agent180-field-layout-regression.test.mjs
          node --test tests/d173-e182-agent180-layout-network.test.mjs
          python3 tools/d173_e060_vps_usage_guard.py
          python3 tools/d173_e064_agent_history_usage_guard.py
          if python3 tools/d173_e182_agent180_release_gate.py --component agent --preflight >/dev/null 2>&1; then
            echo "::error::E182 FIELD repair must not inherit signed Agent180 release permission"
            exit 1
          fi
          echo "E182_AGENT181_SOURCE_ONLY__SIGNED_RELEASE_REQUIRES_PINNED_CI_AND_PROTECTED_MERGE"
      - name: Service TypeScript
        working-directory: service
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
      - name: Web TypeScript and real Vite production build
        working-directory: web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Shared Worker D172 isolation
        run: node --test tests/d172-*.test.mjs
      - name: Continuity and state guards
        run: |
          python3 tools/change_continuity_guard.py
          python3 tools/project_state_guard.py
  firestore-rules-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install isolated Firebase emulator test dependencies
        run: |
          npm install --no-audit --no-fund --prefix tools/d169-peer-test
          npm install --no-audit --no-fund --global firebase-tools@14.16.0
      - name: Real Firestore Agent/PDA RBAC, Picker locks and D172 isolation
        run: firebase emulators:exec --non-interactive --only firestore --project demo-d169-isolated "node tools/d169-peer-test/test.cjs"

  agent-native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Agent and WebView2 native compile
        shell: pwsh
        run: |
          dotnet build relay-agent-webview2-host/SupraInventoryWebView2Host.csproj -c Release -p:PlatformTarget=x64
          dotnet build relay-agent/SupraInventoryRelayAgent.csproj -c Release -p:PlatformTarget=x64
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Android debug compile only
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
