name: Apply Concept 3 Android Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-concept3-android.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Apply Concept 3 Android source
        run: |
          set -euo pipefail
          python3 tools/apply_concept3_android.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/cd/cc/supra/inventory/beta/MainActivity.kt')
          text = p.read_text(encoding='utf-8')
          old = 'session.employeeCode ?: session.userId'
          if old not in text:
              raise SystemExit('Expected generated identity expression not found')
          p.write_text(text.replace(old, 'session.employeeCode ?: "Tài khoản hệ thống"', 1), encoding='utf-8')
          PY
          git diff --check
          python3 tools/project_state_guard.py

      - name: Compile Android Beta debug gate
        env:
          FIREBASE_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
          APP_VERSION_CODE: "28"
          APP_VERSION_NAME: "0.2.0-beta.28"
        run: |
          set -euo pipefail
          [ -n "${FIREBASE_API_KEY_BETA:-}" ] || { echo "Missing Firebase Beta API key"; exit 1; }
          gradle -p android :app:assembleDebug --no-daemon

      - name: Commit Concept 3 Android source
        run: |
          set -euo pipefail
          python3 tools/project_state_guard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-concept3-android.yml tools/apply_concept3_android.py
          git add android/app/src/main ops/project-state.json ops/resource-registry.json
          git commit -m "feat(android): apply Concept 3 unified role UI"
          git push origin HEAD:main
