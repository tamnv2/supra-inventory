name: Apply Practical Balanced Hotfix

on:
  push:
    branches: [fix/beta-version-monotonic-auth-hardening]
    paths:
      - ".github/workflows/apply-practical-hotfix.yml"

permissions:
  contents: write

jobs:
  reconcile-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beta-version-monotonic-auth-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile canonical source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def must_replace(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing replacement anchor: {label}")
              return text.replace(old, new, 1)

          # Web API: use configurable HR columns, explicit managed passwords and Picker bulk lifecycle.
          p = Path("web/src/api.ts")
          text = p.read_text(encoding="utf-8")
          text = must_replace(text,
          '''export interface HrSyncPreview {
            status: "preview";
            total_source: number;
            create: number;
            reactivate: number;
            rename: number;
            disable: number;
            unchanged: number;
            collisions: Array<{ employee_code: string; role: string; user_id: string }>;
          }''',
          '''export interface HrSyncPreview {
            status: "preview";
            total_source: number;
            create: number;
            reactivate: number;
            rename: number;
            disable: number;
            unchanged: number;
            inactive_existing: number;
            not_in_source: number;
            collisions: Array<{ employee_code: string; role: string; user_id: string }>;
          }''', "HrSyncPreview")
          text = must_replace(text,
          '''export async function saveHrSource(sheetUrl: string, tabName: string): Promise<HrSourceSaveResponse> {
            return readJson(await authorizedFetch("/api/admin/hr-source", { method: "PUT", body: JSON.stringify({ sheet_url: sheetUrl, tab_name: tabName }) }));
          }''',
          '''export async function saveHrSource(sheetUrl: string, tabName: string, employeeCodeHeader: string, fullNameHeader: string): Promise<HrSourceSaveResponse> {
            return readJson(await authorizedFetch("/api/admin/hr-source-v2", {
              method: "PUT",
              body: JSON.stringify({ sheet_url: sheetUrl, tab_name: tabName, employee_code_header: employeeCodeHeader, full_name_header: fullNameHeader }),
            }));
          }''', "saveHrSource")
          text = must_replace(text,
          '''export async function createManagedUser(username: string, displayName: string, role: "ADMIN" | "REPORTER"): Promise<ManagedUser> {
            const result = await readJson<{ user: ManagedUser }>(await authorizedFetch("/api/admin/users", {
              method: "POST",
              body: JSON.stringify({ request_id: crypto.randomUUID(), username, display_name: displayName, role }),
            }));
            return result.user;
          }''',
          '''export async function createManagedUser(username: string, displayName: string, role: "ADMIN" | "REPORTER", password: string): Promise<ManagedUser> {
            const result = await readJson<{ user: ManagedUser }>(await authorizedFetch("/api/admin/users", {
              method: "POST",
              body: JSON.stringify({ request_id: crypto.randomUUID(), username, display_name: displayName, role, password }),
            }));
            return result.user;
          }''', "createManagedUser")
          text = must_replace(text,
          '''export async function resetManagedUserPassword(userId: string): Promise<void> {
            await readJson(await authorizedFetch("/api/admin/users/reset-password", {
              method: "POST",
              body: JSON.stringify({ request_id: crypto.randomUUID(), user_id: userId }),
            }));
          }''',
          '''export async function setManagedUserPassword(userId: string, password: string): Promise<void> {
            await readJson(await authorizedFetch("/api/admin/users/password", {
              method: "PUT",
              body: JSON.stringify({ request_id: crypto.randomUUID(), user_id: userId, password }),
            }));
          }

          export async function updatePickerAccounts(action: "ENABLE" | "DISABLE" | "DELETE", userIds: string[]): Promise<{ status: string; action: string; affected: number }> {
            return readJson(await authorizedFetch("/api/admin/pickers/bulk", {
              method: "POST",
              body: JSON.stringify({ request_id: crypto.randomUUID(), action, all: false, user_ids: userIds }),
            }));
          }''', "managed password + Picker lifecycle")
          p.write_text(text, encoding="utf-8")

          # Web main: make the approved behavior native rather than relying on a DOM patch layer.
          p = Path("web/src/main.ts")
          text = p.read_text(encoding="utf-8")
          text = text.replace("  resetManagedUserPassword,", "  setManagedUserPassword,\n  updatePickerAccounts,")
          text = text.replace('const SKU_CHUNK_SIZE = 1000;', 'const SKU_CHUNK_SIZE = 1000;\nconst PRODUCT_CREDIT = "Phát triển và duy trì bởi: tamnv2 - Chuyên viên Pick Pack 1291";')
          old_nav = '''  if (canManage()) tabs.push(["dashboard", "Tổng quan"]);
            if (canOperate()) tabs.push(["operations", "Hàng chờ"]);
            if (canManage()) tabs.push(["reports", "Báo cáo"], ["sku", "Master SKU"], ["hr", "Nhân sự"]);
            tabs.push(["account", "Tài khoản"]);'''
          new_nav = '''  if (canManage()) tabs.push(["dashboard", "Tổng quan vận hành"]);
            if (canOperate()) tabs.push(["operations", "Hàng chờ xử lý"]);
            if (canManage()) tabs.push(["reports", "Báo cáo vận hành"], ["sku", "Danh mục Master SKU"], ["hr", "Quản lý nhân sự"]);
            tabs.push(["account", "Quản lý tài khoản"]);'''
          text = must_replace(text, old_nav, new_nav, "business navigation")

          hr_fn = r'''function renderHrPage(): string {
            const source = hrSourceState?.source || null;
            const manageableUsers = managedUsers.filter((user) => user.role !== "ROOT" && (profile?.role === "ROOT" ? ["ADMIN", "REPORTER", "PICKER"].includes(user.role) : ["REPORTER", "PICKER"].includes(user.role)));
            const sourceSummary = source
              ? `<div class="source-summary"><div class="source-summary-head"><div><span class="status ok">✓ Nguồn hợp lệ</span><h4>${escapeHtml(source.tab_name)}</h4></div><a class="text-link" href="${escapeHtml(source.sheet_url)}" target="_blank" rel="noopener noreferrer">Mở Google Sheet</a></div><div class="summary-grid"><div><span>Dữ liệu</span><strong>${Number(source.data_row_count || 0).toLocaleString("vi-VN")} dòng</strong></div><div><span>Cột Mã nhân viên</span><strong>${escapeHtml(source.mnv_header)}</strong></div><div><span>Cột Họ và tên</span><strong>${escapeHtml(source.full_name_header)}</strong></div><div><span>Xác minh</span><strong>${escapeHtml(fmtDate(source.verified_at))}</strong></div></div></div>`
              : `<div class="source-summary empty"><span class="status closed">Chưa cấu hình</span><p class="muted">Nhập link Google Sheet, tên tab và tên hai cột nguồn. Hệ thống không yêu cầu header cố định.</p></div>`;
            const preview = hrSyncPreview ? `<div class="detail-panel"><div class="section-head compact-head"><div><strong>Đối chiếu Picker</strong><p class="tiny">Chỉ thêm Picker mới và cập nhật tên. Trạng thái Picker cũ không bị đổi tự động.</p></div><span class="badge">${hrSyncPreview.total_source.toLocaleString("vi-VN")} nhân sự nguồn</span></div><div class="summary-grid sync-grid"><div><span>Thêm mới</span><strong>${hrSyncPreview.create}</strong></div><div><span>Đổi tên</span><strong>${hrSyncPreview.rename}</strong></div><div><span>Đang ngừng</span><strong>${hrSyncPreview.inactive_existing || 0}</strong></div><div><span>Không có trong nguồn</span><strong>${hrSyncPreview.not_in_source || 0}</strong></div></div>${hrSyncPreview.collisions.length ? `<div class="status-panel error"><div class="status-panel-title">Không thể đồng bộ</div><div class="status-panel-body">Có ${hrSyncPreview.collisions.length} Mã nhân viên đang trùng tài khoản không phải Picker.</div></div>` : `<button id="apply-hr-sync" class="block-gap">Xác nhận đồng bộ Picker</button>`}</div>` : "";
            const pickerCount = manageableUsers.filter((user) => user.role === "PICKER").length;
            const userRows = manageableUsers.length ? `<div class="ops-user-toolbar"><strong>Picker: ${pickerCount}</strong><button class="secondary small-btn" data-picker-action="ENABLE">Mở lại đã chọn</button><button class="secondary small-btn" data-picker-action="DISABLE">Ngừng đã chọn</button><button class="ops-danger small-btn" data-picker-action="DELETE">Xóa Picker đã chọn</button></div><div class="table-wrap ops-user-table"><table><thead><tr><th><input id="picker-select-all" type="checkbox" aria-label="Chọn tất cả Picker" /></th><th>Mã nhân viên / User</th><th>Họ và tên</th><th>Vai trò</th><th>Trạng thái</th><th>Mật khẩu</th><th>Thao tác</th></tr></thead><tbody>${manageableUsers.map((user) => `<tr><td>${user.role === "PICKER" ? `<input type="checkbox" data-picker-select value="${escapeHtml(user.user_id)}" aria-label="Chọn Picker ${escapeHtml(user.employee_code || user.user_id)}" />` : ""}</td><td><b>${escapeHtml(user.employee_code || user.user_id)}</b></td><td>${escapeHtml(user.display_name)}</td><td><span class="badge role-badge">${escapeHtml(user.role)}</span></td><td><span class="status ${user.status === "ACTIVE" ? "ok" : "closed"}">${user.status === "ACTIVE" ? "Hoạt động" : "Ngừng hoạt động"}</span></td><td>${user.password_initialized ? "Đã thiết lập" : "Chưa thiết lập"}</td><td><div class="ops-user-actions"><button class="secondary small-btn" data-user-toggle="${escapeHtml(user.user_id)}" data-next-status="${user.status === "ACTIVE" ? "DISABLED" : "ACTIVE"}" data-user-name="${escapeHtml(user.display_name)}">${user.status === "ACTIVE" ? "Ngừng hoạt động" : "Mở lại"}</button><button class="secondary small-btn" data-user-password="${escapeHtml(user.user_id)}" data-user-name="${escapeHtml(user.display_name)}">Đổi mật khẩu</button></div></td></tr>`).join("")}</tbody></table></div>` : `<div class="empty-state">Chưa tải danh sách tài khoản.</div>`;
            const roleField = profile?.role === "ROOT" ? `<label>Vai trò<select name="role" required><option value="REPORTER">Reporter</option><option value="ADMIN">Admin</option></select></label>` : `<input type="hidden" name="role" value="REPORTER" />`;
            return `<section class="page-stack"><div><p class="eyebrow">Nhân sự & tài khoản</p><h2>Quản lý nhân sự</h2><p class="muted">Nguồn nhân sự dùng để thêm/cập nhật Picker; trạng thái làm/nghỉ do Admin/Root chủ động quản lý.</p></div><div class="settings-grid"><article class="card"><div class="card-head"><div><h3>Nguồn Google Sheet</h3><p class="muted tiny">Có thể thay link, tab và tên cột bất kỳ khi cấu trúc nguồn thay đổi.</p></div><button id="load-hr" class="secondary small-btn">Tải cấu hình</button></div>${sourceSummary}<form id="hr-form" class="stack block-gap"><label>Google Sheet URL<input name="sheetUrl" type="url" value="${escapeHtml(source?.sheet_url || "")}" placeholder="https://docs.google.com/spreadsheets/d/..." required /></label><label>Tên tab chính xác<input name="tabName" value="${escapeHtml(source?.tab_name || "Nhân sự")}" required /></label><div class="ops-hr-fields"><label>Tên cột Mã nhân viên<input name="employeeCodeHeader" value="${escapeHtml(source?.mnv_header || "")}" placeholder="Ví dụ: Mã NV / Employee ID" required /></label><label>Tên cột Họ và tên<input name="fullNameHeader" value="${escapeHtml(source?.full_name_header || "")}" placeholder="Ví dụ: Họ tên / Full name" required /></label></div><button>Xác nhận & cập nhật nguồn</button></form><button id="preview-hr-sync" class="secondary full block-gap">Kiểm tra đồng bộ Picker</button>${preview}</article><article class="card"><h3>Tạo tài khoản</h3><p class="muted tiny">${profile?.role === "ROOT" ? "Root có thể tạo Admin hoặc Reporter." : "Admin có thể tạo Reporter."}</p><form id="managed-user-form" class="stack block-gap"><label>Tên đăng nhập / Mã nhân viên<input name="username" placeholder="Nhập tên đăng nhập" required /></label><label>Họ và tên<input name="displayName" placeholder="Nhập họ và tên" required /></label>${roleField}<label>Mật khẩu khởi tạo<input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required /></label><button>Tạo tài khoản</button></form><p class="tiny">Admin/Reporter dùng mật khẩu được đặt trực tiếp. Chỉ Picker mới được cấp mật khẩu mặc định khi provision từ nguồn nhân sự.</p></article></div><article class="card"><div class="section-head"><div><h3>Quản lý tài khoản</h3><p class="muted tiny">Chọn một, nhiều hoặc tất cả Picker để mở lại, ngừng hoạt động hoặc xóa. ROOT được bảo vệ khỏi thao tác cấp dưới.</p></div><button id="load-users" class="secondary">Tải lại</button></div><div class="ops-picker-note">Đổi nguồn nhân sự không tự xóa/ngừng Picker cũ và không tự mở lại Picker đã chủ động ngừng.</div>${userRows}</article></section>`;
          }
          '''
          text, n = re.subn(r'function renderHrPage\(\): string \{.*?\n\}\n\nfunction renderAccountPage', hr_fn + '\nfunction renderAccountPage', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("renderHrPage replacement failed")

          text = text.replace('placeholder="Tên đăng nhập / MNV"', 'placeholder="Tên đăng nhập / Mã nhân viên"')
          text = text.replace('activeSection === "dashboard" ? "Tổng quan" : activeSection === "operations" ? "Hàng chờ xử lý" : activeSection === "reports" ? "Báo cáo" : activeSection === "sku" ? "Master SKU" : activeSection === "hr" ? "Nhân sự" : "Tài khoản"', 'activeSection === "dashboard" ? "Tổng quan vận hành" : activeSection === "operations" ? "Hàng chờ xử lý" : activeSection === "reports" ? "Báo cáo vận hành" : activeSection === "sku" ? "Danh mục Master SKU" : activeSection === "hr" ? "Quản lý nhân sự" : "Quản lý tài khoản"')
          text = must_replace(text,
          'app.innerHTML = `<main class="shell login-shell"><section class="card login-card"><div class="brand-mark">SI</div><p class="eyebrow">SUPRA Inventory — Beta</p><h1>Đăng nhập hệ thống</h1><p class="muted">Admin / Root quản trị trên Web. Picker / Reporter vận hành chính trên PDA.</p><form id="login-form" class="stack"><label>Tên đăng nhập<input name="username" autocomplete="username" placeholder="Tên đăng nhập / Mã nhân viên" required /></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required /></label><button ${busy ? "disabled" : ""}>${busy ? "Đang đăng nhập..." : "Đăng nhập"}</button></form>${message ? `<p class="message">${escapeHtml(message)}</p>` : ""}</section></main>`;',
          'app.innerHTML = `<main class="shell login-shell"><section class="card login-card"><div class="brand-mark">SI</div><p class="eyebrow">SUPRA Inventory — Beta</p><h1>Đăng nhập hệ thống</h1><p class="muted">Admin / Root quản trị trên Web. Picker / Reporter vận hành chính trên PDA.</p><form id="login-form" class="stack"><label>Tên đăng nhập<input name="username" autocomplete="username" placeholder="Tên đăng nhập / Mã nhân viên" required /></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required /></label><button ${busy ? "disabled" : ""}>${busy ? "Đang đăng nhập..." : "Đăng nhập"}</button></form>${message ? `<p class="message">${escapeHtml(message)}</p>` : ""}</section><footer class="ops-footer">${PRODUCT_CREDIT}</footer></main>`;', "login footer")
          text = must_replace(text, '${renderContent()}</section></main>`;', '${renderContent()}<footer class="ops-footer">${PRODUCT_CREDIT}</footer></section></main>`;', "app footer")
          text = text.replace('  document.querySelectorAll<HTMLButtonElement>("[data-user-reset]").forEach((button) => button.addEventListener("click", () => void handleManagedUserReset(button.dataset.userReset || "")));', '  document.querySelectorAll<HTMLButtonElement>("[data-user-password]").forEach((button) => button.addEventListener("click", () => void handleManagedUserPassword(button.dataset.userPassword || "", button.dataset.userName || "")));\n  document.querySelector<HTMLInputElement>("#picker-select-all")?.addEventListener("change", handlePickerSelectAll);\n  document.querySelectorAll<HTMLButtonElement>("[data-picker-action]").forEach((button) => button.addEventListener("click", () => void handlePickerBulk(button.dataset.pickerAction as "ENABLE" | "DISABLE" | "DELETE")));')

          text = must_replace(text,
          '''    const result = await saveHrSource(String(form.get("sheetUrl") || ""), String(form.get("tabName") || ""));''',
          '''    const result = await saveHrSource(
              String(form.get("sheetUrl") || ""), String(form.get("tabName") || ""),
              String(form.get("employeeCodeHeader") || ""), String(form.get("fullNameHeader") || ""),
            );''', "HR save fields")

          old_create_re = r'''async function handleManagedUserCreate\(event: SubmitEvent\): Promise<void> \{.*?\n\}\n\nasync function handleManagedUserToggle'''
          new_create = r'''async function handleManagedUserCreate(event: SubmitEvent): Promise<void> {
            event.preventDefault();
            if (!profile || !["ROOT","ADMIN"].includes(profile.role)) return;
            const form = new FormData(event.currentTarget as HTMLFormElement);
            const role = String(form.get("role") || "REPORTER") as "ADMIN" | "REPORTER";
            if (profile.role === "ADMIN" && role !== "REPORTER") { message = "Admin chỉ được tạo Reporter."; render(); return; }
            try {
              await createManagedUser(String(form.get("username") || ""), String(form.get("displayName") || ""), role, String(form.get("password") || ""));
              message = `Đã tạo ${role} với mật khẩu được đặt trực tiếp.`;
              (event.currentTarget as HTMLFormElement).reset();
              await loadManagedUsers(false);
            } catch (error) { message = error instanceof Error ? error.message : "Không tạo được tài khoản."; }
            render();
          }

          async function handleManagedUserToggle'''
          text, n = re.subn(old_create_re, new_create, text, count=1, flags=re.S)
          if n != 1: raise SystemExit("managed create replacement failed")

          old_reset_re = r'''async function handleManagedUserReset\(userId: string\): Promise<void> \{.*?\n\}\n\nasync function handleHrSyncPreview'''
          new_reset = r'''async function handleManagedUserPassword(userId: string, displayName: string): Promise<void> {
            if (!userId) return;
            const password = window.prompt(`Nhập mật khẩu mới cho ${displayName || userId} (tối thiểu 8 ký tự):`);
            if (password === null) return;
            if (password.length < 8) { message = "Mật khẩu mới phải có ít nhất 8 ký tự."; render(); return; }
            try { await setManagedUserPassword(userId, password); message = "Đã đổi mật khẩu trực tiếp và vô hiệu phiên cũ của tài khoản."; await loadManagedUsers(false); }
            catch (error) { message = error instanceof Error ? error.message : "Không đổi được mật khẩu."; }
            render();
          }

          function handlePickerSelectAll(event: Event): void {
            const checked = (event.currentTarget as HTMLInputElement).checked;
            document.querySelectorAll<HTMLInputElement>("input[data-picker-select]").forEach((input) => { input.checked = checked; });
          }

          async function handlePickerBulk(action: "ENABLE" | "DISABLE" | "DELETE"): Promise<void> {
            const selected = [...document.querySelectorAll<HTMLInputElement>("input[data-picker-select]:checked")].map((input) => input.value);
            if (!selected.length) { message = "Hãy chọn ít nhất một Picker."; render(); return; }
            const label = action === "ENABLE" ? "mở lại" : action === "DISABLE" ? "ngừng hoạt động" : "xóa";
            if (!window.confirm(`Xác nhận ${label} ${selected.length} Picker đã chọn?${action === "DELETE" ? " Lịch sử báo hàng vẫn được giữ." : ""}`)) return;
            try {
              const result = await updatePickerAccounts(action, selected);
              message = `Đã ${label} ${result.affected} Picker.`;
              await loadManagedUsers(false);
            } catch (error) { message = error instanceof Error ? error.message : "Không cập nhật được Picker."; }
            render();
          }

          async function handleHrSyncPreview'''
          text, n = re.subn(old_reset_re, new_reset, text, count=1, flags=re.S)
          if n != 1: raise SystemExit("password/bulk handler replacement failed")

          old_apply_re = r'''async function handleHrSyncApply\(\): Promise<void> \{.*?\n\}\n\nasync function loadOperations'''
          new_apply = r'''async function handleHrSyncApply(): Promise<void> {
            if (!hrSyncPreview || hrSyncPreview.collisions.length) return;
            if (!window.confirm(`Xác nhận đồng bộ ${hrSyncPreview.total_source} Picker? Sẽ thêm ${hrSyncPreview.create}, đổi tên ${hrSyncPreview.rename}. Picker không có trong nguồn và Picker đang ngừng sẽ giữ nguyên trạng thái.`)) return;
            busy = true; render();
            try { await applyHrPickerSync(); hrSyncPreview = null; message = "Đồng bộ Picker từ HR Sheet thành công; không thay đổi trạng thái Picker cũ ngoài nguồn."; await loadManagedUsers(false); }
            catch (error) { message = error instanceof Error ? error.message : "Không đồng bộ được Picker."; }
            finally { busy = false; render(); }
          }

          async function loadOperations'''
          text, n = re.subn(old_apply_re, new_apply, text, count=1, flags=re.S)
          if n != 1: raise SystemExit("HR apply replacement failed")
          if "Reset mật khẩu" in text or "data-user-reset" in text or "/ MNV" in text or "Cột MNV" in text:
              raise SystemExit("legacy Web account/employee wording still present")
          p.write_text(text, encoding="utf-8")

          # Backend hardening: only ROOT can bootstrap from the Root secret; old HR route accepts configured columns.
          p = Path("service/src/index.ts")
          text = p.read_text(encoding="utf-8")
          old_login = '''  if (!user.password_hash || !user.password_salt) {
              if (!env.ROOT_BOOTSTRAP_PASSWORD) {
                return json({ error: "PASSWORD_NOT_INITIALIZED", message: "Tài khoản chưa được khởi tạo mật khẩu." }, 503);
              }
              await savePassword(env, user.user_id, env.ROOT_BOOTSTRAP_PASSWORD);
              user = (await getUserByUsername(env, username))!;
            }'''
          new_login = '''  if (!user.password_hash || !user.password_salt) {
              if (user.role !== "ROOT" || user.user_id !== "root" || !env.ROOT_BOOTSTRAP_PASSWORD) {
                return json({ error: "PASSWORD_NOT_INITIALIZED", message: "Tài khoản chưa được khởi tạo mật khẩu." }, 503);
              }
              await savePassword(env, user.user_id, env.ROOT_BOOTSTRAP_PASSWORD);
              user = (await getUserByUsername(env, username))!;
            }'''
          text = must_replace(text, old_login, new_login, "root-only bootstrap")
          text = text.replace('const body = (await request.json()) as { sheet_url?: string; tab_name?: string };', 'const body = (await request.json()) as { sheet_url?: string; tab_name?: string; employee_code_header?: string; full_name_header?: string };')
          text = text.replace('{ sheet_url: String(body.sheet_url || ""), tab_name: String(body.tab_name || "") }', '{ sheet_url: String(body.sheet_url || ""), tab_name: String(body.tab_name || ""), employee_code_header: String(body.employee_code_header || ""), full_name_header: String(body.full_name_header || "") }')
          text = text.replace('validation: ["valid_google_sheet_link", "exact_tab_name", "MNV_column", "Ho_ten_column"]', 'validation: ["valid_google_sheet_link", "exact_tab_name", "configured_employee_code_column", "configured_full_name_column"]')
          p.write_text(text, encoding="utf-8")

          # Picker lifecycle hardening: disabling removes active presence; re-provisioned Picker gets a new internal identity.
          p = Path("service/src/user-management-core.ts")
          text = p.read_text(encoding="utf-8")
          text = must_replace(text,
          '''  if (status === "DISABLED") state.storage.sql.exec(`UPDATE fcm_devices SET enabled = 0, updated_at = CURRENT_TIMESTAMP WHERE user_id = ?`, userId);''',
          '''  if (status === "DISABLED") {
              state.storage.sql.exec(`UPDATE fcm_devices SET enabled = 0, updated_at = CURRENT_TIMESTAMP WHERE user_id = ?`, userId);
              state.storage.sql.exec(`DELETE FROM presence_sessions WHERE user_id = ?`, userId);
            }''', "single disable presence")
          text = must_replace(text, '`picker:${code}`, code, name, at, at, body.picker_password_salt, body.picker_password_hash, at,', '`picker:${code}:${crypto.randomUUID()}`, code, name, at, at, body.picker_password_salt, body.picker_password_hash, at,', "Picker identity generation")
          p.write_text(text, encoding="utf-8")

          for path in ["web/src/main.ts", "web/src/api.ts", "service/src/index.ts", "service/src/user-management-core.ts"]:
              data = Path(path).read_text(encoding="utf-8")
              if "Supra@123" in data:
                  raise SystemExit(f"plaintext password found in {path}")
          PY

          git diff --check
          git status --short
      - name: Commit reconciled source
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/api.ts web/src/main.ts service/src/index.ts service/src/user-management-core.ts
          git commit -m "fix: reconcile Practical Balanced behavior into canonical source"
          git push origin HEAD:fix/beta-version-monotonic-auth-hardening
