name: D172 OBPP1291 Backend isolated CI
on:
  pull_request:
    paths:
      - 'service/src/obpp1291-*.ts'
      - 'service/src/index.ts'
      - 'service/src/core.ts'
      - 'service/src/auth.ts'
      - '.github/workflows/d172-obpp1291-backend.yml'
      - 'ops/d172-release-authorization.json'
      - 'tests/d172-e010-obpp-shared-fire-login.test.mjs'
      - 'tools/d172_release_gate.py'
      - '.github/workflows/release-obpp1291.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict TypeScript compile (no provider writes)
        working-directory: service
        run: |
          npm install --no-save --ignore-scripts
          npm run typecheck
      - name: D172 E010 Inventory shared Firebase login regression
        run: node --test tests/d172-e010-obpp-shared-fire-login.test.mjs
      - name: Owner D172 exact SHA and protected-component preflight (no deployment)
        run: |
          python3 tools/d172_release_gate.py --component worker --preflight
          python3 tools/d172_release_gate.py --component android --preflight
      - name: No out-of-scope new Worker or live release
        run: |
          set -euo pipefail
          grep -q 'app_session_channel:"OBPP1291"' service/src/index.ts
          grep -q 'obpp_records' service/src/obpp1291-core.ts
          grep -q 'claimed_until' service/src/obpp1291-core.ts
          grep -q 'GOOGLE_RUNTIME_SA_JSON' service/src/obpp1291-sheets.ts
          test -f ops/change-continuity/D172.json
