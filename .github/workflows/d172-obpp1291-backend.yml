name: D172 OBPP1291 Backend isolated CI
on:
  pull_request:
    paths:
      - 'service/src/obpp1291-*.ts'
      - 'service/src/index.ts'
      - 'service/src/core.ts'
      - 'service/src/auth.ts'
      - '.github/workflows/d172-obpp1291-backend.yml'
      - 'ops/d172-release-authorization.json'
      - 'tests/d172-e010-obpp-shared-fire-login.test.mjs'
      - 'tests/d172-e012-obpp-session-uid.test.mjs'
      - 'tests/d172-e014-obpp-sheet-contract.test.mjs'
      - 'tests/d172-e019-coordinator-mirror.test.mjs'
      - 'tests/d172-e022-sheet-migration.test.mjs'
      - 'tests/d172-e026-session-history-logs.test.mjs'
      - 'tests/d172-e038-qr-draft-note-dedupe.test.mjs'
      - 'tests/d172-e043-unique-do-preflight.test.mjs'
      - 'tools/d172_sheet_migration_plan.mjs'
      - 'tools/d172_release_gate.py'
      - '.github/workflows/release-obpp1291.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict TypeScript compile (no provider writes)
        working-directory: service
        run: |
          npm install --no-save --ignore-scripts
          npm run typecheck
      - name: D172 E010 Inventory shared Firebase login regression
        run: node --test tests/d172-e010-obpp-shared-fire-login.test.mjs
      - name: D172 E012 run actual role-prefixed Firebase UID session tests
        run: node --test tests/d172-e012-obpp-session-uid.test.mjs
      - name: D172 E014 Sheet retry and concurrent claim regression
        run: node --test tests/d172-e014-obpp-sheet-contract.test.mjs
      - name: D172 E019 Coordinator isolation and Sheet mirror regression
        run: node --test tests/d172-e019-coordinator-mirror.test.mjs
      - name: D172 E022 fail-closed legacy Sheet migration planner
        run: node --test tests/d172-e022-sheet-migration.test.mjs
      - name: D172 E026 session, UI, logging and cooldown contract
        run: node --test tests/d172-e026-session-history-logs.test.mjs
      - name: E038 QR, note and duplicate regression contracts
        run: node --test tests/d172-e038-qr-draft-note-dedupe.test.mjs
      - name: E043 unique DO preflight and atomic save regression
        run: node --test tests/d172-e043-unique-do-preflight.test.mjs
      - name: Owner D172 exact SHA and protected-component preflight (no deployment)
        run: |
          python3 tools/d172_release_gate.py --component worker --preflight
          # E043 Owner chose existing Worker-only DO rejection. Android stays v8;
          # do not require Android release capability from a Worker-only receipt.
          if jq -e '.e043_do_only_duplicate.status=="OWNER_EXPLICIT_DEPLOY_APPROVED" and .e043_do_only_duplicate.approved_components==["worker"]' ops/d172-release-authorization.json >/dev/null; then
            echo "D172_E043_NO_ANDROID_RELEASE_OR_PREFLIGHT"
          else
            python3 tools/d172_release_gate.py --component android --preflight
          fi
      - name: No out-of-scope new Worker or live release
        run: |
          set -euo pipefail
          grep -q 'session_channel:"OBPP1291"' service/src/index.ts
          grep -q 'check-opaque' service/src/index.ts
          grep -q 'obpp_records' service/src/obpp1291-core.ts
          grep -q 'claimed_until' service/src/obpp1291-core.ts
          grep -q 'GOOGLE_RUNTIME_SA_JSON' service/src/obpp1291-sheets.ts
          test -f ops/change-continuity/D172.json
