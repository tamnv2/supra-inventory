name: D172 OBPP1291 Android code-only
on:
  pull_request:
    paths:
      - 'obpp1291/**'
      - '.github/workflows/d172-obpp1291-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run D172 QR parser unit tests and assemble unsigned debug APK (NOT OTA)
        run: gradle -p obpp1291/android :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Verify release signing code with disposable CI key (NEVER publish)
        run: |
          set -euo pipefail
          ci_pass="$(openssl rand -hex 16)"
          keytool -genkeypair -noprompt -storetype PKCS12 -alias obpp_ci -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=OBPP Build CI" -keystore "$RUNNER_TEMP/obpp-ci.jks" \
            -storepass "$ci_pass" -keypass "$ci_pass"
          export OBPP_SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/obpp-ci.jks"
          export OBPP_SIGNING_STORE_PASSWORD="$ci_pass"
          export OBPP_SIGNING_KEY_ALIAS="obpp_ci"
          export OBPP_SIGNING_KEY_PASSWORD="$ci_pass"
          export OBPP_VERSION_CODE="1"
          export OBPP_VERSION_NAME="1.0.1-ci"
          gradle -p obpp1291/android :app:testDebugUnitTest :app:assembleRelease --no-daemon
          test -f obpp1291/android/app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/obpp-ci.jks"
      - name: Verify isolated package (no Inventory overwrite)
        run: |
          grep -q 'applicationId = "cd.cc.supra.obpp1291"' obpp1291/android/app/build.gradle.kts
          test -f obpp1291/android/app/build/outputs/apk/debug/app-debug.apk
          ! grep -R -E 'GOOGLE_RUNTIME_SA_JSON|GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN' obpp1291/android/app/src/main || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: d172-obpp1291-debug-unsigned-NOT-FOR-RELEASE
          path: obpp1291/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
