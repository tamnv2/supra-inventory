name: Verify PDA Management

on:
  pull_request:
    paths:
      - "pda-management/**"
      - "ops/pda-management-state.json"
      - ".github/workflows/verify-pda-management.yml"
  push:
    branches: [main]
    paths:
      - "pda-management/android/**"
      - ".github/workflows/verify-pda-management.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pda-management-verify
  cancel-in-progress: false

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck isolated service
        working-directory: pda-management/service
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck

  android:
    runs-on: ubuntu-latest
    environment: beta
    env:
      BETA_KEYSTORE_B64: ${{ secrets.BETA_KEYSTORE_B64 }}
      BETA_KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
      BETA_KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
      BETA_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Prepare independent version and signing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(test("^pda-mgmt-beta-vc[0-9]+$")) | capture("^pda-mgmt-beta-vc(?<n>[0-9]+)$").n | tonumber] | max // 0')"
          next=$((latest + 1))
          echo "PDA_MGMT_VERSION_CODE=$next" >> "$GITHUB_ENV"
          echo "PDA_MGMT_VERSION_NAME=0.1.0-beta.$next" >> "$GITHUB_ENV"
          if [ -n "${BETA_KEYSTORE_B64:-}" ] && [ -n "${BETA_KEYSTORE_PASSWORD:-}" ] && [ -n "${BETA_KEY_ALIAS:-}" ] && [ -n "${BETA_KEY_PASSWORD:-}" ]; then
            key_path="$RUNNER_TEMP/supra-pda-management-beta.jks"
            printf '%s' "$BETA_KEYSTORE_B64" | base64 --decode > "$key_path"
            keytool -list -keystore "$key_path" -storepass "$BETA_KEYSTORE_PASSWORD" -alias "$BETA_KEY_ALIAS" >/dev/null
            echo "BETA_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
          fi
      - name: Assemble PDA Management APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pda-management/android/dist
          mkdir -p pda-management/android/dist
          if [ "$SIGNING_READY" = "true" ]; then
            gradle -p pda-management/android :app:assembleRelease --no-daemon
            cp pda-management/android/app/build/outputs/apk/release/app-release.apk pda-management/android/dist/supra-pda-management-beta.apk
          else
            gradle -p pda-management/android :app:assembleDebug --no-daemon
            cp pda-management/android/app/build/outputs/apk/debug/app-debug.apk pda-management/android/dist/supra-pda-management-beta.apk
          fi
          sha256sum pda-management/android/dist/supra-pda-management-beta.apk > pda-management/android/dist/supra-pda-management-beta.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: supra-pda-management-beta-apk
          path: |
            pda-management/android/dist/supra-pda-management-beta.apk
            pda-management/android/dist/supra-pda-management-beta.apk.sha256
          retention-days: 7
      - name: Publish independent signed Beta release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="pda-mgmt-beta-vc${PDA_MGMT_VERSION_CODE}"
          gh release view "$tag" >/dev/null 2>&1 && { echo "Release already exists: $tag"; exit 1; } || true
          gh release create "$tag" pda-management/android/dist/supra-pda-management-beta.apk pda-management/android/dist/supra-pda-management-beta.apk.sha256 --target "$GITHUB_SHA" --title "SUPRA Quản lý PDA Beta ${PDA_MGMT_VERSION_NAME}" --notes "Independent D164 PDA Management Android build. Source=${GITHUB_SHA}."
