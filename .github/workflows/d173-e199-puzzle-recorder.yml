name: D173 E199 Puzzle Recorder V1 (isolated Windows diagnostic)
on:
  pull_request:
    paths:
      - "diagnostics/puzzle-recorder-v1/**"
      - "tests/d173-e199-puzzle-recorder.test.mjs"
      - ".github/workflows/d173-e199-puzzle-recorder.yml"
      - "ops/change-continuity/D173.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recorder privacy + geometry source tests
        run: node --test tests/d173-e199-puzzle-recorder.test.mjs
      - name: No Agent, Web, Android, Worker, D172 or Stable modifications
        shell: bash
        run: |
          git diff --exit-code "$(git merge-base origin/main HEAD)" HEAD -- \
            relay-agent/ relay-agent-webview2-host/ service/ web/ android/ \
            obpp1291/ firebase/ functions/ ops/project-scope.json
  windows-native:
    needs: source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build self-contained diagnostic test artifact only
        shell: pwsh
        run: |
          dotnet build diagnostics/puzzle-recorder-v1/SupraPuzzleRecorder.csproj -c Release -p:PlatformTarget=x64
          if ($LASTEXITCODE -ne 0) { throw "BUILD_FAIL" }
          $exe = 'diagnostics/puzzle-recorder-v1/bin/Release/net48/SUPRA.Puzzle.Recorder.V1.exe'
          if (!(Test-Path $exe)) { throw "EXE_MISSING" }
          & $exe --startup-smoke
          if ($LASTEXITCODE -ne 0) { throw "SMOKE_FAIL" }
      - uses: actions/upload-artifact@v4
        with:
          name: SUPRA-Puzzle-Recorder-V1-win-x64
          path: diagnostics/puzzle-recorder-v1/bin/Release/net48/
          if-no-files-found: error
          retention-days: 7