name: D161 Phase 0A Continuation

on:
  pull_request:
    paths:
      - ".github/workflows/d161-phase0a-continuation.yml"
      - "ops/project-scope.json"
      - "ops/project-state.json"
      - "ops/resource-registry.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/d161-phase0a-continuation.yml"
      - "ops/project-scope.json"
      - "ops/project-state.json"
      - "ops/resource-registry.json"

permissions:
  contents: read

concurrency:
  group: d161-phase0a-continuation
  cancel-in-progress: false

jobs:
  validate:
    name: phase0a-continuation-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate active gate and disposable resource scope
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.d161.status=="STARTED__PHASE0A_PERMISSION_PROVIDER_PREFLIGHT_ACTIVE"' ops/project-state.json >/dev/null
          jq -e '.d161.current_gate=="PHASE0A_PERMISSION_PROVIDER_PREFLIGHT_ACTIVE"' ops/project-state.json >/dev/null
          jq -e '.resources[] | select(.key=="d161-phase0a-provider-canary-beta") | .environment=="beta"' ops/project-scope.json >/dev/null
          jq -e '.d161.phase0a_continuation_canary.resource_lifecycle=="CREATE_BETA_ONLY__VERIFY__DELETE_SAME_RUN"' ops/resource-registry.json >/dev/null
          test "$(tr -d '\r\n ' < relay-agent/VERSION)" = "97"
          echo "D161_PHASE0A_CONTINUATION_STATIC=PASS"

  provider-continuation:
    name: phase0a-functions-fcm-hr-watch-control
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: beta
    env:
      PROJECT_ID: supra-inventory-beta
      REGION: asia-southeast1
      RUNTIME_SA: inventory-beta-runtime@supra-inventory-beta.iam.gserviceaccount.com
      ALERT_RUNTIME_SA: inventory-beta-alert-runtime@supra-inventory-beta.iam.gserviceaccount.com
      HR_SHEET_ID: 14UcBtXvK_uGHAiKU31Ofw3nwxsTl2IlLPUG9sX8ce7k
      BETA_HOSTNAME: ${{ vars.BETA_HOSTNAME }}
      FIREBASE_WEB_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
      AGENT_LOG_GATEWAY_URL_BETA: ${{ vars.AGENT_LOG_GATEWAY_URL_BETA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authenticate canonical runtime service account
        id: runtime_auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_RULES_SA_JSON_BETA }}

      - name: Prepare local Google OAuth client
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/d161-google-auth" --no-audit --no-fund google-auth-library@9.15.1 >/dev/null
          echo "GOOGLE_OAUTH_LOCAL_CLIENT=PASS"

      - uses: google-github-actions/setup-gcloud@v3

      - name: Prove HR Drive/Sheets read and Cloud Monitoring read
        shell: bash
        env:
          RUNTIME_CREDS: ${{ steps.runtime_auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          test -s "$RUNTIME_CREDS"
          RUNTIME_TOKEN="$(NODE_PATH="$RUNNER_TEMP/d161-google-auth/node_modules" RUNTIME_CREDS="$RUNTIME_CREDS" node <<'NODE'
          const {GoogleAuth}=require('google-auth-library');
          (async()=>{
            const auth=new GoogleAuth({
              keyFile:process.env.RUNTIME_CREDS,
              scopes:[
                'https://www.googleapis.com/auth/cloud-platform',
                'https://www.googleapis.com/auth/drive.readonly',
                'https://www.googleapis.com/auth/spreadsheets.readonly'
              ]
            });
            const client=await auth.getClient();
            const token=await client.getAccessToken();
            if(!token || !token.token) process.exit(2);
            process.stdout.write(token.token);
          })().catch(()=>process.exit(2));
          NODE
          )"
          test -n "$RUNTIME_TOKEN"
          echo "::add-mask::$RUNTIME_TOKEN"
          meta_code="$(curl -sS -o /tmp/hr-drive.json -w '%{http_code}' -H "Authorization: Bearer $RUNTIME_TOKEN" "https://www.googleapis.com/drive/v3/files/$HR_SHEET_ID?fields=id,name,mimeType")"
          test "$meta_code" = "200"
          jq -e --arg id "$HR_SHEET_ID" '.id==$id and .mimeType=="application/vnd.google-apps.spreadsheet"' /tmp/hr-drive.json >/dev/null
          range="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote("'Nhân sự'!A1:ZZ5", safe=""))
          PY
          )"
          sheet_code="$(curl -sS -o /tmp/hr-sheet.json -w '%{http_code}' -H "Authorization: Bearer $RUNTIME_TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$HR_SHEET_ID/values/$range?majorDimension=ROWS")"
          test "$sheet_code" = "200"
          jq -e '(.values // []) | length > 0' /tmp/hr-sheet.json >/dev/null

          end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          start="$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          mon_code="$(curl -sS -o /tmp/monitoring.json -w '%{http_code}' -G -H "Authorization: Bearer $RUNTIME_TOKEN" --data-urlencode 'filter=metric.type="firestore.googleapis.com/document/read_ops_count"' --data-urlencode "interval.startTime=$start" --data-urlencode "interval.endTime=$end" --data-urlencode 'view=HEADERS' "https://monitoring.googleapis.com/v3/projects/$PROJECT_ID/timeSeries")"
          test "$mon_code" = "200"
          echo "HR_DRIVE_READ=PASS"
          echo "HR_SHEETS_READ=PASS"
          echo "CLOUD_MONITORING_READ=PASS"

      - name: Prove authenticated Worker HR preview and Agent operations control request
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_WEB_API_KEY_BETA"
          test -n "$BETA_HOSTNAME"
          test -n "$AGENT_LOG_GATEWAY_URL_BETA"
          work="$RUNNER_TEMP/d161-firebase-admin"
          mkdir -p "$work"
          npm install --prefix "$work" --no-audit --no-fund firebase-admin@13.5.0 >/dev/null
          custom="$(NODE_PATH="$work/node_modules" node <<'NODE'
          const admin=require('firebase-admin');
          admin.initializeApp({credential:admin.credential.applicationDefault(),projectId:'supra-inventory-beta'});
          (async()=>{
            const user=await admin.auth().getUserByEmail('admin.admin@auth.supra.invalid');
            const token=await admin.auth().createCustomToken(user.uid,{
              app_user_id:'admin',app_role:'ADMIN',app_base_role:'ADMIN',
              app_session_channel:'AGENT',employee_code:'admin'
            });
            process.stdout.write(token);
          })().catch(()=>process.exit(2));
          NODE
          )"
          test -n "$custom"
          exchange_payload="$(jq -nc --arg token "$custom" '{token:$token,returnSecureToken:true}')"
          exchange="$(curl -fsS -X POST -H "Content-Type: application/json" --data "$exchange_payload" "https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=$FIREBASE_WEB_API_KEY_BETA")"
          id_token="$(jq -r '.idToken // empty' <<<"$exchange")"
          test -n "$id_token"
          echo "::add-mask::$id_token"

          source_json="$(curl -fsS -H "Authorization: Bearer $id_token" "https://$BETA_HOSTNAME/api/admin/hr-source")"
          jq -e --arg id "$HR_SHEET_ID" '.configured==true and .source.sheet_id==$id' <<<"$source_json" >/dev/null
          preview_code="$(curl -sS -o /tmp/hr-preview.json -w '%{http_code}' -X POST -H "Authorization: Bearer $id_token" -H "Content-Type: application/json" --data '{}' "https://$BETA_HOSTNAME/api/admin/hr-sync/preview")"
          test "$preview_code" = "200"
          jq -e '.status=="preview"' /tmp/hr-preview.json >/dev/null

          gateway="$(curl -fsSL "$AGENT_LOG_GATEWAY_URL_BETA")"
          jq -e '.ok==true and .service=="SUPRA_AGENT_OPERATIONS_GATEWAY_D160"' <<<"$gateway" >/dev/null
          control_payload="$(jq -nc --arg token "$id_token" '{action:"get_firestore_usage",id_token:$token}')"
          control="$(curl -fsSL -X POST -H "Content-Type: application/json" --data "$control_payload" "$AGENT_LOG_GATEWAY_URL_BETA")"
          jq -e '.error == null and .availability.reads == true' <<<"$control" >/dev/null
          echo "WORKER_HR_RUNTIME_PREVIEW=PASS"
          echo "AGENT_GATEWAY_AUTH_CONTROL=PASS"

      - name: Authenticate Functions deploy identity
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_FUNCTIONS_SA_JSON_BETA }}

      - name: Verify deployed Gen2 function identities
        shell: bash
        run: |
          set -euo pipefail
          for fn in pickerAlertCreated pickerAlertResolved pickerActiveCallCreated pickerActiveCallResolved operatingScheduleChanged agentLogUploadWritten; do
            runtime="$(gcloud functions describe "$fn" --gen2 --region "$REGION" --project "$PROJECT_ID" --format='value(serviceConfig.serviceAccountEmail)')"
            test "$runtime" = "$ALERT_RUNTIME_SA" || { echo "Unexpected runtime identity for $fn" >&2; exit 1; }
          done
          echo "GEN2_FUNCTIONS_RUNTIME_IDENTITY=PASS"

      - name: Prove FCM validate-only and HR Drive watch lifecycle with disposable callback
        shell: bash
        env:
          RUNTIME_CREDS: ${{ steps.runtime_auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          test -s "$RUNTIME_CREDS"
          RUNTIME_TOKEN="$(NODE_PATH="$RUNNER_TEMP/d161-google-auth/node_modules" RUNTIME_CREDS="$RUNTIME_CREDS" node <<'NODE'
          const {GoogleAuth}=require('google-auth-library');
          (async()=>{
            const auth=new GoogleAuth({
              keyFile:process.env.RUNTIME_CREDS,
              scopes:[
                'https://www.googleapis.com/auth/cloud-platform',
                'https://www.googleapis.com/auth/drive.readonly',
                'https://www.googleapis.com/auth/spreadsheets.readonly'
              ]
            });
            const client=await auth.getClient();
            const token=await client.getAccessToken();
            if(!token || !token.token) process.exit(2);
            process.stdout.write(token.token);
          })().catch(()=>process.exit(2));
          NODE
          )"
          test -n "$RUNTIME_TOKEN"
          echo "::add-mask::$RUNTIME_TOKEN"
          fn="d161Phase0aCanary"
          doc="d161_phase0a_watch_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          work="$(mktemp -d)"
          uri=""
          ch1=""
          rid1=""
          ch2=""
          rid2=""

          cleanup() {
            set +e
            if [ -n "$ch1" ] && [ -n "$rid1" ]; then
              curl -sS -o /dev/null -X POST -H "Authorization: Bearer $RUNTIME_TOKEN" -H "Content-Type: application/json" --data "$(jq -nc --arg id "$ch1" --arg rid "$rid1" '{id:$id,resourceId:$rid}')" "https://www.googleapis.com/drive/v3/channels/stop" || true
            fi
            if [ -n "$ch2" ] && [ -n "$rid2" ]; then
              curl -sS -o /dev/null -X POST -H "Authorization: Bearer $RUNTIME_TOKEN" -H "Content-Type: application/json" --data "$(jq -nc --arg id "$ch2" --arg rid "$rid2" '{id:$id,resourceId:$rid}')" "https://www.googleapis.com/drive/v3/channels/stop" || true
            fi
            curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $RUNTIME_TOKEN" "https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/(default)/documents/relay_poc_coordination/$doc" || true
            gcloud functions delete "$fn" --gen2 --region "$REGION" --project "$PROJECT_ID" --quiet >/dev/null 2>&1 || true
            rm -rf "$work"
          }
          trap cleanup EXIT

          gcloud functions delete "$fn" --gen2 --region "$REGION" --project "$PROJECT_ID" --quiet >/dev/null 2>&1 || true
          cat > "$work/package.json" <<'JSON'
          {"private":true,"engines":{"node":"22"},"dependencies":{"@google-cloud/firestore":"^7.11.5","@google-cloud/functions-framework":"^4.0.0","google-auth-library":"^9.15.1"}}
          JSON
          cat > "$work/index.js" <<'JS'
          const {Firestore,FieldValue}=require('@google-cloud/firestore');
          const {GoogleAuth}=require('google-auth-library');
          const db=new Firestore();
          exports.handler=async(req,res)=>{
            try{
              if(req.method==='POST' && req.get('x-goog-resource-state')){
                await db.doc('relay_poc_coordination/'+process.env.CANARY_DOC_ID).set({
                  count:FieldValue.increment(1),
                  last_state:String(req.get('x-goog-resource-state')||''),
                  updated_at:FieldValue.serverTimestamp()
                },{merge:true});
                return res.status(204).send('');
              }
              if(String(req.query.mode||'')==='fcm'){
                const auth=new GoogleAuth({scopes:['https://www.googleapis.com/auth/firebase.messaging']});
                const client=await auth.getClient();
                const headers=await client.getRequestHeaders();
                const response=await fetch('https://fcm.googleapis.com/v1/projects/'+process.env.PROJECT_ID+'/messages:send',{
                  method:'POST',
                  headers:{...headers,'content-type':'application/json'},
                  body:JSON.stringify({validate_only:true,message:{topic:'d161-phase0a-validation-only',data:{probe:'1'}}})
                });
                const text=await response.text();
                res.status(response.status).type('application/json').send(text);
                return;
              }
              res.json({ok:true});
            }catch(e){
              res.status(500).json({ok:false,error:String(e&&e.message||e).slice(0,160)});
            }
          };
          JS

          gcloud functions deploy "$fn" --gen2 --runtime nodejs22 --region "$REGION" --project "$PROJECT_ID" --source "$work" --entry-point handler --trigger-http --allow-unauthenticated --service-account "$ALERT_RUNTIME_SA" --set-env-vars "PROJECT_ID=$PROJECT_ID,CANARY_DOC_ID=$doc" --quiet >/dev/null
          uri="$(gcloud functions describe "$fn" --gen2 --region "$REGION" --project "$PROJECT_ID" --format='value(serviceConfig.uri)')"
          test -n "$uri"
          fcm_code="$(curl -sS -o /tmp/fcm.json -w '%{http_code}' "$uri?mode=fcm")"
          test "$fcm_code" = "200"
          echo "FCM_RUNTIME_VALIDATE_ONLY=PASS"

          wait_count() {
            local expected="$1"
            for _ in $(seq 1 30); do
              current="$(curl -sS -H "Authorization: Bearer $RUNTIME_TOKEN" "https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/(default)/documents/relay_poc_coordination/$doc" | jq -r '.fields.count.integerValue // "0"' 2>/dev/null || echo 0)"
              if [ "$current" -ge "$expected" ] 2>/dev/null; then return 0; fi
              sleep 1
            done
            return 1
          }

          exp="$(( $(date +%s%3N) + 10*60*1000 ))"
          ch1="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          body1="$(jq -nc --arg id "$ch1" --arg address "$uri" --arg exp "$exp" '{id:$id,type:"web_hook",address:$address,expiration:$exp}')"
          watch1_code="$(curl -sS -o /tmp/watch1.json -w '%{http_code}' -X POST -H "Authorization: Bearer $RUNTIME_TOKEN" -H "Content-Type: application/json" --data "$body1" "https://www.googleapis.com/drive/v3/files/$HR_SHEET_ID/watch")"
          test "$watch1_code" = "200"
          rid1="$(jq -r '.resourceId // empty' /tmp/watch1.json)"
          test -n "$rid1"
          wait_count 1

          ch2="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          body2="$(jq -nc --arg id "$ch2" --arg address "$uri" --arg exp "$exp" '{id:$id,type:"web_hook",address:$address,expiration:$exp}')"
          watch2_code="$(curl -sS -o /tmp/watch2.json -w '%{http_code}' -X POST -H "Authorization: Bearer $RUNTIME_TOKEN" -H "Content-Type: application/json" --data "$body2" "https://www.googleapis.com/drive/v3/files/$HR_SHEET_ID/watch")"
          test "$watch2_code" = "200"
          rid2="$(jq -r '.resourceId // empty' /tmp/watch2.json)"
          test -n "$rid2"
          wait_count 2

          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $RUNTIME_TOKEN" -H "Content-Type: application/json" --data "$(jq -nc --arg id "$ch1" --arg rid "$rid1" '{id:$id,resourceId:$rid}')" "https://www.googleapis.com/drive/v3/channels/stop"
          ch1=""; rid1=""
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $RUNTIME_TOKEN" -H "Content-Type: application/json" --data "$(jq -nc --arg id "$ch2" --arg rid "$rid2" '{id:$id,resourceId:$rid}')" "https://www.googleapis.com/drive/v3/channels/stop"
          ch2=""; rid2=""
          curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $RUNTIME_TOKEN" "https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/(default)/documents/relay_poc_coordination/$doc"
          gcloud functions delete "$fn" --gen2 --region "$REGION" --project "$PROJECT_ID" --quiet >/dev/null
          uri=""
          rm -rf "$work"
          trap - EXIT
          echo "HR_DRIVE_WATCH_INITIAL_SYNC_REPLACE_STOP_CLEANUP=PASS"
          echo "DISPOSABLE_PROVIDER_CANARY_CLEANUP=PASS"

  agent-build:
    name: phase0a-agent-v97-reproducible-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: provider-continuation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build accepted v97 source and run startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((Get-Content relay-agent/VERSION -Raw).Trim() -ne "97") { throw "Accepted source is not v97." }
          dotnet build relay-agent/SupraInventoryRelayAgent.csproj -c Release
          $exe = (Resolve-Path "relay-agent/bin/Release/net48/Agent Auto Confirm Pick Pack.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--startup-smoke" -PassThru
          if (-not $p.WaitForExit(15000)) { try { $p.Kill() } catch {}; throw "Agent startup smoke timed out." }
          if ($p.ExitCode -ne 0) { throw "Agent startup smoke failed." }
          Write-Host "AGENT_V97_REPRODUCIBLE_BUILD=PASS"

  phase0a-continuation:
    name: phase0a-continuation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [provider-continuation, agent-build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "D161_PHASE0A_CONTINUATION=PASS"
          echo "Aggregate with fresh Phase0A core canaries and Apps Script lifecycle evidence."
