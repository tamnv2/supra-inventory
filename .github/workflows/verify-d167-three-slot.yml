name: D167 three-slot SKU pure contract (code only)
on:
  pull_request:
    paths:
      - "service/src/d167-sku-*.ts"
      - "service/src/d167-web-full-replace.ts"
      - "service/src/d167-area-report-core.ts"
      - "service/src/sku-import-core.ts"
      - "service/src/business-core.ts"
      - "service/src/business-api.ts"
      - "service/src/read-model-core.ts"
      - "web/src/sku-excel.ts"
      - "web/src/report-excel.ts"
      - "web/src/operational-app.ts"
      - "web/src/api.ts"
      - "relay-agent/D167Sku*.cs"
      - "relay-agent/SupraConfirmBrowserD167.cs"
      - "relay-agent/SupraConfirmBrowser.cs"
      - "relay-agent-webview2-host/**"
      - "relay-agent/Program.cs"
      - "tests/d167-three-slot-sku.test.mjs"
      - "tests/d167-full-roster-sql.test.py"
      - ".github/workflows/verify-d167-three-slot.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: D167 source and diff behavior
        run: node --experimental-strip-types --test tests/d167-three-slot-sku.test.mjs
      - name: D167 existing-master FULL/DELTA SQL migration regression
        run: python3 tests/d167-full-roster-sql.test.py
      - name: Type-check InventoryCore
        working-directory: service
        run: npm install --ignore-scripts --no-audit --no-fund && npm run typecheck
  agent-schedule:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build D167 managed WebView2 host (no release)
        shell: pwsh
        run: dotnet build relay-agent-webview2-host/SupraInventoryWebView2Host.csproj -c Release --nologo
      - name: Build isolated Windows Agent (no release)
        shell: pwsh
        run: dotnet build relay-agent/SupraInventoryRelayAgent.csproj -c Release --nologo
      - name: D167 offline VN slot and failover guard
        shell: pwsh
        run: |
          $exe = (Resolve-Path "relay-agent/bin/Release/net48/Agent Auto Confirm Pick Pack.exe").Path
          $test = Start-Process -FilePath $exe -ArgumentList "--d167-sku-schedule-self-test" -PassThru
          if (-not $test.WaitForExit(20000)) {
            try { $test.Kill() } catch {}
            throw "D167 Agent scheduler test timed out."
          }
          if ($test.ExitCode -ne 0) { throw "D167 Agent schedule failed exit=$($test.ExitCode)" }
          Write-Host "D167 offline Agent slot self-test PASS; no WMS/Firebase activity."
