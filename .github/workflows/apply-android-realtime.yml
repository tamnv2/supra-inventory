name: Apply Android Realtime Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-android-realtime.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic Android realtime patch
        run: python tools/apply_android_realtime.py

      - name: Validate canonical state
        run: python tools/project_state_guard.py

      - name: Commit Android realtime client
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ops/project-state.json ops/resource-registry.json
          git commit -m "feat(android): wire foreground realtime client"
          git push origin HEAD:main
