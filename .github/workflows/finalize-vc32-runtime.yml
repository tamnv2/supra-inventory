name: Finalize vc32 Runtime Evidence

on:
  push:
    branches: [chore/record-vc32-runtime-evidence]
    paths:
      - "tools/finalize_vc32_runtime.py"
      - ".github/workflows/finalize-vc32-runtime.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/record-vc32-runtime-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Finalize canonical runtime evidence
        run: python3 tools/finalize_vc32_runtime.py
      - name: Validate JSON and canonical guards
        run: |
          set -euo pipefail
          python3 -m json.tool ops/project-scope.json >/dev/null
          python3 -m json.tool ops/project-state.json >/dev/null
          python3 -m json.tool ops/resource-registry.json >/dev/null
          python3 tools/project_state_guard.py
          python3 tools/authority_guard.py
      - name: Commit final evidence and remove temporary automation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/project-scope.json ops/project-state.json ops/resource-registry.json docs/OWNER_DECISIONS.md docs/specs/README.md docs/specs/ACCEPTANCE_TESTING.md docs/handovers/HANDOVER_CURRENT.md docs/SERVICE_READINESS.md
          git rm tools/finalize_vc32_runtime.py .github/workflows/finalize-vc32-runtime.yml
          git commit -m "chore: record beta-vc32 runtime evidence"
          git push origin HEAD:chore/record-vc32-runtime-evidence
