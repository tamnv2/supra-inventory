name: D172 OBPP1291 signed GitHub APK release
on:
  push:
    branches: [main]
    paths:
      - "obpp1291/**"
      - ".github/workflows/release-obpp1291.yml"
      - "ops/d172-release-authorization.json"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: d172-obpp1291-signed-release
  cancel-in-progress: false
jobs:
  release:
    # E016/E034/E041/E043/E048 are Worker-only. Never sign APK or change OTA manifest.
    if: ${{ !startsWith(github.event.head_commit.message, 'D172-E016_WORKER_ONLY:') && !startsWith(github.event.head_commit.message, 'D172-E034_WORKER_ONLY:') && !startsWith(github.event.head_commit.message, 'D172-E041_WORKER_ONLY:') && !startsWith(github.event.head_commit.message, 'D172-E043_WORKER_ONLY:') && !startsWith(github.event.head_commit.message, 'D172-E048_WORKER_ONLY:') }}
    runs-on: ubuntu-latest
    environment: beta
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify D172 exact-source Owner release receipt
        run: python3 tools/d172_release_gate.py --component android
      - name: Require deployed exact main Worker source plus OBPP readiness before signing
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            health="$(curl --fail --silent --show-error --max-time 15 https://inventory.supra.cc.cd/health || true)"
            ready="$(curl --fail --silent --show-error --max-time 15 https://inventory.supra.cc.cd/api/obpp1291/status || true)"
            source="$(jq -r '.source_commit // ""' <<<"$health" 2>/dev/null || true)"
            # E029 is Android-UI-only. Do not redeploy the shared Worker just
            # to match a docs/APK commit: require its exact last deployed SHA.
            expected_worker_sha="$GITHUB_SHA"
            # E038 changes both existing Worker and the separate APK; the
            # source must match this exact protected main merge after Worker deploy.
            if jq -e '.e038_qr_draft_dedupe_note.status=="OWNER_EXPLICIT_DEPLOY_APPROVED"' ops/d172-release-authorization.json >/dev/null 2>&1; then
              expected_worker_sha="$GITHUB_SHA"
            elif jq -e '.e029_compact_ui.status=="OWNER_EXPLICIT_DEPLOY_APPROVED"' ops/d172-release-authorization.json >/dev/null 2>&1; then
              expected_worker_sha="$(jq -r '.e029_compact_ui.expected_existing_worker_sha // ""' ops/d172-release-authorization.json)"
              [ "$expected_worker_sha" = "80886eced4aa1a85b236c67097fd7924376e1426" ] || {
                echo "::error::E029 registered Worker source receipt mismatch"; exit 1;
              }
            fi
            if [ "$source" = "$expected_worker_sha" ] &&
               jq -e '.status=="ok"' <<<"$health" >/dev/null 2>&1 &&
               jq -e '.status=="READY" and .sheet=="SCOPED_CONNECTED"' <<<"$ready" >/dev/null 2>&1; then
              code="$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' \
                -H 'Content-Type: application/json' \
                --data '{"username":"d172_no_registered_user_probe","password":"invalid_probe"}' \
                https://inventory.supra.cc.cd/api/obpp1291/session/login || true)"
              [ "$code" = "401" ] || { echo "::error::OBPP isolated login unauthenticated boundary returned HTTP $code"; exit 1; }
              echo "D172_E010_EXACT_WORKER_HEALTH_AND_LOGIN_NEGATIVE_PROBE_PASS"
              exit 0
            fi
            sleep 10
          done
          echo "::error::D172 E010 exact Worker SHA not deployed/healthy; signed APK release denied"
          exit 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Prepare version and pinned existing signer
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_B64: ${{ secrets.BETA_KEYSTORE_B64 }}
          SIGNER_STORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
          SIGNER_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
          SIGNER_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$SIGNER_B64" ] && [ -n "$SIGNER_STORE_PASSWORD" ] &&
          [ -n "$SIGNER_ALIAS" ] && [ -n "$SIGNER_KEY_PASSWORD" ] ||
            { echo "::error::Signer not provisioned"; exit 1; }
          latest="$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(test("^obpp1291-v[0-9]+$")) | capture("^obpp1291-v(?<n>[0-9]+)$").n | tonumber] | max // 0')"
          version="$((latest + 1))"
          echo "OBPP_VERSION_CODE=$version" >> "$GITHUB_ENV"
          echo "OBPP_VERSION_NAME=1.0.$version" >> "$GITHUB_ENV"
          key_path="$RUNNER_TEMP/obpp1291-signer.jks"
          printf '%s' "$SIGNER_B64" | base64 -d > "$key_path"
          keytool -list -keystore "$key_path" -storepass "$SIGNER_STORE_PASSWORD" -alias "$SIGNER_ALIAS" >/dev/null
          echo "OBPP_SIGNING_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          echo "OBPP_SIGNING_STORE_PASSWORD=$SIGNER_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "OBPP_SIGNING_KEY_ALIAS=$SIGNER_ALIAS" >> "$GITHUB_ENV"
          echo "OBPP_SIGNING_KEY_PASSWORD=$SIGNER_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed Android APK
        run: |
          set -euo pipefail
          gradle -p obpp1291/android :app:testDebugUnitTest :app:assembleRelease --no-daemon
          mkdir -p obpp1291/dist
          cp obpp1291/android/app/build/outputs/apk/release/app-release.apk obpp1291/dist/obpp1291.apk
          sha256sum obpp1291/dist/obpp1291.apk | awk '{print $1}' > obpp1291/dist/apk.sha256
      - name: Publish isolated version and mutable manifest channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$OBPP_VERSION_CODE"
          tag="obpp1291-v$code"
          asset="obpp1291/dist/obpp1291.apk"
          sha="$(cat obpp1291/dist/apk.sha256)"
          test "$(wc -c < "$asset")" -gt 100000
          gh release create "$tag" "$asset" --target "$GITHUB_SHA" \
            --title "Hàng rớt OB × PP1291 v$code" \
            --notes "Phiên bản Android nội bộ OB × PP1291. Không thay đổi Inventory/Confirm Picklist." \
            --latest=false
          jq -n --arg package "cd.cc.supra.obpp1291" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/obpp1291.apk" \
            --arg sha "$sha" --arg name "$OBPP_VERSION_NAME" --argjson code "$code" \
            '{package_name:$package,version_code:$code,version_name:$name,apk_url:$url,sha256:$sha}' \
              > obpp1291/dist/obpp1291-latest.json
          if gh release view obpp1291-latest >/dev/null 2>&1; then
            gh release upload obpp1291-latest obpp1291/dist/obpp1291-latest.json --clobber
          else
            gh release create obpp1291-latest obpp1291/dist/obpp1291-latest.json \
              --target "$GITHUB_SHA" --title "OBPP1291 cập nhật mới nhất" \
              --notes "Chỉ thông tin cập nhật cho app OBPP1291; APK ở release phiên bản riêng." --latest=false
          fi
          echo "D172_SIGNED_RELEASE_SUCCESS_TAG=$tag"
