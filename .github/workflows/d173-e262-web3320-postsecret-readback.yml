name: D173 E262 Web3320 post-secret production readback
on:
  pull_request:
    paths:
      - '.github/workflows/d173-e262-web3320-postsecret-readback.yml'
      - 'docs/D173_E262_WEB3320_POSTSECRET_RELEASE_RECOVERY_2026-11-13.md'
permissions:
  contents: read
jobs:
  readonly:
    if: contains(github.head_ref, 'd173-e262-web3320-postsecret-readback')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: E262 exact release recovery and D172 source-only CI
        run: |
          node --test tests/d173-e262-web3320-recovery.test.mjs
          python3 tools/d173_e262_web3320_recovery_gate.py --component worker --preflight
          python3 tools/d173_isolation_guard.py --base 099d01571399cf57615f6efbbf34f61c03d265ec --head HEAD
      - name: Read official Worker health without credentials or mutations
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp)"
          trap 'rm -f "$out"' EXIT
          code="$(curl -sS --connect-timeout 5 --max-time 20 -o "$out" -w '%{http_code}' 'https://inventory.supra.cc.cd/health' || true)"
          if [[ "$code" != "200" ]]; then
            echo "::error::D173_E262_HEALTH_HTTP_$code"
            exit 1
          fi
          jq -e '.status=="ok" and .environment=="beta" and .storage.ok==true and (.missing_bindings|length)==0' "$out" >/dev/null
          echo "D173_E262_POSTSECRET_READBACK observed_source=$(jq -r '.source_commit // "NONE"' "$out") expected=099d01571399cf57615f6efbbf34f61c03d265ec status=$(jq -r .status "$out") schema=$(jq -r .storage.schema_version "$out")/$(jq -r .storage.expected_schema_version "$out") operational=$(jq -r .storage.operational_v2.schema_version "$out")/$(jq -r .storage.operational_v2.expected_schema_version "$out")"
      - name: Verify public Web shell and protected business endpoint
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 5 --max-time 20 -o /dev/null -w '%{http_code}' 'https://inventory.supra.cc.cd/')"
          [[ "$code" == "200" ]]
          code="$(curl -sS --connect-timeout 5 --max-time 20 -o /dev/null -w '%{http_code}' 'https://inventory.supra.cc.cd/api/admin/overview?from=2026-11-12T17%3A00%3A00Z&to=2026-11-13T17%3A00%3A00Z&day_from=2026-11-13&day_to=2026-11-13')"
          [[ "$code" == "401" || "$code" == "403" ]]
          echo 'D173_E262_READONLY_SHELL_AND_RBAC_PASS'
