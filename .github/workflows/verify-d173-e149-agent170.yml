name: D173 E149 Agent170 CODE ONLY Activity Web Tab D172 Guard
on:
  pull_request:
    paths:
      - "relay-agent/**"
      - "relay-agent-webview2-host/**"
      - "tests/d173-e149-agent170-activity-webtab.test.mjs"
      - "tests/d173-e159-agent172-remediation.test.mjs"
      - "tests/d173-e161-agent173-webview-recovery.test.mjs"
      - "tools/d173_e161_agent173_release_gate.py"
      - "ops/d173-e161-agent173-release-authorization.json"
      - "docs/D173_E159_AGENT172_OWNER_APPROVED_IMPLEMENTATION_2026-11-07.md"
      - "docs/D173_E149_AGENT170_ACTIVITY_BROWSER_FIRE_BUDGET_2026-11-07.md"
      - ".github/workflows/verify-d173-e149-agent170.yml"
      - "tools/d173_e150_agent170_release_gate.py"
      - "ops/d173-e150-agent170-release-authorization.json"
      - "ops/project-state.json"
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Historical E150 receipt or E152 code-only authority; never authorize v171 release
        run: |
          version="$(cat relay-agent/VERSION)"
          if [ "$version" = "170" ]; then
            python3 tools/d173_e150_agent170_release_gate.py --component agent --preflight
          elif [ "$version" = "171" ]; then
            python3 tools/d173_e060_vps_usage_guard.py
            python3 tools/d173_e064_agent_history_usage_guard.py
            echo "E152_AGENT171_CODE_ONLY_SCOPE_PASS__NO_RELEASE"
          elif [ "$version" = "172" ]; then
            python3 tools/d173_e060_vps_usage_guard.py
            python3 tools/d173_e064_agent_history_usage_guard.py
            node --test tests/d173-e159-agent172-remediation.test.mjs
            echo "E159_AGENT172_OWNER_CODE_SCOPE_PASS__SIGNED_RELEASE_REQUIRES_EXACT_GATE"
          elif [ "$version" = "179" ] && [ "$GITHUB_HEAD_REF" = "fix/d173-e181-agent179-overview-40-60-web-presence-20261110" ]; then
            python3 tools/d173_e181_agent179_release_gate.py --component agent --preflight
            node --test tests/d173-e181-agent179-layout-web-presence.test.mjs
            python3 tools/d173_e060_vps_usage_guard.py
            python3 tools/d173_e064_agent_history_usage_guard.py
            node --test tests/d173-e175-unified-network.test.mjs
            echo "E181_AGENT179_SEPARATE_OWNER_SCOPE__OLD_RELEASE_DENIED"
          elif [ "$version" = "178" ] && [ "$GITHUB_HEAD_REF" = "feat/d173-e179-agent178-no-scroll-50-50-20261110" ]; then
            # E179 Owner-approved Agent UI only; never grant old E149/E175 releases.
            node --test tests/d173-e179-agent178-layout.test.mjs
            python3 tools/d173_e060_vps_usage_guard.py
            python3 tools/d173_e064_agent_history_usage_guard.py
            node --test tests/d173-e175-unified-network.test.mjs
            if python3 tools/d173_e175_release_gate.py --component agent --preflight >/dev/null 2>&1; then
              echo "::error::Agent178 inherited E175 Agent177 release grant"; exit 1
            fi
            echo "E179_AGENT178_SEPARATE_OWNER_SCOPE__OLD_RELEASE_DENIED"
          elif [ "$version" = "177" ] && { [ "$GITHUB_HEAD_REF" = "feat/d173-e175-unified-network-logs-ui-20261110" ] || [ "$GITHUB_HEAD_REF" = "fix/d173-e175-production-release-workflow-repair-20261110" ] || [ "$GITHUB_HEAD_REF" = "fix/d173-e175-d146-ten-slot-production-20261110" ]; }; then
            # Do not inherit E174 or E170 signed release rights.
            if python3 tools/d173_e174_agent176_release_gate.py --component agent --preflight >/dev/null 2>&1; then
              echo "::error::Agent177 inherited Agent176 release permission"; exit 1
            fi
            python3 tools/d173_e175_release_gate.py --component agent --preflight
            python3 tools/d173_e060_vps_usage_guard.py
            python3 tools/d173_e064_agent_history_usage_guard.py
            node --test tests/d173-e161-agent173-webview-recovery.test.mjs
            node --test tests/d173-e174-agent-focus.test.mjs
            node --test tests/d173-e175-unified-network.test.mjs
            echo "E175_AGENT177_NEW_OWNER_SCOPE__HISTORICAL_RELEASE_DENIED"
          elif [ "$version" = "176" ]; then
            # E174 is Agent176 focus-only: old E149/E170 signed scopes must
            # not accidentally authorize the newer binary.
            if python3 tools/d173_e170_release_gate.py --component agent --preflight >/dev/null 2>&1; then
              echo "::error::Agent176 inherited Agent175 diagnostic release authority"
              exit 1
            fi
            python3 tools/d173_e174_agent176_release_gate.py --component agent --preflight
            python3 tools/d173_e060_vps_usage_guard.py
            python3 tools/d173_e064_agent_history_usage_guard.py
            node --test tests/d173-e161-agent173-webview-recovery.test.mjs
            node --test tests/d173-e165-agent-tray-usage-window.test.mjs
            node --test tests/d173-e165-log-cadence.test.mjs
            node --test tests/d173-e174-agent-focus.test.mjs
            echo "E174_AGENT176_FOCUS_AND_HISTORIC_CODE_GUARDS_PASS"
          elif [ "$version" = "175" ]; then
            python3 tools/d173_e170_release_gate.py --component agent --preflight
            node --test tests/d173-e169-diagnostic-attribution.test.mjs
            node --test tests/d173-e170-daily-evidence.test.mjs
            python3 tools/d173_e060_vps_usage_guard.py
            python3 tools/d173_e064_agent_history_usage_guard.py
            node --test tests/d173-e161-agent173-webview-recovery.test.mjs
            node --test tests/d173-e165-agent-tray-usage-window.test.mjs
            node --test tests/d173-e165-log-cadence.test.mjs
            echo "E170_AGENT175_DIAGNOSTIC_CODE_ONLY_SOURCE_PASS"
          elif [ "$version" = "174" ]; then
            if [ "${{ github.head_ref }}" = "feat/d173-e169-diagnostic-attribution-20261108" ]; then
              # Diagnostics CODE ONLY: previous Agent174 release pin must deny a changed binary.
              if python3 tools/d173_e165_agent174_release_gate.py --component agent --preflight >/dev/null 2>&1; then
                echo "Unsafe: E169 inherited E165 Agent174 signed-release authorization" >&2
                exit 1
              fi
              node --test tests/d173-e169-diagnostic-attribution.test.mjs
              echo "E169_OLD_AGENT_RELEASE_GATE_DENIED__CODE_ONLY_CHECKS_CONTINUE"
            else
              python3 tools/d173_e165_agent174_release_gate.py --component agent --preflight
            fi
            python3 tools/d173_e060_vps_usage_guard.py
            python3 tools/d173_e064_agent_history_usage_guard.py
            node --test tests/d173-e161-agent173-webview-recovery.test.mjs
            node --test tests/d173-e165-agent-tray-usage-window.test.mjs
          node --test tests/d173-e165-log-cadence.test.mjs
            echo "E165_AGENT174_OWNER_SCOPE_AND_SOURCE_PASS__RELEASE_REQUIRES_SIGNED_GATE"
          elif [ "$version" = "173" ]; then
            # E161 release pin is only applicable to E161 Agent/Host source changes.
            # Do not make a separate read-only E162 Usage PR fail its E161
            # exact-path release authorization; never skip for Agent/Host edits.
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            git fetch --no-tags --depth=1 origin "$base" >/dev/null
            if git diff --name-only "$base" "$head" | grep -Eq '^(relay-agent/|relay-agent-webview2-host/|tools/d173_e161_agent173_release_gate.py$|ops/d173-e161-agent173-release-authorization.json$|tests/d173-e161-agent173-webview-recovery.test.mjs$)'; then
              python3 tools/d173_e161_agent173_release_gate.py --component agent --preflight
            else
              echo "E161_AGENT173_RELEASE_PIN_NOT_APPLICABLE_TO_USAGE_ONLY_PR"
            fi
            node --test tests/d173-e161-agent173-webview-recovery.test.mjs
            echo "E161_AGENT173_OWNER_CODE_SCOPE_PASS__SIGNED_RELEASE_REQUIRES_EXACT_GATE"
          else
            echo "Unapproved version for E149/E152" >&2
            exit 1
          fi
      - name: Agent170 activity, Web tab and manual-refresh contract
        run: |
          node --test tests/d173-e149-agent170-activity-webtab.test.mjs
          node --test tests/d173-e159-agent172-remediation.test.mjs
          node --test tests/d173-e161-agent173-webview-recovery.test.mjs
          node --test tests/d169-agent-web-tab-canary.test.mjs
          node --test tests/d173-e141-agent-ha-web-shield.test.mjs
          node --test tests/d173-e143-agent168-roster-webview.test.mjs
          node --test tests/d173-e148-manual-roster-refresh.test.mjs
      - name: D172 isolated regressions for shared Firestore activity document
        run: |
          npm --prefix service install --no-package-lock --ignore-scripts --no-audit --no-fund
          node --test tests/d172-*.test.mjs
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Compile x64 Agent170 and existing Host12; no release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet build relay-agent/SupraInventoryRelayAgent.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "E149_NATIVE_AGENT_FAILED" }
          dotnet build relay-agent-webview2-host/SupraInventoryWebView2Host.csproj -c Release -p:PlatformTarget=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw "E149_NATIVE_HOST_FAILED" }
      - name: Run offline Agent smoke and E103 activity validation
        shell: pwsh
        run: |
          $exe = (Resolve-Path "relay-agent/bin/Release/net48/Agent Auto Confirm Pick Pack.exe").Path
          foreach ($arg in @("--startup-smoke", "--e103-activity-self-test")) {
            $process = Start-Process -FilePath $exe -ArgumentList $arg -PassThru
            if (!$process.WaitForExit(15000)) {
              try { $process.Kill() } catch {}
              throw "E149_SMOKE_TIMEOUT_$arg"
            }
            if ($process.ExitCode -ne 0) { throw "E149_SMOKE_FAILED_$arg" }
          }
          Write-Host "E149_AGENT170_NATIVE_CODE_PASS_NO_RELEASE"
