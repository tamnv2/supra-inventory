name: D171 One-shot Offline Preflight
on:
  pull_request:
    paths:
      - "tools/d171-one-shot/**"
      - ".github/workflows/verify-d171-one-shot-offline.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full offline phase and leadership simulation
        run: python3 tools/d171-one-shot/simulate.py > d171_one_shot_offline_result.json
      - name: Offline max-load replay (no provider calls)
        run: python3 tools/d171-one-shot/load_replay.py > d171_max_load_offline_result.json
      - name: Fail closed if any field or billing result is mistakenly claimed
        run: |
          python3 - <<'PY'
          import json
          a=json.load(open("d171_one_shot_offline_result.json",encoding="utf-8"))
          b=json.load(open("d171_max_load_offline_result.json",encoding="utf-8"))
          assert b["status"]=="OFFLINE_LOGIC_REPLAY_PASS" and len(b["scenarios"])==3
          assert all(x["firestore_requests"]==0 and x["immutable_jobs"]==2000 and x["terminal_acks"]==1998 for x in b["scenarios"])
          e=a["e026"]
          assert e["status"]=="OFFLINE_E026_SCENARIO_PASS"
          assert e["firebase_requests"]==0 and e["owner_pass"] is False
          assert e["physical_new_rounds_verified"] is False
          assert e["historical_ha3"].startswith("SLA_MISS")
          assert e["test_ha3_not_repeated_nine_cases"] is True
          assert [r["phase"] for r in e["simulated_only_remaining_link_phases"]]==[4,5]
          assert e["tested_ha3_two_directions"][1][2]=="HA_SLA_MISS"
          assert a["live_firebase_requests"] == 0
          assert a["field_pass"] is False and a["owner_pass"] is False
          assert a["test_gate"]["status"] == "OFFLINE_SIM_PASS" and len(a["test_gate"]["rounds"]) == 5
          assert all(p["dual_ack"] == 9 for p in a["test_gate"]["rounds"])
          assert a["ha_gate"]["single_primary"] and a["ha_gate"]["uncertain_guard"]
          assert all(not s["billing_verified"] and not s["can_claim_free_usage_guarantee"] for s in a["usage_samples"])
          print("D171_OFFLINE_ONE_SHOT_PREFLIGHT_PASS; PHYSICAL_OFFICE_UNVERIFIED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: D171-OFFLINE-SIMULATION-EVIDENCE
          path: |
            d171_one_shot_offline_result.json
            d171_max_load_offline_result.json
          retention-days: 14
