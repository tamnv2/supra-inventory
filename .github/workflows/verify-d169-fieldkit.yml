name: D169 Fieldkit Real Picker Android
on:
  pull_request:
    paths:
      - "tools/d169-fieldkit-android/**"
      - ".github/workflows/verify-d169-fieldkit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fieldkit-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Check configured Firebase project
        env:
          FIREBASE_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
        run: |
          test -n "$FIREBASE_API_KEY_BETA"
          test "${#FIREBASE_API_KEY_BETA}" -ge 20
      - name: Stage audited Picker Kotlin sources and resources into isolated module
        run: |
          cp -a android/app/src/main/java/. tools/d169-fieldkit-android/app/src/main/java/
          mkdir -p tools/d169-fieldkit-android/app/src/main/res
          cp -a android/app/src/main/res/. tools/d169-fieldkit-android/app/src/main/res/
      - name: Compile isolated but real Picker source
        env:
          FIREBASE_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
        run: gradle -p tools/d169-fieldkit-android :app:assembleDebug --no-daemon
      - name: Verify signed debug APK and no original source changes
        run: |
          test -s tools/d169-fieldkit-android/app/build/outputs/apk/debug/app-debug.apk
          ! git diff --name-only origin/main...HEAD | grep -E '^(android/|relay-agent/|service/|web/|firebase/)'
      - uses: actions/upload-artifact@v4
        with:
          name: SUPRA-D169-REAL-PICKER-FIELDKIT-APK
          path: tools/d169-fieldkit-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
