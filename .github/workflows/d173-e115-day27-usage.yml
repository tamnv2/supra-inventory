name: D173 E115 Historical Oct27 Provider Traffic Readonly
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  historical-cloudflare-day27:
    if: github.event.pull_request.head.ref == 'poc/d173-e115-27oct-trace-driven-replay-20261031'
    runs-on: ubuntu-latest
    environment: m2-cloud-lab
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sanitized real-day profile
        run: node tools/d173_e115_day27/validate-profile.mjs
      - name: Install existing Wrangler toolchain
        run: npm install --prefix service --no-audit --no-fund
      - name: Run actual InventoryCore local A/B with day27 2.5 percent observed read profile
        run: node tools/d173_e115_day27/test-real-day27.mjs
      - name: Cloudflare historical read-only 2026-10-27 local day
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_M2_LAB }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: node tools/d173_e115_day27/historical-cloudflare.mjs
      - name: Read-only delayed attribution of test-only DO namespace (no Worker requests)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_M2_LAB }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: node tools/d173_e113_cloud_lab/namespace-attribution.mjs
      - name: Preserve profile and official historical provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: D173-E115-27OCT-HISTORICAL-PROVIDER-AND-WORKLOAD
          path: |
            tools/d173_e115_day27/profile-anonymized.json
            artifacts/d173-e115/*
            artifacts/d173-e113/namespace-attribution.json
          if-no-files-found: warn
          retention-days: 14
