name: D173 E278 Agent194 Confirm HA Owner Alert

on:
  pull_request:
    branches: [main]
    paths:
      - "relay-agent/**"
      - "service/src/**"
      - "tests/d173-e278-confirm-incident.test.mjs"
      - "ops/**"
      - "docs/D173_E278*"
      - "tools/d173_e278*"
      - ".github/workflows/d173-e278-agent194-confirm.yml"
  push:
    branches: [main]
    paths:
      - "relay-agent/VERSION"
      - ".github/workflows/d173-e278-agent194-confirm.yml"

permissions:
  contents: write
  actions: read

jobs:
  source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Owner scope, authority and branch continuity
        run: |
          python3 tools/d173_e278_release_gate.py --preflight
          python3 tools/authority_guard.py
          python3 tools/project_state_guard.py
          python3 tools/change_continuity_guard.py
      - name: Install current Worker TypeScript dependencies
        run: npm install --prefix service --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Strict TypeScript and incident/HA reproducibility
        run: |
          npm run typecheck --prefix service
          node --test tests/d173-e278-confirm-incident.test.mjs
          node --test --test-name-pattern="E140 explicit WMS login failure and Web-ready fenced failover" tests/d173-e140-picker-unlock-and-wms.test.mjs
      - name: Shared Worker D172 independent regressions
        run: node --test tests/d172-*.test.mjs

  native:
    if: github.event_name == 'pull_request'
    needs: source
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with: {dotnet-version: "8.0.x"}
      - name: Build Agent194 and unchanged Browser Host14
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build relay-agent-webview2-host/SupraInventoryWebView2Host.csproj -c Release -p:PlatformTarget=x64
          if ($LASTEXITCODE -ne 0) { throw 'Host14 native build failed' }
          dotnet build relay-agent/SupraInventoryRelayAgent.csproj -c Release -p:PlatformTarget=x64
          if ($LASTEXITCODE -ne 0) { throw 'Agent194 native build failed' }
          $exe = (Resolve-Path 'relay-agent/bin/Release/net48/Agent Auto Confirm Pick Pack.exe').Path
          foreach ($arg in @('--startup-smoke','--e100-roster-self-test','--e103-activity-self-test','--d140-sync-safety-self-test')) {
            $p = Start-Process -FilePath $exe -ArgumentList $arg -PassThru
            if (-not $p.WaitForExit(20000)) {
              try { $p.Kill() } catch {}
              throw "Agent194 smoke timeout $arg"
            }
            if ($p.ExitCode -ne 0) { throw "Agent194 smoke fail $arg" }
          }
          Write-Host 'D173_E278_AGENT194_NATIVE_SOURCE_PASS'
