name: D173 Isolated Launcher SSO PoC

on:
  push:
    branches:
      - feat/d173-launcher-session-poc-20261113
    paths:
      - 'experiments/d173-launcher-session-poc/**'
      - '.github/workflows/d173-launcher-session-poc.yml'
  pull_request:
    paths:
      - 'experiments/d173-launcher-session-poc/**'
      - '.github/workflows/d173-launcher-session-poc.yml'

permissions:
  contents: read

jobs:
  build-poc:
    runs-on: ubuntu-latest
    environment: beta
    timeout-minutes: 30
    env:
      D173_POC_FIREBASE_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reuse existing Firebase key and check SSO source
        shell: bash
        run: |
          set -euo pipefail
          [ "${#D173_POC_FIREBASE_API_KEY}" -ge 20 ] || { echo '::error::Existing Firebase API key not configured in beta environment'; exit 1; }
          python3 experiments/d173-launcher-session-poc/check_poc.py
      - name: Build Launcher test
        working-directory: experiments/d173-launcher-session-poc/launcher
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Build independent test client (same debug signer)
        working-directory: experiments/d173-launcher-session-poc/test-client
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK package isolation and same debug signing identity
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          aapt="$tools_dir/aapt"
          apksigner="$tools_dir/apksigner"
          launcher="experiments/d173-launcher-session-poc/launcher/app/build/outputs/apk/debug/app-debug.apk"
          client="experiments/d173-launcher-session-poc/test-client/app/build/outputs/apk/debug/app-debug.apk"
          "$aapt" dump badging "$launcher" | grep -q "package: name='vn.supra.pdalauncher.identitytest'"
          "$aapt" dump badging "$client" | grep -q "package: name='vn.supra.identitytest'"
          "$apksigner" verify "$launcher"
          "$apksigner" verify "$client"
          launcher_report="$("$apksigner" verify --print-certs "$launcher" 2>&1)"
          client_report="$("$apksigner" verify --print-certs "$client" 2>&1)"
          echo "Launcher signer report (public debug certificate fields):"
          printf '%s\n' "$launcher_report" | grep -E "Signer|certificate|digest" || true
          echo "Client signer report (public debug certificate fields):"
          printf '%s\n' "$client_report" | grep -E "Signer|certificate|digest" || true
          cert_l="$(printf '%s\n' "$launcher_report" | awk '/SHA-256 digest/ {print $NF}')"
          cert_c="$(printf '%s\n' "$client_report" | awk '/SHA-256 digest/ {print $NF}')"
          test -n "$cert_l" || { echo "::error::Launcher certificate fingerprint missing"; exit 1; }
          test -n "$cert_c" || { echo "::error::Client certificate fingerprint missing"; exit 1; }
          test "$cert_l" = "$cert_c" || { echo "::error::Debug signing certificates differ"; exit 1; }
          "$aapt" dump permissions "$launcher" | grep -q "android.permission.INTERNET"
          "$aapt" dump permissions "$client" | grep -q "android.permission.INTERNET"
          echo "Two signed test APKs PASS; Launcher account authenticated once, client auto-login."
      - name: Upload pair for PDA field test
        uses: actions/upload-artifact@v4
        with:
          name: d173-launcher-existing-firebase-auto-sso-test
          path: |
            experiments/d173-launcher-session-poc/launcher/app/build/outputs/apk/debug/app-debug.apk
            experiments/d173-launcher-session-poc/test-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
