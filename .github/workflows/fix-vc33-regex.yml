name: Fix vc33 Release Regex

on:
  push:
    branches: [fix/android-vc33-native-ui-update-gate]
    paths:
      - ".github/workflows/fix-vc33-regex.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-vc33-native-ui-update-gate
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Repair Kotlin regex
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/cd/cc/supra/inventory/beta/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          bad = 'Regex("^beta-vc(\\d+)$")'
          good = 'Regex("^beta-vc(\\\\d+)$")'
          if bad not in s:
              raise SystemExit('VC33_REGEX_ANCHOR_NOT_FOUND')
          p.write_text(s.replace(bad, good, 1), encoding='utf-8')
          PY
      - name: Android debug compile
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Commit fix and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/cd/cc/supra/inventory/beta/MainActivity.kt
          git rm .github/workflows/fix-vc33-regex.yml
          git commit -m "fix(android): correct Beta release regex"
          git push origin HEAD:fix/android-vc33-native-ui-update-gate
