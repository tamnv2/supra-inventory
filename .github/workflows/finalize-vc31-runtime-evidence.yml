name: Finalize vc31 Runtime Evidence

on:
  push:
    branches:
      - chore/practical-balanced-runtime-evidence-vc31
    paths:
      - .github/workflows/finalize-vc31-runtime-evidence.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/practical-balanced-runtime-evidence-vc31
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record canonical runtime evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          commit = "d7bfd1a0897ec760300a4c5d484b95d91444dc2d"
          release = "beta-vc31"
          release_name = "SUPRA Inventory Beta 0.2.0-beta.31"
          apk_sha = "7f57cec90aad16cdc1747ae8cbe543948ce4fcabca96f5859b16d4087e384f1c"
          apk_size = 9167082

          p = Path("ops/project-state.json")
          state = json.loads(p.read_text(encoding="utf-8"))
          cs = state["current_status"]
          cs["web"] = "PRACTICAL_BALANCED_CANONICAL_SOURCE_BETA_DEPLOY_SMOKE_PASS"
          cs["android"] = "PRACTICAL_BALANCED_SIGNED_BETA_VC31_MONOTONIC_OTA_PASS"
          cs["latest_beta_apk"] = release
          cs["user_management"] = "EXPANDED_ROOT_ADMIN_PICKER_LIFECYCLE_FLEXIBLE_HR_DIRECT_PASSWORD_IMPLEMENTED_DEPLOYED_BUILD_PASS"
          cs["ui_design_guard"] = "PRACTICAL_BALANCED_CANONICAL_SOURCE_GUARD_PASS"
          for item in [
              "Practical Balanced canonical Web source: explicit business labels, consistent typography, business-relevant iconography and approved footer credit — Beta Web/Worker deploy smoke PASS",
              "Expanded account controls: ROOT inherits Admin/Reporter and manages Admin/Reporter/Picker; Admin manages Reporter/Picker; direct managed-password flow; configurable HR headers; explicit one/many/all Picker lifecycle; HR absence policy no automatic disable/delete/reactivate — source guard, service typecheck, Web build and Beta deploy PASS",
              f"Android Practical Balanced signed OTA {release}: monotonic versionCode 31 from prior vc30, exact source commit {commit}, APK SHA-256 {apk_sha}, release publish PASS",
          ]:
              if item not in state["completed_capabilities"]:
                  state["completed_capabilities"].append(item)
          state["pending_build"] = [
              "Field-verify FCM delivery on a physical logged-in PDA; technical foundation is deployed",
              "Owner business/UI acceptance of Practical Balanced Beta Web/PDA",
              "Isolated business-mutation load acceptance after Owner scale target is defined",
          ]
          state["field_pending"] = [
              "Owner physical-PDA and Web confirmation of the Practical Balanced beta-vc31 build remains distinct from CI/deploy PASS.",
              "Physical logged-in PDA FCM delivery remains field-pending.",
          ]
          state["next_action"] = {
              "primary": "Owner field-test Practical Balanced Beta Web/PDA using the deployed Web runtime and signed beta-vc31; field-verify FCM on a physical logged-in PDA; report numbered findings if any. Stable remains gated.",
              "method": "Use beta-vc31 and current Beta Web deployment as the accepted technical runtime baseline. Technical source/build/deploy/release gates are PASS; do not reopen completed implementation without new evidence.",
              "stable_guard": "Do not activate Stable.",
          }
          state["workboard"]["in_progress"] = []
          state["workboard"]["next"] = [
              "Owner field-test Practical Balanced Beta Web/PDA and report numbered business/UI findings if any",
              "Field-verify foreground realtime and background FCM delivery on a logged-in physical PDA",
              "Run isolated business-mutation load acceptance after Owner defines scale target/test boundary",
          ]
          state["workboard"]["blocked_or_owner_field_dependent"] = [
              "Owner business/UI acceptance",
              "Physical PDA FCM delivery acceptance",
              "Isolated mutation load acceptance requires an Owner workload target/test boundary",
          ]
          state["workboard"]["last_runtime_evidence"] = {
              "schema": 5,
              "signed_beta_release": release,
              "signed_beta_release_name": release_name,
              "signed_beta_apk_sha256": apk_sha,
              "signed_beta_apk_size_bytes": apk_size,
              "runtime_source_commit": commit,
              "runtime_ui_baseline": "PRACTICAL_BALANCED",
              "verification_basis": "PR #4 authority + continuity + canonical UI source guard + Worker typecheck + Web production + Android debug PASS; main Beta Worker/Web deploy smoke PASS; signed Android beta-vc31 release PASS with monotonic 30→31 versionCode.",
          }
          p.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          p = Path("ops/resource-registry.json")
          reg = json.loads(p.read_text(encoding="utf-8"))
          hr = reg["hr_source"]
          hr["required_input"] = ["google_sheet_url", "exact_tab_name", "employee_code_header", "full_name_header"]
          hr["required_columns"] = ["configured_employee_code_column", "configured_full_name_column"]
          hr["authenticated_api_status"] = "CONFIGURABLE_HEADERS_IMPLEMENTED_BETA_DEPLOY_PASS"
          beta = reg["environments"]["beta"]
          beta["web_source_status"] = "PRACTICAL_BALANCED_CANONICAL_SOURCE_DEPLOYED_SMOKE_PASS"
          beta["android_source_status"] = "PRACTICAL_BALANCED_SIGNED_OTA_VC31_PASS"
          beta["latest_signed_beta_release"] = release
          beta["latest_signed_beta_release_name"] = release_name
          beta["latest_signed_beta_apk_sha256"] = apk_sha
          beta["latest_signed_beta_apk_size_bytes"] = apk_size
          beta["latest_signed_beta_release_source_commit"] = commit
          beta["auth_rbac_status"] = "EXPANDED_ROOT_ADMIN_REPORTER_PICKER_LIFECYCLE_IMPLEMENTED_DEPLOYED_BUILD_PASS"
          beta["hr_settings_ui_status"] = "CONFIGURABLE_URL_TAB_EMPLOYEE_AND_NAME_HEADERS_DEPLOYED_PASS"
          beta["managed_password_status"] = "DIRECT_CREATE_AND_CHANGE_IMPLEMENTED_DEPLOYED_BUILD_PASS"
          beta["picker_lifecycle_status"] = "ONE_MANY_ALL_ENABLE_DISABLE_DELETE_IMPLEMENTED_DEPLOYED_BUILD_PASS"
          um = reg["user_management"]
          um["hierarchy"] = "ROOT_INHERITS_ADMIN_REPORTER_MANAGES_ADMIN_REPORTER_PICKER__ADMIN_MANAGES_REPORTER_PICKER__HR_PROVISIONS_PICKER"
          um["picker_missing_from_hr"] = "NO_AUTOMATIC_STATUS_CHANGE_RETAIN_ACCOUNT_AND_HISTORY"
          um["default_password_source"] = "PROTECTED_PICKER_DEFAULT_PASSWORD_RUNTIME_SECRET_WITH_LEGACY_ROOT_BOOTSTRAP_FALLBACK"
          um["managed_passwords"] = "AUTHORIZED_MANAGER_DIRECT_SET_AND_CHANGE"
          um["picker_lifecycle"] = "EXPLICIT_ONE_MANY_ALL_ENABLE_DISABLE_DELETE"
          um["root_protection"] = "ROOT_NOT_MANAGEABLE_BY_NORMAL_ACCOUNT_API_AND_ONLY_ROOT_CAN_BOOTSTRAP_FROM_ROOT_SECRET"
          um["hr_sync"] = "PREVIEW_THEN_EXPLICIT_APPLY_NO_AUTOMATIC_DISABLE_DELETE_OR_REACTIVATE"
          um["source_status"] = "IMPLEMENTED_DEPLOYED_BUILD_PASS"
          ui = reg["ui_design"]
          ui["authority"] = "OWNER_SELECTED_PRACTICAL_BALANCED_OPTION_1"
          ui["web"] = "PRACTICAL_BALANCED_CANONICAL_SOURCE_DEPLOYED_SMOKE_PASS"
          ui["android"] = "PRACTICAL_BALANCED_SIGNED_BETA_VC31_PASS"
          ui["scope_guard"] = "PRACTICAL_BALANCED_VISUAL_SYSTEM_WITH_CANONICAL_BUSINESS_CONTROLS_BUSINESS_RULES_REMAIN_AUTHORITATIVE"
          for item in [
              "practical_balanced_web_canonical_source_beta_deploy_smoke_pass",
              "expanded_root_admin_reporter_picker_account_controls",
              "configurable_hr_headers_and_manual_picker_lifecycle",
              "direct_managed_password_create_change",
              "android_practical_balanced_signed_beta_vc31_monotonic_ota_pass",
          ]:
              if item not in reg["application_build_completed"]:
                  reg["application_build_completed"].append(item)
          p.write_text(json.dumps(reg, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          handover_lines = [
              "# HANDOVER_CURRENT — SUPRA Inventory", "",
              "> GENERATED/DERIVED CONTINUITY VIEW. **Never bootstrap from this file alone.** Canonical context/state/decisions/specs/resources live in the files listed by `ops/authority-manifest.json`. CI must fail if key status markers here drift from `ops/project-state.json`.", "",
              "## Current status", "",
              "- Project: `SUPRA Inventory — Báo hàng` (`supra-inventory`).",
              "- Beta: `ROLE_BASED_WEB_ANDROID_LIVE`",
              "- Stable: `CONFIG_READY_OWNER_GATED_NOT_LIVE`",
              "- SQLite schema: `5`",
              "- Web: `PRACTICAL_BALANCED_CANONICAL_SOURCE_BETA_DEPLOY_SMOKE_PASS`",
              "- Android: `PRACTICAL_BALANCED_SIGNED_BETA_VC31_MONOTONIC_OTA_PASS`",
              f"- Latest signed Beta APK: `{release}`",
              "- Realtime: `WEBSOCKET_SERVER_WEB_ANDROID_CLIENT_DEPLOYED_SIGNED_PASS`",
              "- FCM: `DEVICE_REGISTRATION_AND_BACKGROUND_DELIVERY_DEPLOYED_BUILD_PASS_FIELD_DELIVERY_PENDING`",
              "- User management: `EXPANDED_ROOT_ADMIN_PICKER_LIFECYCLE_FLEXIBLE_HR_DIRECT_PASSWORD_IMPLEMENTED_DEPLOYED_BUILD_PASS`",
              "- Admin dashboard/reporting: `OPERATIONAL_DASHBOARD_AND_REPORTING_BETA_DEPLOY_PASS`",
              "- Quota/resilience: `INDEXED_REPORTING_DELTA_CATALOG_NONDESTRUCTIVE_BURST_PASS`",
              "- UI design guard: `PRACTICAL_BALANCED_CANONICAL_SOURCE_GUARD_PASS`", "",
              "## Runtime evidence", "",
              f"- Runtime source commit: `{commit}`",
              f"- Signed release: `{release}` / `{release_name}`",
              f"- APK SHA-256: `{apk_sha}`",
              f"- APK size: `{apk_size}` bytes",
              "- Beta Worker/Web deploy smoke: PASS",
              "- Authority + continuity + canonical source + Worker typecheck + Web production + Android debug/release: PASS", "",
              "## Workboard", "", "### In progress",
              "- No automated implementation task remains for the Owner-approved Practical Balanced change set.", "",
              "### Next / field acceptance",
              "- Owner field-test Practical Balanced Beta Web/PDA and report numbered findings if any.",
              "- Field-verify background FCM delivery on a logged-in physical PDA.",
              "- Run isolated business-mutation load acceptance after Owner defines scale target/test boundary.", "",
              "### Blocked / Owner-field dependent",
              "- Owner business/UI acceptance.",
              "- Physical PDA FCM delivery acceptance.",
              "- Isolated mutation load acceptance requires an Owner workload target/test boundary.", "",
              "## Continuity rule", "",
              "No manual end-of-session handover is required. A new AI session must bootstrap from `AGENTS.md` and `ops/authority-manifest.json`, then read canonical files before mutation.", "",
          ]
          Path("docs/handovers/HANDOVER_CURRENT.md").write_text("\n".join(handover_lines), encoding="utf-8")

          readiness_lines = [
              "# SERVICE_READINESS — Derived current view", "",
              "> DERIVED VIEW. Canonical live status is `ops/project-state.json`; resource identity is `ops/resource-registry.json`. CI must fail if key markers below drift from canonical state.", "",
              "- Project: `supra-inventory`",
              "- Beta: `ROLE_BASED_WEB_ANDROID_LIVE`",
              "- Stable: `CONFIG_READY_OWNER_GATED_NOT_LIVE`",
              "- SQLite schema: `5`",
              "- Web: `PRACTICAL_BALANCED_CANONICAL_SOURCE_BETA_DEPLOY_SMOKE_PASS`",
              "- Android: `PRACTICAL_BALANCED_SIGNED_BETA_VC31_MONOTONIC_OTA_PASS`",
              f"- Latest signed Beta APK: `{release}`",
              "- Realtime: `WEBSOCKET_SERVER_WEB_ANDROID_CLIENT_DEPLOYED_SIGNED_PASS`",
              "- FCM: `DEVICE_REGISTRATION_AND_BACKGROUND_DELIVERY_DEPLOYED_BUILD_PASS_FIELD_DELIVERY_PENDING`",
              "- User management: `EXPANDED_ROOT_ADMIN_PICKER_LIFECYCLE_FLEXIBLE_HR_DIRECT_PASSWORD_IMPLEMENTED_DEPLOYED_BUILD_PASS`",
              "- Archive: `IDEMPOTENT_SHEET_ARCHIVE_AND_SAFE_60D_RETENTION_BETA_DEPLOY_PASS`",
              "- Admin dashboard: `OPERATIONAL_DASHBOARD_AND_REPORTING_BETA_DEPLOY_PASS`",
              "- Quota/resilience: `INDEXED_REPORTING_DELTA_CATALOG_NONDESTRUCTIVE_BURST_PASS`",
              "- UI design guard: `PRACTICAL_BALANCED_CANONICAL_SOURCE_GUARD_PASS`", "",
              "## Runtime evidence", "",
              f"- Runtime source commit: `{commit}`",
              f"- Signed Android release: `{release}` (`{release_name}`)",
              f"- APK SHA-256: `{apk_sha}`",
              f"- APK size: `{apk_size}` bytes",
              "- Beta Worker/Web deploy + health/auth/business/Web/OAuth smoke: PASS",
              "- Android monotonic release: vc30 → vc31 PASS", "",
              "## Remaining acceptance work", "",
              "- Owner business/UI field acceptance on Beta Web/PDA.",
              "- Physical logged-in PDA FCM delivery verification.",
              "- Isolated business-mutation load acceptance after Owner scale target is defined.", "",
              "## Next action", "",
              f"Use the deployed Practical Balanced Beta Web runtime and signed `{release}` as the accepted technical baseline for Owner field testing. Stable remains gated.", "",
              "Stable remains Owner-gated.", "",
          ]
          Path("docs/SERVICE_READINESS.md").write_text("\n".join(readiness_lines), encoding="utf-8")
          PY
          rm .github/workflows/finalize-vc31-runtime-evidence.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/project-state.json ops/resource-registry.json docs/handovers/HANDOVER_CURRENT.md docs/SERVICE_READINESS.md .github/workflows/finalize-vc31-runtime-evidence.yml
          git commit -m "chore: record Practical Balanced vc31 runtime evidence"
          git push origin HEAD:chore/practical-balanced-runtime-evidence-vc31
