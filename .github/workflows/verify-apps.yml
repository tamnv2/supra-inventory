name: Verify Beta Android

on:
  pull_request:
    paths:
      - "android/**"
      - "firebase/database.rules.json"
      - "firebase/firestore.rules"
      - ".github/workflows/verify-apps.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "firebase/database.rules.json"
      - "firebase/firestore.rules"
      - ".github/workflows/verify-apps.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-android-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    environment: beta
    env:
      BETA_KEYSTORE_B64: ${{ secrets.BETA_KEYSTORE_B64 }}
      BETA_KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
      BETA_KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
      BETA_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect Android release-relevant source change
        shell: bash
        run: |
          set -euo pipefail
          required=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
              if git diff --name-only "$before" "$GITHUB_SHA" | grep -q '^android/'; then
                required=true
              fi
            fi
          fi
          echo "ANDROID_RELEASE_REQUIRED=$required" >> "$GITHUB_ENV"
          echo "Android signed release required=$required"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Verify Firebase config
        env:
          FIREBASE_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
        run: |
          set -euo pipefail
          [ -n "${FIREBASE_API_KEY_BETA:-}" ] || { echo "FIREBASE_WEB_API_KEY_BETA is missing from Beta variable/secret scope"; exit 1; }
          [ "${#FIREBASE_API_KEY_BETA}" -ge 20 ] || { echo "FIREBASE_WEB_API_KEY_BETA looks invalid"; exit 1; }
          echo "Firebase config presence PASS"
      - name: Prepare monotonic Beta version and signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(test("^beta-vc[0-9]+$")) | capture("^beta-vc(?<n>[0-9]+)$").n | tonumber] | max // 0')"
          next=$((latest + 1))
          echo "APP_VERSION_CODE=$next" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=0.2.0-beta.$next" >> "$GITHUB_ENV"
          echo "Latest published Beta versionCode=$latest; next versionCode=$next"
          if [ -n "${BETA_KEYSTORE_B64:-}" ] && [ -n "${BETA_KEYSTORE_PASSWORD:-}" ] && [ -n "${BETA_KEY_ALIAS:-}" ] && [ -n "${BETA_KEY_PASSWORD:-}" ]; then
            key_path="$RUNNER_TEMP/supra-inventory-beta.jks"
            printf '%s' "$BETA_KEYSTORE_B64" | base64 --decode > "$key_path"
            keytool -list -keystore "$key_path" -storepass "$BETA_KEYSTORE_PASSWORD" -alias "$BETA_KEY_ALIAS" >/dev/null
            signer_sha="$(keytool -exportcert -keystore "$key_path" -storepass "$BETA_KEYSTORE_PASSWORD" -alias "$BETA_KEY_ALIAS" | sha256sum | awk '{print $1}')"
            [ "${#signer_sha}" -eq 64 ] || { echo "Unable to derive Beta signer fingerprint"; exit 1; }
            echo "BETA_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
            echo "BETA_SIGNER_SHA256=$signer_sha" >> "$GITHUB_ENV"
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
            echo "Fixed Beta signing key PASS"
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Beta signing secrets are not configured; building debug artifact only. Auto-update release publishing will stay disabled."
          fi
      - name: D097 Firestore listener and 30-second confirmation source guard
        shell: bash
        run: |
          set -euo pipefail
          client="android/app/src/main/java/cd/cc/supra/inventory/beta/RelayPocClient.kt"
          picker="android/app/src/main/java/cd/cc/supra/inventory/beta/PickerController.kt"
          api="android/app/src/main/java/cd/cc/supra/inventory/beta/InventoryApi.kt"
          gradle_file="android/app/build.gradle.kts"
          grep -q 'com.google.firebase:firebase-auth' "$gradle_file"
          grep -q 'com.google.firebase:firebase-firestore' "$gradle_file"
          grep -q 'ANDROID_CONFIRM_V1' "$client"
          grep -q 'addSnapshotListener' "$client"
          grep -q 'setPersistenceEnabled(false)' "$client"
          grep -q 'FAILOVER_NOTICE_MS = 10_000L' "$client"
          grep -q 'TOTAL_WAIT_MS = 30_000L' "$client"
          grep -q '"created_at" to FieldValue.serverTimestamp()' "$client"
          grep -q 'relayCustomToken' "$api"
          grep -q 'Đã gửi #' "$client"
          grep -q 'Chuyên viên xử lý trực tiếp' "$client"
          grep -q 'Đã xác nhận lấy lại đơn. Hãy quay lại app SFT / SFT 3 để tiếp tục' "$picker"
          if grep -q 'PROCESSING' "$client"; then
            echo "D097 confirmation client must not use PROCESSING" >&2
            exit 1
          fi
          if grep -q 'FIREBASE_RTDB_URL' "$client"; then
            echo "D097 confirmation client must not use RTDB" >&2
            exit 1
          fi
          echo "D097 Android Firestore listener / 10s failover / 30s terminal guard PASS"

      - name: Assemble Android 11+ Beta APK
        env:
          FIREBASE_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
        run: |
          set -euo pipefail
          rm -rf android/dist
          mkdir -p android/dist
          if [ "$SIGNING_READY" = "true" ]; then
            gradle -p android :app:assembleRelease --no-daemon
            cp android/app/build/outputs/apk/release/app-release.apk android/dist/supra-inventory-beta.apk
          else
            gradle -p android :app:assembleDebug --no-daemon
            cp android/app/build/outputs/apk/debug/app-debug.apk android/dist/supra-inventory-beta.apk
          fi
          sha256sum android/dist/supra-inventory-beta.apk > android/dist/supra-inventory-beta.apk.sha256
      - name: Publish Beta APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: supra-inventory-beta-apk
          path: |
            android/dist/supra-inventory-beta.apk
            android/dist/supra-inventory-beta.apk.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Require successful Beta runtime gate for this source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_READY == 'true' && env.ANDROID_RELEASE_REQUIRED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            run_json="$(gh run list --workflow deploy-beta.yml --commit "$GITHUB_SHA" --limit 20 --json databaseId,status,conclusion,headSha 2>/dev/null || true)"
            run_id="$(echo "$run_json" | jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)][0].databaseId // empty')"
            status="$(echo "$run_json" | jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)][0].status // empty')"
            conclusion="$(echo "$run_json" | jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)][0].conclusion // empty')"
            echo "runtime gate attempt=$attempt run=${run_id:-pending} status=${status:-pending} conclusion=${conclusion:-pending}"
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] || { echo "Beta runtime gate failed for source $GITHUB_SHA (run $run_id: $conclusion)"; exit 1; }
              echo "Beta runtime gate PASS for source $GITHUB_SHA (run $run_id)"
              exit 0
            fi
            sleep 5
          done
          echo "Beta runtime gate did not reach terminal success for source $GITHUB_SHA" >&2
          exit 1

      - name: Publish signed Beta auto-update release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_READY == 'true' && env.ANDROID_RELEASE_REQUIRED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="beta-vc${APP_VERSION_CODE}"
          title="1291 Beta ${APP_VERSION_NAME}"
          notes="1291 Beta Android 11+ auto-update build. versionCode=${APP_VERSION_CODE}. Source=${GITHUB_SHA}."
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $tag" >&2
            exit 1
          fi
          gh release create "$tag" android/dist/supra-inventory-beta.apk android/dist/supra-inventory-beta.apk.sha256 --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          echo "Published Beta release $tag"
