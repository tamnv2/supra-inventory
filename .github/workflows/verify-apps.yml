name: Verify Beta Android

on:
  pull_request:
    paths:
      - "android/**"
      - "firebase/database.rules.json"
      - "firebase/firestore.rules"
      - ".github/workflows/verify-apps.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "firebase/database.rules.json"
      - "firebase/firestore.rules"
      - ".github/workflows/verify-apps.yml"
      - "ops/d171-release-authorization.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: beta-android-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    environment: beta
    env:
      BETA_KEYSTORE_B64: ${{ secrets.BETA_KEYSTORE_B64 }}
      BETA_KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
      BETA_KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
      BETA_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
      ANDROID_PICKER_DEFAULT_PASSWORD: ${{ secrets.ANDROID_PICKER_DEFAULT_PASSWORD || secrets.PICKER_DEFAULT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Android release-relevant source change
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # PR592 carried Android source changes, but subsequent P0 workflow-only
            # merges did not: compare with the last PUBLISHED APK, not the last push.
            latest="$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(test("^beta-vc[0-9]+$")) | capture("^beta-vc(?<n>[0-9]+)$").n | tonumber] | max // 0')"
            if [ "$latest" -eq 0 ]; then
              required=true
            else
              previous="$(gh release view "beta-vc$latest" --json targetCommitish --jq .targetCommitish)"
              if [ -z "$previous" ] || ! git cat-file -e "$previous^{commit}" 2>/dev/null; then
                echo "Last signed Android source commit is unavailable; refusing uncertain release decision." >&2
                exit 1
              fi
              changed="$(git diff --name-only "$previous" "$GITHUB_SHA" -- android/ ':!android/release-notes.json')" || {
                echo "Cannot compare the last signed Android source tree." >&2
                exit 1
              }
              if [ -n "$changed" ]; then required=true; fi
            fi
          fi
          echo "ANDROID_RELEASE_REQUIRED=$required" >> "$GITHUB_ENV"
          echo "Android signed release required=$required"
      # D169-E059: an unchanged APK on an Agent/Rules-only push must not
      # request a new Android release grant. Changed Android remains gated.
      - name: D167 Owner release authorization for changed Android only
        if: github.event_name != 'pull_request' && env.ANDROID_RELEASE_REQUIRED == 'true'
        run: python3 tools/d167_release_gate.py --component android
      - name: Validate per-release Android notes and prevent reused changelog
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ANDROID_RELEASE_REQUIRED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="android/release-notes.json"
          jq -e '
            .schema_version == 1
            and (.release_notes | type == "array" and length >= 1 and length <= 5)
            and all(.release_notes[]; type == "string" and length >= 12 and length <= 180)
          ' "$notes" >/dev/null || { echo "Android release notes must list 1-5 reviewed user-visible changes (12-180 chars)."; exit 1; }
          last_tag="$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(test("^beta-vc[0-9]+$")) | capture("^beta-vc(?<n>[0-9]+)$").n | tonumber] | max // 0')"
          if [ "$last_tag" -gt 0 ]; then
            previous="$(gh release view "beta-vc$last_tag" --json targetCommitish --jq .targetCommitish)"
            if [ -z "$previous" ] || ! git cat-file -e "$previous^{commit}"; then
              echo "Cannot verify previous signed release for notes freshness." >&2
              exit 1
            fi
            if git diff --quiet "$previous" "$GITHUB_SHA" -- "$notes"; then
              echo "Android code changed but release notes were not updated since beta-vc$last_tag." >&2
              exit 1
            fi
          fi
          echo "Version-specific Android release notes validated"
      - name: Verify Reporter meal-choice UI and release note contracts
        run: node --test tests/d168-android-vc109.test.mjs
      - name: D171 E071 Reporter/Picker FCM alert regression contract
        run: node --test tests/d171-e071-alert-hotfix.test.mjs
      - name: D171 E074 Android vc117 Picker lifecycle and Reporter scroll regression
        run: node --test tests/d171-e074-vc117-android-regression.test.mjs
      - name: Verify D169 Android warm-resume UI preservation
        run: node --test tests/d169-android-resume-lifecycle.test.mjs
      - name: D170 official user-visible identity and legacy OTA compatibility
        run: node --test tests/d170-public-identity.test.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Verify Firebase config
        env:
          FIREBASE_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
        run: |
          set -euo pipefail
          [ -n "${FIREBASE_API_KEY_BETA:-}" ] || { echo "FIREBASE_WEB_API_KEY_BETA is missing from Beta variable/secret scope"; exit 1; }
          [ "${#FIREBASE_API_KEY_BETA}" -ge 20 ] || { echo "FIREBASE_WEB_API_KEY_BETA looks invalid"; exit 1; }
          echo "Firebase config presence PASS"
      - name: Prepare monotonic Beta version and signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(test("^beta-vc[0-9]+$")) | capture("^beta-vc(?<n>[0-9]+)$").n | tonumber] | max // 0')"
          next=$((latest + 1))
          echo "APP_VERSION_CODE=$next" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=0.2.0-beta.$next" >> "$GITHUB_ENV"
          echo "Latest published Beta versionCode=$latest; next versionCode=$next"
          if [ -n "${BETA_KEYSTORE_B64:-}" ] && [ -n "${BETA_KEYSTORE_PASSWORD:-}" ] && [ -n "${BETA_KEY_ALIAS:-}" ] && [ -n "${BETA_KEY_PASSWORD:-}" ]; then
            key_path="$RUNNER_TEMP/supra-inventory-beta.jks"
            printf '%s' "$BETA_KEYSTORE_B64" | base64 --decode > "$key_path"
            keytool -list -keystore "$key_path" -storepass "$BETA_KEYSTORE_PASSWORD" -alias "$BETA_KEY_ALIAS" >/dev/null
            signer_sha="$(keytool -exportcert -keystore "$key_path" -storepass "$BETA_KEYSTORE_PASSWORD" -alias "$BETA_KEY_ALIAS" | sha256sum | awk '{print $1}')"
            [ "${#signer_sha}" -eq 64 ] || { echo "Unable to derive Beta signer fingerprint"; exit 1; }
            echo "BETA_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
            echo "BETA_SIGNER_SHA256=$signer_sha" >> "$GITHUB_ENV"
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
            echo "Fixed Beta signing key PASS"
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Beta signing secrets are not configured; building debug artifact only. Auto-update release publishing will stay disabled."
          fi
      - name: D134 Firestore session-generation, kick, call and confirmation guard
        shell: bash
        run: |
          set -euo pipefail
          client="android/app/src/main/java/cd/cc/supra/inventory/beta/RelayPocClient.kt"
          picker="android/app/src/main/java/cd/cc/supra/inventory/beta/PickerController.kt"
          realtime="android/app/src/main/java/cd/cc/supra/inventory/beta/AndroidRealtimeClient.kt"
          api="android/app/src/main/java/cd/cc/supra/inventory/beta/InventoryApi.kt"
          watcher="android/app/src/main/java/cd/cc/supra/inventory/beta/PickerActiveCallWatcher.kt"
          main="android/app/src/main/java/cd/cc/supra/inventory/beta/MainActivity.kt"
          critical="android/app/src/main/java/cd/cc/supra/inventory/beta/CriticalOverlayService.kt"
          manifest="android/app/src/main/AndroidManifest.xml"
          gradle_file="android/app/build.gradle.kts"
          grep -q 'com.google.firebase:firebase-auth' "$gradle_file"
          grep -q 'com.google.firebase:firebase-firestore' "$gradle_file"
          grep -q 'ANDROID_CONFIRM_V1' "$client"
          grep -q 'addSnapshotListener' "$client"
          grep -q 'setPersistenceEnabled(false)' "$main"
          if grep -q 'setPersistenceEnabled(false)' "$client"; then
            echo "RelayPocClient must not mutate Firestore settings after D134 listeners start." >&2
            exit 1
          fi
          grep -q 'app_session_generation: activated.generation' service/src/index.ts
          grep -q 'app_session_generation: identity.sessionGeneration' service/src/index.ts
          if grep -q 'app_session_generation: String(' service/src/index.ts; then
            echo "Firestore session generation custom claim must remain numeric." >&2
            exit 1
          fi
          grep -q 'FAILOVER_NOTICE_MS = 10_000L' "$client"
          grep -q 'TOTAL_WAIT_MS = 20_000L' "$client"
          grep -q '"created_at" to FieldValue.serverTimestamp()' "$client"
          grep -q 'relayCustomToken' "$api"
          grep -q 'Đã gửi #' "$client"
          grep -q 'Chuyên viên xử lý trực tiếp' "$client"
          grep -q 'Đã xác nhận PickList thành công' "$picker"
          grep -Fq 'Regex("^\\d{3,20}$")' "$client"
          grep -q 'relayRequestInFlight' "$picker"
          grep -q 'alpha = if (ready) 1.0f else 0.42f' "$picker"
          grep -q 'textSize = scaledSp(17f)' "$picker"
          grep -q 'Typeface.BOLD' "$picker"
          grep -q 'digits.length < 3' "$picker"
          grep -q 'renderRelayCandidates' "$picker"
          grep -q 'confirmAmbiguousPickList' "$picker"
          grep -q 'candidatePicklists' "$client"
          ! grep -q 'triggerCleanupAsync' "$client"
          grep -q 'Source.SERVER' "$client"
          grep -q 'final-read recovered ACK' "$client"
          grep -q 'createRequestWithRecovery' "$client"
          grep -q 'CREATE_FIRST_WAIT_SECONDS = 5L' "$client"
          grep -q 'CREATE_VERIFY_WAIT_SECONDS = 3L' "$client"
          grep -q 'CREATE_RETRY_WAIT_SECONDS = 4L' "$client"
          grep -q 'CREATE RECOVERED' "$client"
          grep -q 'VERIFIED_FAILOVER_WAIT_MS = 35_000L' "$client"
          grep -q 'recoveryProofSeen.get()' "$client"
          grep -q 'TOTAL_WAIT_MS = 20_000L' "$client"
          grep -q 'pendingSocket' "$realtime"
          grep -q 'connectionAttempt' "$realtime"
          grep -q '12_000L' "$realtime"
          grep -q 'Realtime handshake timeout' "$realtime"
          grep -q 'suppressRelayInputHint' "$picker"
          grep -q '"picker_employee_code"' "$client"
          grep -q '"picker_display_name"' "$client"
          grep -q '"picker_session_generation"' "$client"
          grep -q 'app_session_generation' "$client"
          grep -q 'picker_session_controls' "$watcher"
          grep -q 'revoked_generation' "$watcher"
          grep -q 'lock_until_ms' "$watcher"
          grep -q 'System.currentTimeMillis() + 60_000L' "$watcher"
          grep -q 'Phiên PDA đã bị Kích User' "$main"
          grep -q 'activeResultDialog' "$picker"
          # D171-E058 Owner supersedes D135 remote ACK: an actual shown overlay
          # is reported once, and the Picker button closes without network access.
          python3 - <<'PY'
          from pathlib import Path
          picker = Path("android/app/src/main/java/cd/cc/supra/inventory/beta/PickerController.kt").read_text(encoding="utf-8")
          critical = Path("android/app/src/main/java/cd/cc/supra/inventory/beta/CriticalOverlayService.kt").read_text(encoding="utf-8")
          store = Path("android/app/src/main/java/cd/cc/supra/inventory/beta/NotificationSignalStore.kt").read_text(encoding="utf-8")
          start = picker.find("acknowledge.setOnClickListener")
          end = picker.find("dialog.setOnDismissListener", start)
          if start < 0 or end < start:
              raise SystemExit("D171 E058 missing local result close button")
          close = picker[start:end]
          if "markResultDismissed(" not in close or "dialog.dismiss()" not in close:
              raise SystemExit("D171 E058 Picker button must persist local dismiss and close")
          if "acknowledgeResult(" in close or "markResultStage(" in close:
              raise SystemExit("D171 E058 Picker button must never call Worker on click")
          overlay_close = critical.split("private fun finishActive(", 1)[1].split("private fun releaseUnacknowledgedResult(", 1)[0]
          if "markResultDismissed(" not in overlay_close or "acknowledgeResult" in overlay_close:
              raise SystemExit("D171 E058 foreground result overlay close must be local-only")
          if "markResultDisplayPending(" not in picker or "markResultDisplayPending(" not in critical:
              raise SystemExit("D171 E058 must persist actual DISPLAYED on both overlay paths")
          if "scopedAckKey(userId, RESULT_LOCAL_DISMISSED)" not in store:
              raise SystemExit("D171 E058 Picker dismiss must be account-scoped")
          PY
          if grep -q 'Cảnh báo tự đóng sau tối đa 60 giây' "$critical"; then
            echo "D135 must not expose the specialist-call TTL implementation detail to Picker." >&2
            exit 1
          fi
          grep -q 'android:label="1291 Báo hàng"' "$manifest"
          grep -q '1291 Báo hàng' "$main"
          grep -q 'chưa xác minh chuyển quyền dự phòng' "$client"
          grep -Fq 'isVerifiedRecoveryGrant(latest, requestId, identity)' "$client"
          grep -Fq 'snapshot.getString("picker_uid") != identity.uid' "$client"
          grep -Fq 'snapshot.getLong("picker_session_generation") != identity.sessionGeneration' "$client"
          grep -q 'snapshot.metadata.isFromCache' "$client"
          if grep -A8 'fun sendProbe' "$client" | grep -q 'runDueCleanup'; then
            echo "D115 cleanup must stay off the Picker confirmation critical path" >&2
            exit 1
          fi
          grep -q 'android:maxLength="20"' android/app/src/main/res/layout/view_picker.xml
          grep -q 'android:windowSoftInputMode="adjustResize"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:id="@+id/pickerOperationTabs"' android/app/src/main/res/layout/view_picker.xml
          if grep -q 'PROCESSING' "$client"; then
            echo "D097 confirmation client must not use PROCESSING" >&2
            exit 1
          fi
          if grep -q 'FIREBASE_RTDB_URL' "$client"; then
            echo "D097 confirmation client must not use RTDB" >&2
            exit 1
          fi
          echo "D171 E058 Android local-close and displayed receipt / D134 relay guards PASS"

      - name: Verify D143 Android default-password injection
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ANDROID_RELEASE_REQUIRED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${ANDROID_PICKER_DEFAULT_PASSWORD:-}" ] || {
            echo "Android Picker default password secret is not configured in the Beta GitHub environment." >&2
            exit 1
          }
          grep -q 'DEFAULT_PICKER_PASSWORD' android/app/build.gradle.kts
          grep -q 'BuildConfig.DEFAULT_PICKER_PASSWORD' android/app/src/main/java/cd/cc/supra/inventory/beta/MainActivity.kt
          echo "D143 secure Android password injection PASS"

      - name: Verify D148 Android session-end logs and live SKU refresh
        shell: bash
        run: |
          set -euo pipefail
          main="android/app/src/main/java/cd/cc/supra/inventory/beta/MainActivity.kt"
          messaging="android/app/src/main/java/cd/cc/supra/inventory/beta/StockMessagingService.kt"
          signal="android/app/src/main/java/cd/cc/supra/inventory/beta/NotificationSignalStore.kt"
          grep -q 'session_end_logout' "$main"
          grep -q 'flushPendingSessionEndRuntimeLog' "$main"
          if grep -q 'maybeUploadScheduledRuntimeLog' "$main" || grep -q 'currentRuntimeLogSlot' "$main"; then
            echo "D148 Android must not send scheduled PDA INFO logs." >&2
            exit 1
          fi
          grep -q 'syncSkuCatalogAsync("realtime"' "$main"
          grep -q 'reconcileSkuCatalogRefresh()' "$main"
          grep -q 'event == "sku_catalog_updated"' "$messaging"
          grep -q 'markSkuCatalogRefresh' "$signal"
          grep -q 'consumeSkuCatalogRefresh' "$signal"
          grep -q 'Đã gửi log và lưu Google Drive' "$main"
          grep -q 'Drive sẽ tự tiếp tục gửi' "$main"
          grep -q 'setNeutralButton("Gửi log")' "$main"
          if grep -q 'Drive đang chờ đồng bộ' "$main" || grep -q 'setNeutralButton("Gửi lên Drive")' "$main"; then
            echo "D148 Android log UI must not imply Drive sync before archive confirmation." >&2
            exit 1
          fi
          echo "D148 Android session-end log / live SKU refresh guard PASS"

      - name: Verify D151 adaptive Android alert engine
        shell: bash
        run: |
          set -euo pipefail
          readiness="android/app/src/main/java/cd/cc/supra/inventory/beta/AndroidAlertReadiness.kt"
          main="android/app/src/main/java/cd/cc/supra/inventory/beta/MainActivity.kt"
          messaging="android/app/src/main/java/cd/cc/supra/inventory/beta/StockMessagingService.kt"
          overlay="android/app/src/main/java/cd/cc/supra/inventory/beta/CriticalOverlayService.kt"
          wake="android/app/src/main/java/cd/cc/supra/inventory/beta/CriticalWakeCoordinator.kt"

          grep -Fq 'get() = notificationsReady && overlayReady && batteryReady' "$readiness"
          grep -q 'AlertDeliveryMode.NATIVE_DND' "$readiness"
          grep -q 'AlertDeliveryMode.OVERLAY_COMPAT' "$readiness"
          grep -q 'isNotificationPolicyAccessGranted' "$readiness"
          grep -q 'channel.canBypassDnd()' "$readiness"
          grep -q 'canUseFullScreenIntent' "$readiness"
          grep -q 'Chế độ tương thích Overlay' "$main"
          grep -q 'DND không chặn đăng nhập' "$main"
          grep -q 'CriticalWakeCoordinator.wakeForCriticalOverlayIfNeeded' "$messaging"
          grep -q 'AndroidAlertReadiness.canUseFullScreenIntent(this)' "$messaging"
          grep -q 'AndroidAlertReadiness.canUseFullScreenIntent(this)' "$overlay"
          grep -q 'KeyguardManager::class.java' "$wake"
          grep -q 'PowerManager::class.java' "$wake"
          grep -q 'context.startActivity(CriticalWakeActivity.intent' "$wake"

          if grep -E -q 'V8\.01\.002|MT90-GL_|NLS-MT90|Urovo DT50' "$readiness" "$main" "$messaging" "$wake"; then
            echo "D151 production alert selection must remain capability-based, not firmware/model allowlisted." >&2
            exit 1
          fi
          if grep -E -q 'newWakeLock|PARTIAL_WAKE_LOCK|\.acquire\(' "$wake"; then
            echo "D151 adaptive wake path must not acquire a WakeLock." >&2
            exit 1
          fi
          echo "D151 adaptive Android alert engine guard PASS"

      - name: D171 E032 Agent v140 plus APK vc115 exact-document contract (PR only)
        if: github.event_name == 'pull_request'
        run: node --test tests/d171-agent-android-v115.test.mjs
      - name: Assemble Android 11+ Beta APK
        env:
          FIREBASE_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
        run: |
          set -euo pipefail
          rm -rf android/dist
          mkdir -p android/dist
          if [ "$SIGNING_READY" = "true" ]; then
            gradle -p android :app:assembleRelease --no-daemon
            cp android/app/build/outputs/apk/release/app-release.apk android/dist/supra-inventory-beta.apk
          else
            gradle -p android :app:assembleDebug --no-daemon
            cp android/app/build/outputs/apk/debug/app-debug.apk android/dist/supra-inventory-beta.apk
          fi
          sha256sum android/dist/supra-inventory-beta.apk > android/dist/supra-inventory-beta.apk.sha256
      - name: Publish Beta APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: supra-inventory-beta-apk
          path: |
            android/dist/supra-inventory-beta.apk
            android/dist/supra-inventory-beta.apk.sha256
          if-no-files-found: error
          retention-days: 7
      - name: D170 production-label release preserves existing v138 Agent and Firestore rules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_READY == 'true' && env.ANDROID_RELEASE_REQUIRED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scope="$(jq -r '.code_scope // ""' ops/d170-release-authorization.json)"
          if [ "$scope" = "D170_OFFICIAL_CLIENT_HOST_PHASE3" ]; then
            test "$(jq -r '.approved_components | join(",")' ops/d170-release-authorization.json)" = "worker,agent,android"
            test "$(jq -r '.resource_change' ops/d170-release-authorization.json)" = "NONE_EXISTING_WORKER_ANDROID_AGENT_ONLY"
            gh release view relay-agent-v138 >/dev/null
            echo "D170_ANDROID_LEGACY_RUNTIME_COMPAT=true" >> "$GITHUB_ENV"
            echo "D170: preserve original Agent v138, Firestore protocol and signed Android identity during official host migration"
            exit 0
          fi
          [ "$scope" = "D170_OFFICIAL_BRANDING_LEGACY_OTA_PHASE1" ] || exit 0
          test "$(jq -r '.approved_components | join(",")' ops/d170-release-authorization.json)" = "worker,android"
          gh release view relay-agent-v138 >/dev/null
          for id in 39119373107 39119373112; do
            test "$(gh run view "$id" --json conclusion --jq .conclusion)" = "success" || {
              echo "D170: Existing Agent v138 and Firestore Rules runtime evidence not verified" >&2
              exit 1
            }
          done
          echo "D170_ANDROID_LEGACY_RUNTIME_COMPAT=true" >> "$GITHUB_ENV"
          echo "D170: existing Agent v138 and Firestore Rules preserved; require matching Worker deploy before APK"

      # E061 scoped Android-only release: the exact previously deployed Worker,
      # Firestore Rules and Agent v138 are compatible and unchanged in source.
      - name: D169-E061 verified prior Beta runtime compatibility for Android-only release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_READY == 'true' && env.ANDROID_RELEASE_REQUIRED == 'true' && env.D170_ANDROID_LEGACY_RUNTIME_COMPAT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d171_scope="$(jq -r '.code_scope // ""' ops/d171-release-authorization.json)"
          if [ "$d171_scope" = "D170_D171_SINGLE_OFFICIAL_PRODUCTION_V115_V140_WEB312" ]; then
            python3 tools/d167_release_gate.py --component android
            echo "D171 approved integrated runtime is not D169 Android-only"
            exit 0
          fi
          scope="$(jq -r '.code_scope // ""' ops/d169-release-authorization.json)"
          if [ "$scope" != "D169_E061_ANDROID_RESUME_BETA_ONLY" ]; then exit 0; fi
          test "$(jq -r '.approved_components | join(",")' ops/d169-release-authorization.json)" = "android"
          # Main before the E061 branch, not an arbitrary user-supplied ref.
          base="3467e4512bfdf2c0a5ec5e72cde4409f9671a021"
          git cat-file -e "$base^{commit}"
          if ! git diff --quiet "$base" "$GITHUB_SHA" -- \
            service/ web/ relay-agent/ relay-agent-webview2-host/ \
            firebase/ functions/ wrangler.beta.toml ops/apps-script/; then
            echo "E061 runtime source differs from deployed E060 baseline; release refused" >&2
            exit 1
          fi
          for id in 39119373089 39119373107 39119373112; do
            conclusion="$(gh run view "$id" --json conclusion --jq .conclusion)"
            [ "$conclusion" = "success" ] || { echo "Previous Beta runtime proof $id not successful" >&2; exit 1; }
          done
          gh release view relay-agent-v138 >/dev/null
          gh release view beta-vc111 >/dev/null
          health="$(curl -fsS --connect-timeout 5 --max-time 15 https://inventory-beta.supra.cc.cd/health)"
          echo "$health" | jq -e '.status == "ok" and .environment == "beta" and .storage.ok == true and (.missing_bindings | length) == 0 and .source_commit == "4077f86560ca6d3c189d9d5c102c17bf93812b81"' >/dev/null
          echo "D169_E061_ANDROID_RUNTIME_REUSED=true" >> "$GITHUB_ENV"
          echo "D169-E061: signed Android-only release uses unchanged healthy E060 Beta Worker/Rules/Agent v138"
      # E074 Android-only release: no Worker/Agent/Rules redeployment. Fail closed
      # if ANY business-runtime source differs from the signed vc116 runtime.
      - name: D171 E074 verify existing Production runtime before signed vc117
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_READY == 'true' && env.ANDROID_RELEASE_REQUIRED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$(jq -r '.owner_approval_reference // ""' ops/d171-release-authorization.json)"
          [ "$ref" = "OWNER_EXPLICIT_D171_DEPLOY_20261022_VC117_PICKER_REPORTER_REPAIR_E074" ] || exit 0
          [[ "$HEAD_MESSAGE" == D171-E074_ANDROID_ONLY:* ]] || {
            echo "D171 E074 requires exact protected Android-only merge receipt"; exit 1;
          }
          python3 tools/d167_release_gate.py --component android
          # D172 independently deployed the existing Worker at this verified SHA.
          # E074 must not mutate the D172 runtime or redeploy any provider.
          base="6c39e1f376e9181e8740201e037965d77cf94056"
          signed_base="c427e629e08c05c38b7c3336a4cdf9441019b967"
          git cat-file -e "$base^{commit}"
          git cat-file -e "$signed_base^{commit}"
          git diff --quiet "$base" "$GITHUB_SHA" -- \
            service/ web/ relay-agent/ relay-agent-webview2-host/ \
            firebase/ functions/ ops/apps-script/ service/wrangler.beta.toml || {
            echo "Business runtime differs from vc116 deployment; Android-only release denied"; exit 1;
          }
          [ "$(gh release view beta-vc116 --json targetCommitish --jq .targetCommitish)" = "$signed_base" ] || {
            echo "vc116 signed-source tag receipt mismatch"; exit 1;
          }
          [ "$(gh run view 39690797553 --json conclusion --jq .conclusion)" = "success" ] || {
            echo "Existing vc116 Worker release was not proven"; exit 1;
          }
          [ "$(gh run view 39706572009 --json conclusion --jq .conclusion)" = "success" ] || {
            echo "D172 current Worker release unverified; vc117 OTA denied"; exit 1;
          }
          health="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 18 https://inventory.supra.cc.cd/health)"
          echo "$health" | jq -e --arg sha "$base" \
            '.status == "ok" and .storage.ok == true and .source_commit == $sha and (.missing_bindings | length) == 0' >/dev/null || {
            echo "Existing Production Worker provenance/health mismatch"; exit 1;
          }
          echo "D171_E074_ANDROID_RUNTIME_REUSED=true" >> "$GITHUB_ENV"
          echo "D171 E074: unchanged Worker/Agent/Rules + signed vc116 source + live Worker health PASS"

      - name: Require successful Beta runtime gate for this source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_READY == 'true' && env.ANDROID_RELEASE_REQUIRED == 'true' && env.D169_E061_ANDROID_RUNTIME_REUSED != 'true' && env.D171_E074_ANDROID_RUNTIME_REUSED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            run_json="$(gh run list --workflow deploy-beta.yml --commit "$GITHUB_SHA" --limit 20 --json databaseId,status,conclusion,headSha 2>/dev/null || true)"
            run_id="$(echo "$run_json" | jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)][0].databaseId // empty')"
            status="$(echo "$run_json" | jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)][0].status // empty')"
            conclusion="$(echo "$run_json" | jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)][0].conclusion // empty')"
            echo "runtime gate attempt=$attempt run=${run_id:-pending} status=${status:-pending} conclusion=${conclusion:-pending}"
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] || { echo "Beta runtime gate failed for source $GITHUB_SHA (run $run_id: $conclusion)"; exit 1; }
              echo "Beta runtime gate PASS for source $GITHUB_SHA (run $run_id)"
              exit 0
            fi
            sleep 10
          done
          echo "Beta runtime gate did not reach terminal success for source $GITHUB_SHA" >&2
          exit 1

      # D169: publish vc111 only after the exact SHA's Firestore rules and
      # v136 Agent are available, so a PDA never submits a new recovery field
      # against obsolete Rules or relies on an absent Agent version.
      - name: D169 require Firestore Rules and Agent v136 before Android release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_READY == 'true' && env.ANDROID_RELEASE_REQUIRED == 'true' && env.D169_E061_ANDROID_RUNTIME_REUSED != 'true' && env.D170_ANDROID_LEGACY_RUNTIME_COMPAT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scope="$(jq -r '.code_scope // ""' ops/d171-release-authorization.json)"
          if [ "$scope" = "D170_D171_SINGLE_OFFICIAL_PRODUCTION_V115_V140_WEB312" ]; then
            # No Firebase Rules migration in D171. Verify the source matches
            # the actual last signed fleet, then wait for exact Agent v140.
            base="c8f58ce79f0ac4d59cdf547649e3f3a412e6d073"
            git cat-file -e "$base^{commit}"
            git diff --quiet "$base" "$GITHUB_SHA" -- firebase/firestore.rules firebase/firestore.indexes.json firebase.json || {
              echo "D171 Firebase Rules differ from pinned accepted source; separate authorization required"; exit 1;
            }
            for attempt in $(seq 1 120); do
              agent_sha="$(gh api "repos/${{ github.repository }}/git/ref/tags/relay-agent-v140" --jq .object.sha 2>/dev/null || true)"
              if [ -n "$agent_sha" ]; then
                git cat-file -e "$agent_sha^{commit}" || { echo "D171 Agent tag commit missing"; exit 1; }
                git diff --quiet "$agent_sha" "$GITHUB_SHA" -- relay-agent/ relay-agent-webview2-host/ || {
                  echo "D171 published v140 Agent source differs from current source"; exit 1;
                }
                runs="$(gh run list --workflow verify-relay-agent.yml --commit "$GITHUB_SHA" --limit 20 --json status,conclusion,headSha)"
                status="$(jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)][0].status // empty' <<<"$runs")"
                outcome="$(jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)][0].conclusion // empty' <<<"$runs")"
                if [ "$status" = "completed" ]; then
                  [ "$outcome" = "success" ] || { echo "D171 same-commit Agent verification failed"; exit 1; }
                  echo "D171 published v140 source parity and same-commit Agent CI plus unchanged Firestore Rules PASS"
                  exit 0
                fi
              fi
              [ "$attempt" -lt 120 ] || { echo "Agent v140 exact SHA release missing"; exit 1; }
              sleep 10
            done
          fi
          for attempt in $(seq 1 120); do
            runs="$(gh run list --workflow deploy-beta-firestore.yml --commit "$GITHUB_SHA" --limit 20 --json status,conclusion,headSha)"
            status="$(jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)][0].status // empty' <<<"$runs")"
            outcome="$(jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)][0].conclusion // empty' <<<"$runs")"
            if [ "$status" = "completed" ]; then
              [ "$outcome" = "success" ] || { echo "Beta Firestore Rules not deployed; Android release blocked."; exit 1; }
              break
            fi
            [ "$attempt" -lt 120 ] || { echo "Beta Firestore Rules deployment not verified"; exit 1; }
            sleep 10
          done
          for attempt in $(seq 1 120); do
            tag_sha="$(gh api "repos/${{ github.repository }}/git/ref/tags/relay-agent-v136" --jq .object.sha 2>/dev/null || true)"
            if [ "$tag_sha" = "$GITHUB_SHA" ]; then
              echo "D169 Agent v136 exact-source release PASS; Android may publish"
              break
            fi
            [ "$attempt" -lt 120 ] || { echo "Agent v136 release missing for exact source SHA; Android blocked"; exit 1; }
            sleep 10
          done

      - name: Publish signed Beta auto-update release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_READY == 'true' && env.ANDROID_RELEASE_REQUIRED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="beta-vc${APP_VERSION_CODE}"
          title="1291 Báo hàng vc${APP_VERSION_CODE}"
          jq -r --arg name "$title" --arg sha "$GITHUB_SHA" '
            $name + "\nSource: " + $sha + "\n\nNội dung cập nhật:\n" +
            (.release_notes | map("- " + .) | join("\n"))
          ' android/release-notes.json > android/dist/release-notes.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $tag" >&2
            exit 1
          fi
          gh release create "$tag" android/dist/supra-inventory-beta.apk android/dist/supra-inventory-beta.apk.sha256 --target "$GITHUB_SHA" --title "$title" --notes-file android/dist/release-notes.txt
          echo "Published Beta release $tag"

          channel="inventory-channel"
          if ! gh release view "$channel" >/dev/null 2>&1; then
            gh release create "$channel" --target "$GITHUB_SHA" --title "SUPRA Inventory runtime channel" --notes "Machine-readable Beta distribution channel. Do not install directly from this release page." --prerelease || gh release view "$channel" >/dev/null
          fi
          apk_sha="$(awk '{print $1}' android/dist/supra-inventory-beta.apk.sha256)"
          apk_size="$(stat -c%s android/dist/supra-inventory-beta.apk)"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg tag "$tag" \
            --arg name "$title" \
            --arg published_at "$published_at" \
            --arg source "$GITHUB_SHA" \
            --arg sha256 "$apk_sha" \
            --argjson size_bytes "$apk_size" \
            --slurpfile changelog android/release-notes.json \
            '{schema_version:1, channel:"beta", tag:$tag, name:$name, published_at:$published_at, source:$source, asset_name:"supra-inventory-beta.apk", size_bytes:$size_bytes, sha256:$sha256, release_notes:$changelog[0].release_notes}' \
            > android/dist/pda-latest.json
          # Publish an extra friendly manual-download filename; preserve old asset and manifest for signed v114 OTA.
          cp android/dist/supra-inventory-beta.apk android/dist/1291-Bao-Hang.apk
          cmp android/dist/supra-inventory-beta.apk android/dist/1291-Bao-Hang.apk
          gh release upload "$channel" android/dist/supra-inventory-beta.apk android/dist/supra-inventory-beta.apk.sha256 android/dist/1291-Bao-Hang.apk android/dist/pda-latest.json --clobber
          echo "Updated stable PDA runtime channel $channel -> $tag"
