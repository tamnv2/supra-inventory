name: D173 E126 Reporter Badge Sequence Fence and D172 Guard
on:
  pull_request:
    paths:
      - "android/app/src/main/java/cd/cc/supra/inventory/beta/ReporterController.kt"
      - "android/app/src/main/java/cd/cc/supra/inventory/beta/InventoryApi.kt"
      - "tests/d173-e126-reporter-badge.test.mjs"
      - ".github/workflows/d173-e126-badge-ci.yml"
      - "ops/d173-e126-release-authorization.json"
      - "tools/d173_e126_release_gate.py"
      - "tools/d167_release_gate.py"
      - ".github/workflows/verify-apps.yml"
      - ".github/workflows/deploy-beta.yml"
      - "android/release-notes.json"
permissions:
  contents: read
jobs:
  badge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: E126 historical signed-APK receipt or exact E140 successor scope
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_HEAD_REF" = "docs/d173-e140-picklist-confirm-guard-forensics-20261105" ]; then
            # vc125-only E126 grant must stay DENIED for the new vc126 source.
            if python3 tools/d173_e126_release_gate.py --component android --preflight; then
              echo "::error::E126 previous Android-only release grant accidentally reused"
              exit 1
            fi
            python3 tools/d173_e140_preflight.py
            echo "E126_GRANT_DENIED_E140_SOURCE_AUTHORIZED"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_HEAD_REF" = "fix/d173-e143-agent168-layout-embedded-browser-20261106" ]; then
            # E143 never deploys Android. Keep vc125 historical release denied,
            # prove Android/provider/D172 source unchanged, test Agent release.
            if python3 tools/d173_e126_release_gate.py --component android --preflight; then
              echo "::error::E143 must not inherit Android125 release authority"
              exit 1
            fi
            git diff --quiet c72bf989f69668bad677da47ccc76faa30908aee HEAD -- android/ service/ web/ firebase/ firebase.json functions/ obpp1291/ pda-management/ ops/apps-script/ relay-agent-webview2-host/
            python3 tools/d173_e143_agent168_release_gate.py --component agent --preflight
            echo "E143_AGENT_ONLY__ANDROID125_GRANT_DENIED__D172_PRESERVED"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_HEAD_REF" = "fix/d173-e146-agent169-picker-cutoff-20261107" ]; then
            # E148 allows only signed Agent169 + existing Worker scheduled
            # Picker cutoff. E126 Android grant must remain explicitly denied.
            if python3 tools/d173_e126_release_gate.py --component android --preflight; then
              echo "::error::E148 must not inherit Android125 release rights"
              exit 1
            fi
            git diff --quiet a35243aa4bcdffbd37e7ba26be65341de8ccb17e HEAD -- \
              android/ firebase/ firebase.json obpp1291/ pda-management/ \
              ops/apps-script/ functions/ relay-agent-webview2-host/ || {
              echo "::error::E148 Android/Firebase/D172 provider code changed"
              exit 1
            }
            python3 tools/d173_e148_release_gate.py --component worker --preflight
            echo 'E148_NO_APK_MUTATION__D172_HOLD__OLD_ANDROID_GRANT_DENIED'
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_HEAD_REF" = "fix/d173-e149-agent170-activity-webtab-20261107" ]; then
            # E150 is Agent170+Host13 ONLY. The old Android125 grant
            # must DENY, but E126 functional and D172 regressions still run.
            if python3 tools/d173_e126_release_gate.py --component android --preflight; then
              echo "::error::E150 must not inherit Android125 release rights"
              exit 1
            fi
            git diff --quiet b8eed46a1676ccb8113690c676fe4b28b9caa17e HEAD -- \
              android/ service/ web/ firebase/ firebase.json functions/ obpp1291/ \
              pda-management/ ops/apps-script/ || {
              echo "::error::E150 provider/Android/D172 mutation denied"
              exit 1
            }
            python3 tools/d173_e150_agent170_release_gate.py --component agent --preflight
            echo 'E150_AGENT170_ONLY__OLD_ANDROID_GRANT_DENIED__D172_PRESERVED'
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_HEAD_REF" = "feat/d173-e165-tray-usage0530-dayline-20261108" ]; then
            # New E167 Android127 scope; the historical E126 receipt must DENY.
            if python3 tools/d173_e126_release_gate.py --component android --preflight; then
              echo "::error::E167 accidentally inherited Android125 grant"; exit 1
            fi
            python3 tools/d173_e165_agent174_release_gate.py --component android --preflight
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] && { [ "$GITHUB_HEAD_REF" = "feat/d173-e169-diagnostic-attribution-20261108" ] || [ "$GITHUB_HEAD_REF" = "fix/d173-e172-agent175-release-trigger-20261108" ]; }; then
            # E170 does not change the Android APK. Historical vc125 signing
            # must DENY while new Worker/Agent175 Owner scope is verified.
            if python3 tools/d173_e126_release_gate.py --component android --preflight; then
              echo "::error::E170 inherited Android signing grant"; exit 1
            fi
            git diff --quiet 20038af1004f7167209fc19a32083da35500e7c1 HEAD -- android/ firebase/ firebase.json functions/ obpp1291/ pda-management/ ops/apps-script/ relay-agent-webview2-host/
            python3 tools/d173_e170_release_gate.py --component worker --preflight
            echo 'E170_ANDROID_UNCHANGED_OLD_GRANT_DENIED_NEW_GATE_PASS'
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_HEAD_REF" = "fix/d173-e174-agent176-focus-log-backlog-20261109" ]; then
            # E174 is signed Agent176 ONLY. Historical E126 Android125
            # authorization stays denied, with unchanged Android/D172/API
            # and a separate Agent-focused source gate.
            if python3 tools/d173_e126_release_gate.py --component android --preflight; then
              echo "::error::E174 must not inherit vc125 Android release rights"
              exit 1
            fi
            git diff --quiet "$(git merge-base origin/main HEAD)" HEAD -- android/ service/ web/ firebase/ firebase.json functions/ obpp1291/ pda-management/ ops/apps-script/ relay-agent-webview2-host/ || {
              echo "::error::E174 Android/Worker/D172/provider source mutation denied"
              exit 1
            }
            python3 tools/d173_e174_agent176_release_gate.py --component agent --preflight
            echo 'E174_AGENT_ONLY__E126_ANDROID_DENIED__D172_UNCHANGED'
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] && { [ "$GITHUB_HEAD_REF" = "feat/d173-e175-unified-network-logs-ui-20261110" ] || [ "$GITHUB_HEAD_REF" = "fix/d173-e175-production-release-workflow-repair-20261110" ] || [ "$GITHUB_HEAD_REF" = "fix/d173-e175-d146-ten-slot-production-20261110" ]; }; then
            # E175 is newly approved cross-component Báo hàng code; the vc125
            # E126 signing grant remains forbidden. Its own source/D172 tests
            # are mandatory and do not imply authorization to publish APK.
            if python3 tools/d173_e126_release_gate.py --component android --preflight; then
              echo "::error::E175 inherited obsolete E126 Android125 signing grant"
              exit 1
            fi
            node --test tests/d173-e175-unified-network.test.mjs
            git diff --quiet "$(git merge-base origin/main HEAD)" HEAD -- obpp1291/ pda-management/ || {
              echo "::error::E175 may not mutate independent D172 APK or management sources"; exit 1
            }
            echo 'E175_OLD_ANDROID_GRANT_DENIED__NEW_OWNER_SCOPE_TESTED__D172_ISOLATION'
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_HEAD_REF" = "fix/d173-e182-agent181-field-40-60-flicker-20261110" ]; then
            if python3 tools/d173_e126_release_gate.py --component android --preflight >/dev/null 2>&1; then
              echo "::error::Agent182 inherited historical Android125 signed authority"; exit 1
            fi
            git diff --quiet "$(git merge-base origin/main HEAD)" HEAD -- android/ service/ web/ firebase/ firebase.json functions/ obpp1291/ pda-management/ ops/apps-script/ relay-agent-webview2-host/ || {
              echo "::error::Agent182 must not modify D172 or any provider and Android source"; exit 1
            }
            python3 tools/d173_e182_agent182_release_gate.py --component agent --preflight
            echo 'AGENT182_ANDROID_SIGNING_DENIED__D172_INDEPENDENT_UNTOUCHED'
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_HEAD_REF" = "fix/d173-e182-agent180-field-layout-autowidth-20261110" ]; then
            # Owner Agent181 FIELD-only repair never inherits obsolete vc125
            # Android signing authority, Worker/Firestore/D172 mutations.
            if python3 tools/d173_e126_release_gate.py --component android --preflight; then
              echo "::error::Agent181 inherited Android125 signing permission"; exit 1
            fi
            git diff --quiet "$(git merge-base origin/main HEAD)" HEAD -- android/ service/ web/ firebase/ firebase.json functions/ obpp1291/ pda-management/ ops/apps-script/ relay-agent-webview2-host/ || {
              echo "::error::Agent181 touched unrelated provider or D172 source"; exit 1
            }
            python3 tools/d173_e182_agent181_release_gate.py --component agent --preflight
            echo 'E182_AGENT181_AGENT_ONLY__ANDROID125_SIGNING_DENIED__D172_UNCHANGED'
          else
            python3 tools/d173_e126_release_gate.py --component android --preflight
          fi
      - name: E126 stream baseline, duplicate and epoch regression
        run: node --test tests/d173-e126-reporter-badge.test.mjs
      - name: Install existing service TypeScript test dependency
        run: npm --prefix service install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Independent D172 backend business isolation regression
        run: node --test tests/d172-*.test.mjs
