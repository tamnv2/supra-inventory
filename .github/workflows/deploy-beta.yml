name: Deploy Beta Worker

on:
  push:
    branches: [main]
    paths:
      - "service/**"
      - "web/**"
      - "android/**"
      - ".github/workflows/deploy-beta.yml"
      - ".github/workflows/verify-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supra-inventory-beta-deploy
  cancel-in-progress: true

jobs:
  deploy-beta:
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Firebase Web config
        env:
          FIREBASE_WEB_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
        run: |
          set -euo pipefail
          [ -n "${FIREBASE_WEB_API_KEY_BETA:-}" ] || { echo "FIREBASE_WEB_API_KEY_BETA is missing from Beta variable/secret scope"; exit 1; }
          [ "${#FIREBASE_WEB_API_KEY_BETA}" -ge 20 ] || { echo "FIREBASE_WEB_API_KEY_BETA looks invalid"; exit 1; }
          echo "Firebase Web API key presence PASS"

      - name: Install Web dependencies
        working-directory: web
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build Web Beta
        working-directory: web
        env:
          VITE_API_BASE_URL: https://inventory-beta.supra.cc.cd
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
          VITE_FIREBASE_AUTH_DOMAIN: supra-inventory-beta.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: supra-inventory-beta
          VITE_FIREBASE_APP_ID: 1:572322098890:web:96459cf386b3fb6f400e33
          VITE_FIREBASE_MESSAGING_SENDER_ID: "572322098890"
        run: npm run build

      - name: Install service dependencies
        working-directory: service
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck service
        working-directory: service
        run: npm run typecheck

      - name: Cloudflare token preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_INVENTORY_BETA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          verify="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")"
          [ "$(echo "$verify" | jq -r '.success')" = "true" ] || { echo "Cloudflare token verify failed"; exit 1; }
          [ "$(echo "$verify" | jq -r '.result.status')" = "active" ] || { echo "Cloudflare token is not active"; exit 1; }
          service_code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/supra-inventory-beta")"
          [ "$service_code" = "200" ] || { echo "Beta Worker API preflight failed: HTTP $service_code"; exit 1; }
          echo "Cloudflare Beta preflight PASS"

      - name: Deploy Beta Worker, Web assets and Durable Object
        working-directory: service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_INVENTORY_BETA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
        run: npx --yes wrangler@4 deploy --config wrangler.beta.toml --keep-vars --var "FIREBASE_WEB_API_KEY:${FIREBASE_WEB_API_KEY}"

      - name: Verify Beta health, Root secret and SQLite schema
        env:
          BETA_HOSTNAME: ${{ vars.BETA_HOSTNAME }}
        run: |
          set -euo pipefail
          url="https://${BETA_HOSTNAME}/health"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          for attempt in $(seq 1 12); do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp" -w '%{http_code}' "$url" || true)"
            status="$(jq -r '.status // empty' "$tmp" 2>/dev/null || true)"
            env_name="$(jq -r '.environment // empty' "$tmp" 2>/dev/null || true)"
            missing_count="$(jq -r '.missing_bindings | length' "$tmp" 2>/dev/null || echo 999)"
            refresh_configured="$(jq -r '.oauth_refresh_token_configured // false' "$tmp" 2>/dev/null || echo false)"
            root_secret_configured="$(jq -r '.root_bootstrap_secret_configured // false' "$tmp" 2>/dev/null || echo false)"
            storage_ok="$(jq -r '.storage.ok // false' "$tmp" 2>/dev/null || echo false)"
            schema_version="$(jq -r '.storage.schema_version // 0' "$tmp" 2>/dev/null || echo 0)"
            expected_schema="$(jq -r '.storage.expected_schema_version // 0' "$tmp" 2>/dev/null || echo 0)"
            operational_ready="$(jq -r '.storage.operational_v2.ready // false' "$tmp" 2>/dev/null || echo false)"
            operational_schema="$(jq -r '.storage.operational_v2.schema_version // 0' "$tmp" 2>/dev/null || echo 0)"
            operational_expected="$(jq -r '.storage.operational_v2.expected_schema_version // 0' "$tmp" 2>/dev/null || echo 0)"
            echo "health attempt=$attempt http=${code:-000} status=${status:-n/a} env=${env_name:-n/a} missing=${missing_count:-999} refresh=${refresh_configured:-false} root_secret=${root_secret_configured:-false} storage=${storage_ok:-false} schema=${schema_version:-0}/${expected_schema:-0} operational=${operational_ready:-false}:${operational_schema:-0}/${operational_expected:-0}"
            if [ "$code" = "200" ] && [ "$status" = "ok" ] && [ "$env_name" = "beta" ] && [ "$missing_count" = "0" ] && [ "$refresh_configured" = "true" ] && [ "$root_secret_configured" = "true" ] && [ "$storage_ok" = "true" ] && [ "$schema_version" = "$expected_schema" ] && [ "$schema_version" != "0" ] && [ "$operational_ready" = "true" ] && [ "$operational_schema" = "$operational_expected" ] && [ "$operational_schema" != "0" ]; then
              echo "Beta health + Root secret + SQLite PASS: $url"
              exit 0
            fi
            [ "$attempt" -ge 12 ] || sleep 5
          done
          echo "Beta health FAILED. Safe response body follows:"
          cat "$tmp"
          exit 1

      - name: Verify Beta auth API routing and Root bootstrap path
        env:
          BETA_HOSTNAME: ${{ vars.BETA_HOSTNAME }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT

          code="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp" -w '%{http_code}' -X POST "https://${BETA_HOSTNAME}/api/auth/login" -H 'content-type: application/json' -H 'accept: application/json' --data '{"username":"__ci_probe__","password":"invalid"}')"
          [ "$code" = "401" ] || { echo "Auth API expected HTTP 401, got $code"; head -c 500 "$tmp"; exit 1; }
          jq -e '.error == "INVALID_CREDENTIALS"' "$tmp" >/dev/null || { echo "Auth API did not return expected JSON"; head -c 500 "$tmp"; exit 1; }

          code="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp" -w '%{http_code}' -X POST "https://${BETA_HOSTNAME}/api/auth/login" -H 'content-type: application/json' -H 'accept: application/json' --data '{"username":"root","password":"__definitely_wrong_ci_password__"}')"
          [ "$code" = "401" ] || { echo "Root bootstrap probe expected HTTP 401, got $code"; head -c 500 "$tmp"; exit 1; }
          jq -e '.error == "INVALID_CREDENTIALS"' "$tmp" >/dev/null || { echo "Root bootstrap path did not return expected JSON"; head -c 500 "$tmp"; exit 1; }
          echo "Beta auth API routing + Root bootstrap path PASS"

      - name: Verify Beta business API capability and auth guards
        env:
          BETA_HOSTNAME: ${{ vars.BETA_HOSTNAME }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT

          code="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp" -w '%{http_code}' "https://${BETA_HOSTNAME}/api/system/capabilities")"
          [ "$code" = "200" ] || { echo "Capabilities expected HTTP 200, got $code"; head -c 500 "$tmp"; exit 1; }
          jq -e '.business_api.version == 1 and .business_api.sku_master == "implemented" and .business_api.picker_report_withdraw == "implemented" and .business_api.reporter_priority_resolve_correction == "implemented" and .business_api.operational_v2_ready == true and .business_api.operational_v2_schema_version >= 1 and .realtime_foreground == "websocket_sequence_delta_on_inventory_core"' "$tmp" >/dev/null || { echo "Business/Operational V2 capability marker missing"; head -c 900 "$tmp"; exit 1; }

          for path in "/api/skus" "/api/picker/reports" "/api/reporter/queue" "/api/admin/reports"; do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp" -w '%{http_code}' "https://${BETA_HOSTNAME}${path}")"
            [ "$code" = "401" ] || { echo "Unauthenticated ${path} expected HTTP 401, got $code"; head -c 500 "$tmp"; exit 1; }
            jq -e '.error == "AUTH_REQUIRED"' "$tmp" >/dev/null || { echo "${path} auth guard JSON mismatch"; head -c 500 "$tmp"; exit 1; }
          done

          code="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp" -w '%{http_code}' -X POST "https://${BETA_HOSTNAME}/api/admin/skus/import" -H 'content-type: application/json' --data '{"request_id":"ci-probe-0001","items":[]}')"
          [ "$code" = "401" ] || { echo "Unauthenticated SKU import expected HTTP 401, got $code"; head -c 500 "$tmp"; exit 1; }
          jq -e '.error == "AUTH_REQUIRED"' "$tmp" >/dev/null || { echo "SKU import auth guard JSON mismatch"; head -c 500 "$tmp"; exit 1; }
          echo "Beta business API capability + auth guards PASS"

      - name: Verify Beta Web shell
        env:
          BETA_HOSTNAME: ${{ vars.BETA_HOSTNAME }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          code="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp" -w '%{http_code}' "https://${BETA_HOSTNAME}/")"
          [ "$code" = "200" ] || { echo "Beta Web root returned HTTP $code"; exit 1; }
          grep -Fq '<div id="app"></div>' "$tmp" || { echo "Beta Web shell marker missing"; exit 1; }
          grep -Fq 'SUPRA Inventory' "$tmp" || { echo "Beta Web title marker missing"; exit 1; }
          echo "Beta Web shell PASS"

      - name: Verify Beta Google OAuth start
        env:
          BETA_HOSTNAME: ${{ vars.BETA_HOSTNAME }}
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          code="$(curl -sS --connect-timeout 5 --max-time 15 -D "$headers" -o /dev/null -w '%{http_code}' "https://${BETA_HOSTNAME}/api/oauth/google/start")"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
          cookie="$(awk 'BEGIN{IGNORECASE=1} /^set-cookie:/ {print; exit}' "$headers")"
          [ "$code" = "302" ] || { echo "Expected OAuth HTTP 302"; exit 1; }
          case "$location" in https://accounts.google.com/o/oauth2/v2/auth*) ;; *) echo "Unexpected OAuth redirect target"; exit 1 ;; esac
          echo "$cookie" | grep -qi 'inventory_oauth_state=' || { echo "OAuth state cookie missing"; exit 1; }
          echo "Beta OAuth start PASS"
