name: Deploy Beta Worker

on:
  push:
    branches: [main]
    paths:
      - "service/src/**"
      - "service/wrangler.beta.toml"
      - ".github/workflows/deploy-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supra-inventory-beta-deploy
  cancel-in-progress: true

jobs:
  deploy-beta:
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Upload Beta Worker version
        working-directory: service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_INVENTORY_BETA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          TAG="ci-${GITHUB_SHA::12}"
          npx --yes wrangler@4 versions upload \
            --config wrangler.beta.toml \
            --keep-vars \
            --tag "$TAG" \
            --message "GitHub Actions $GITHUB_SHA"

      - name: Deploy uploaded Beta version
        working-directory: service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_INVENTORY_BETA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          TAG="ci-${GITHUB_SHA::12}"
          npx --yes wrangler@4 versions deploy \
            --config wrangler.beta.toml \
            --version-tag "$TAG" \
            --yes
