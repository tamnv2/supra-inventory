name: Deploy Beta Worker

on:
  push:
    branches: [main]
    paths:
      - "service/src/**"
      - "service/wrangler.beta.toml"
      - ".github/workflows/deploy-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supra-inventory-beta-deploy
  cancel-in-progress: true

jobs:
  deploy-beta:
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cloudflare token preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_INVENTORY_BETA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          check_endpoint() {
            label="$1"
            url="$2"
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "$url")"
            success="$(jq -r '.success // false' "$tmp" 2>/dev/null || echo false)"
            status="$(jq -r '.result.status // empty' "$tmp" 2>/dev/null || true)"
            err_code="$(jq -r '.errors[0].code // empty' "$tmp" 2>/dev/null || true)"
            err_msg="$(jq -r '.errors[0].message // empty' "$tmp" 2>/dev/null || true)"
            echo "$label: http=$code success=$success status=${status:-n/a} error_code=${err_code:-none} error_message=${err_msg:-none}"
            rm -f "$tmp"
          }

          check_endpoint "token-verify" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"
          check_endpoint "beta-script-api" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/supra-inventory-beta"
          check_endpoint "stable-script-api" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/supra-inventory-stable"
          check_endpoint "beta-service-api" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/supra-inventory-beta"

      - name: Upload Beta Worker version
        working-directory: service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_INVENTORY_BETA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          TAG="ci-${GITHUB_SHA::12}"
          npx --yes wrangler@4 versions upload \
            --config wrangler.beta.toml \
            --keep-vars \
            --tag "$TAG" \
            --message "GitHub Actions $GITHUB_SHA"

      - name: Deploy uploaded Beta version
        working-directory: service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_INVENTORY_BETA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          TAG="ci-${GITHUB_SHA::12}"
          npx --yes wrangler@4 versions deploy \
            --config wrangler.beta.toml \
            --version-tag "$TAG" \
            --yes

      - name: Verify Beta health on custom domain
        env:
          BETA_HOSTNAME: ${{ vars.BETA_HOSTNAME }}
        run: |
          set -euo pipefail
          url="https://${BETA_HOSTNAME}/health"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT

          for attempt in $(seq 1 12); do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp" -w '%{http_code}' "$url" || true)"
            status="$(jq -r '.status // empty' "$tmp" 2>/dev/null || true)"
            env_name="$(jq -r '.environment // empty' "$tmp" 2>/dev/null || true)"
            missing_count="$(jq -r '.missing_bindings | length' "$tmp" 2>/dev/null || echo 999)"
            echo "health attempt=$attempt http=${code:-000} status=${status:-n/a} environment=${env_name:-n/a} missing=${missing_count:-999}"

            if [ "$code" = "200" ] && [ "$status" = "ok" ] && [ "$env_name" = "beta" ] && [ "$missing_count" = "0" ]; then
              echo "Beta health PASS: $url"
              exit 0
            fi

            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done

          echo "Beta health FAILED. Safe response body follows:"
          cat "$tmp"
          exit 1
