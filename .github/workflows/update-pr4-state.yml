name: Update PR4 Canonical State

on:
  push:
    branches: [fix/beta-version-monotonic-auth-hardening]
    paths: [".github/workflows/update-pr4-state.yml"]

permissions:
  contents: write

jobs:
  update-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beta-version-monotonic-auth-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update canonical state and remove this one-shot workflow
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("ops/project-state.json")
          state = json.loads(p.read_text(encoding="utf-8"))
          status = state["current_status"]
          status["web"] = "PRACTICAL_BALANCED_CANONICAL_SOURCE_PR4_VALIDATION"
          status["android"] = "PRACTICAL_BALANCED_CANONICAL_SOURCE_AND_MONOTONIC_OTA_PR4_VALIDATION"
          status["user_management"] = "EXPANDED_ROOT_ADMIN_PICKER_LIFECYCLE_FLEXIBLE_HR_DIRECT_PASSWORD_PR4_VALIDATION"
          status["ui_design_guard"] = "PRACTICAL_BALANCED_CANONICAL_SOURCE_GUARD_PR4_VALIDATION"
          state["pending_build"] = [
            "PR #4 authority + continuity + Practical Balanced source guard + Worker typecheck + Web production build + Android debug build terminal PASS",
            "After PR #4 merge: Beta Worker/Web deploy smoke and signed Android release with monotonic versionCode greater than beta-vc30",
            "Runtime smoke for expanded Root/Admin account hierarchy, direct managed-password flow, flexible HR header mapping and manual Picker lifecycle",
            "Field-verify FCM delivery on a physical logged-in PDA; technical foundation is deployed",
            "Owner business acceptance",
            "Isolated business-mutation load acceptance after Owner scale target is defined"
          ]
          state["next_action"] = {
            "primary": "Complete PR #4 through authority + continuity + canonical UI/source + service/Web/Android checks; repair until terminal PASS; merge; then require Beta deploy smoke and signed beta-vc31-or-higher evidence before updating runtime baseline. Stable remains gated.",
            "method": "Treat ops/project-state.json and runtime evidence as authoritative; beta-vc30 remains the accepted Android runtime baseline until a signed versionCode greater than 30 is published successfully.",
            "stable_guard": "Do not activate Stable."
          }
          state["workboard"]["in_progress"] = [
            "PR #4 canonical Practical Balanced Web source reconciliation",
            "PR #4 Root/Admin/Reporter/Picker RBAC and direct managed-password hardening",
            "PR #4 configurable HR headers and explicit Picker one/many/all lifecycle",
            "PR #4 Android Beta monotonic versionCode release hardening"
          ]
          state["workboard"]["next"] = [
            "Repair PR #4 CI until authority, continuity, canonical UI source, service, Web and Android checks all PASS",
            "Merge PR #4 only after all required checks PASS",
            "Verify Beta Worker/Web deploy and signed Android beta-vc31-or-higher release",
            "Record final runtime commit/release/hash evidence in canonical state/resource registry",
            "Owner field-test resulting Beta Web/PDA and report numbered business/UI findings",
            "Field-verify foreground realtime and background FCM delivery on a logged-in physical PDA"
          ]
          p.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          rm .github/workflows/update-pr4-state.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/project-state.json .github/workflows/update-pr4-state.yml
          git commit -m "chore: update canonical state for PR4 validation"
          git push origin HEAD:fix/beta-version-monotonic-auth-hardening
