name: D169 Standalone PDA Diagnostic APK
on:
  pull_request:
    paths:
      - "tools/d169-network-diag-android/**"
      - ".github/workflows/verify-d169-network-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Use hosted Android SDK 35
        run: |
          test -n "$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build separate diagnostic APK
        run: gradle -p tools/d169-network-diag-android --no-daemon :app:assembleDebug
      - name: Verify output
        run: test -s tools/d169-network-diag-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SUPRA-PDA-Network-Diagnostic-V4
          path: tools/d169-network-diag-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
