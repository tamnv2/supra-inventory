name: Apply Concept 3 Finish Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-concept3-finish.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: beta
    env:
      APP_VERSION_CODE: "30"
      APP_VERSION_NAME: "0.2.0-beta.30"
      FIREBASE_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
      BETA_KEYSTORE_B64: ${{ secrets.BETA_KEYSTORE_B64 }}
      BETA_KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
      BETA_KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
      BETA_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Apply Concept 3 finish patch
        run: |
          set -euo pipefail
          python3 tools/apply_concept3_finish.py
          git diff --check
          python3 tools/project_state_guard.py
          grep -Fq 'placeholder="Tên đăng nhập / MNV"' web/src/main.ts
          ! grep -Fq 'value="root"' web/src/main.ts
          ! grep -Fq 'id="hr-result"' web/src/main.ts
          grep -Fq 'class="source-summary"' web/src/main.ts
          grep -Fq 'service-indicator' web/src/styles.css
          grep -Fq 'private fun statusBadge' android/app/src/main/java/cd/cc/supra/inventory/beta/MainActivity.kt
          grep -Fq 'conceptRedSoft' android/app/src/main/java/cd/cc/supra/inventory/beta/MainActivity.kt
          echo "Concept 3 finish static guard PASS"

      - name: Build Web production gate
        working-directory: web
        env:
          VITE_API_BASE_URL: https://inventory-beta.supra.cc.cd
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
          VITE_FIREBASE_AUTH_DOMAIN: supra-inventory-beta.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: supra-inventory-beta
          VITE_FIREBASE_APP_ID: 1:572322098890:web:96459cf386b3fb6f400e33
          VITE_FIREBASE_MESSAGING_SENDER_ID: "572322098890"
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Typecheck service regression
        working-directory: service
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Compile Android debug gate
        run: |
          set -euo pipefail
          [ -n "${FIREBASE_API_KEY_BETA:-}" ] || { echo "Missing Firebase Beta API key"; exit 1; }
          gradle -p android :app:assembleDebug --no-daemon

      - name: Deploy Concept 3 finish Web to Beta
        working-directory: service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_INVENTORY_BETA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.beta.toml --keep-vars --var "FIREBASE_WEB_API_KEY:${FIREBASE_WEB_API_KEY}"

      - name: Smoke Beta Web and schema
        env:
          BETA_HOSTNAME: ${{ vars.BETA_HOSTNAME }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          ok=false
          for attempt in $(seq 1 18); do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -A 'SUPRA-Inventory-CI/1.0' -o "$tmp" -w '%{http_code}' "https://${BETA_HOSTNAME}/health" || true)"
            status="$(jq -r '.status // empty' "$tmp" 2>/dev/null || true)"
            schema="$(jq -r '.storage.schema_version // 0' "$tmp" 2>/dev/null || true)"
            if [ "$code" = "200" ] && [ "$status" = "ok" ] && [ "$schema" = "5" ]; then ok=true; break; fi
            [ "$attempt" -ge 18 ] || sleep 5
          done
          [ "$ok" = "true" ] || { echo "Beta health/schema smoke failed"; cat "$tmp"; exit 1; }
          code="$(curl -sS --connect-timeout 5 --max-time 15 -A 'SUPRA-Inventory-CI/1.0' -o "$tmp" -w '%{http_code}' "https://${BETA_HOSTNAME}/")"
          [ "$code" = "200" ] || { echo "Web shell HTTP $code"; exit 1; }
          grep -Fq '<div id="app"></div>' "$tmp" || { echo "Web shell marker missing"; exit 1; }
          echo "Concept 3 finish Web runtime PASS"

      - name: Verify signing configuration
        run: |
          set -euo pipefail
          for name in BETA_KEYSTORE_B64 BETA_KEYSTORE_PASSWORD BETA_KEY_ALIAS BETA_KEY_PASSWORD; do
            [ -n "${!name:-}" ] || { echo "Missing ${name}"; exit 1; }
          done
          key_path="$RUNNER_TEMP/supra-inventory-beta.jks"
          printf '%s' "$BETA_KEYSTORE_B64" | base64 --decode > "$key_path"
          keytool -list -keystore "$key_path" -storepass "$BETA_KEYSTORE_PASSWORD" -alias "$BETA_KEY_ALIAS" >/dev/null
          echo "BETA_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build signed beta-vc30
        run: |
          set -euo pipefail
          rm -rf android/dist
          mkdir -p android/dist
          gradle -p android :app:assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk android/dist/supra-inventory-beta.apk
          sha256sum android/dist/supra-inventory-beta.apk > android/dist/supra-inventory-beta.apk.sha256
          test -s android/dist/supra-inventory-beta.apk
          keytool -printcert -jarfile android/dist/supra-inventory-beta.apk >/dev/null
          echo "SIGNED_SHA256=$(cut -d' ' -f1 android/dist/supra-inventory-beta.apk.sha256)" >> "$GITHUB_ENV"
          echo "SIGNED_SIZE=$(stat -c%s android/dist/supra-inventory-beta.apk)" >> "$GITHUB_ENV"

      - name: Upload beta-vc30 artifact
        uses: actions/upload-artifact@v4
        with:
          name: supra-inventory-beta-apk
          path: |
            android/dist/supra-inventory-beta.apk
            android/dist/supra-inventory-beta.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish beta-vc30 OTA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="beta-vc${APP_VERSION_CODE}"
          title="SUPRA Inventory Beta ${APP_VERSION_NAME}"
          notes="Concept 3 finish: polished Web HR/status/responsive UX and Android semantic status/pills/spacing. Business rules unchanged. Stable is not affected."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" android/dist/supra-inventory-beta.apk android/dist/supra-inventory-beta.apk.sha256 --clobber
          else
            gh release create "$tag" android/dist/supra-inventory-beta.apk android/dist/supra-inventory-beta.apk.sha256 --title "$title" --notes "$notes"
          fi
          gh release view "$tag" --json tagName,name,isDraft >/tmp/release.json
          jq -e '.tagName == "beta-vc30" and .isDraft == false' /tmp/release.json >/dev/null

      - name: Finalize Concept 3 finish canonical state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          p = Path('ops/project-state.json')
          state = json.loads(p.read_text(encoding='utf-8'))
          state['current_status']['web'] = 'CONCEPT3_FINISH_POLISH_BETA_DEPLOY_PASS'
          state['current_status']['android'] = 'CONCEPT3_FINISH_POLISH_SIGNED_OTA_BETA_PASS'
          state['current_status']['latest_beta_apk'] = 'beta-vc30'
          pending = 'Concept 3 finish polish: Web humanized HR/status/responsive + Android semantic status/pills/spacing — Beta verification pending'
          passed = 'Concept 3 finish polish: Web humanized HR source/status/responsive UX + Android semantic status badges/alerts/control spacing — Beta Web deploy and signed beta-vc30 PASS'
          state['completed_capabilities'] = [x for x in state['completed_capabilities'] if x != pending]
          if passed not in state['completed_capabilities']:
              state['completed_capabilities'].append(passed)
          state['next_action']['primary'] = 'Physical PDA field verification of role workflows/realtime/FCM, then Owner business acceptance and any Owner-reported UI adjustments. Stable remains gated.'
          p.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = Path('ops/resource-registry.json')
          registry = json.loads(p.read_text(encoding='utf-8'))
          beta = registry['environments']['beta']
          beta['web_source_status'] = 'CONCEPT3_FINISH_POLISH_DEPLOYED_PASS'
          beta['android_source_status'] = 'CONCEPT3_FINISH_POLISH_SIGNED_OTA_PASS'
          beta['latest_signed_beta_release'] = 'beta-vc30'
          beta['latest_signed_beta_release_name'] = 'SUPRA Inventory Beta 0.2.0-beta.30'
          beta['latest_signed_beta_apk_sha256'] = os.environ['SIGNED_SHA256']
          beta['latest_signed_beta_apk_size_bytes'] = int(os.environ['SIGNED_SIZE'])
          registry['ui_design']['web'] = 'CONCEPT3_FINISH_POLISH_DEPLOYED_PASS'
          registry['ui_design']['android'] = 'CONCEPT3_FINISH_POLISH_SIGNED_OTA_PASS'
          completed = registry['application_build_completed']
          if 'concept3_finish_web_android_polish' not in completed:
              completed.append('concept3_finish_web_android_polish')
          p.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python3 tools/project_state_guard.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-concept3-finish.yml tools/apply_concept3_finish.py
          git add web/src android/app/src/main/java/cd/cc/supra/inventory/beta/MainActivity.kt ops/project-state.json ops/resource-registry.json
          git commit -m "feat(ui): finish Concept 3 Web and Android Beta design"
          git push origin HEAD:main
