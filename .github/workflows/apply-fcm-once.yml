name: Apply FCM Foundation Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-fcm-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Tighten FCM patch semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_fcm_foundation.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '''function validId(value: string): boolean {\n  return /^[A-Za-z0-9._:-]{8,128}$/.test(value);\n}''',
              '''function validUserId(value: string): boolean {\n  return /^[A-Za-z0-9._:-]{1,128}$/.test(value);\n}\n\nfunction validDeviceId(value: string): boolean {\n  return /^[A-Za-z0-9._:-]{8,128}$/.test(value);\n}'''
          )
          s = s.replace('!validId(userId) || !validId(deviceId)', '!validUserId(userId) || !validDeviceId(deviceId)')
          s = s.replace('if (validId(userId)) users.add(userId);', 'if (validUserId(userId)) users.add(userId);')
          old = '''    replace_once(business,\n        \'''    return realtimeAfter(response, env, {\n      event: "report_withdrawn",\n      scopes: ["reporter_queue", "picker_reports"],\n      tags: [...REPORTER_TAGS, `user:${user.user_id}`],\n    });\''',\n        \'''    const result = await realtimeAfter(response, env, {\n      event: "report_withdrawn",\n      scopes: ["reporter_queue", "picker_reports"],\n      tags: [...REPORTER_TAGS, `user:${user.user_id}`],\n    });\n    scheduleFcm(result, env, ctx, {\n      event: "report_withdrawn",\n      target: { roles: REPORTER_ROLES },\n      title: "SUPRA Inventory · Báo đã thu hồi",\n      body: "Một báo hết hàng vừa được Picker thu hồi.",\n    });\n    return result;\''',\n        "business-withdraw-fcm")\n\n'''
          if old not in s:
              raise SystemExit('FCM_PATCH_FIX_FAIL withdraw block not found')
          s = s.replace(old, '')
          p.write_text(s, encoding='utf-8')
          print('FCM_PATCH_SEMANTICS_FIXED')
          PY
      - name: Apply FCM foundation
        run: |
          set -euo pipefail
          python3 tools/apply_fcm_foundation.py
          git diff --check
          python3 tools/project_state_guard.py
      - name: Typecheck service
        working-directory: service
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
      - name: Build Android debug verification
        env:
          FIREBASE_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Commit generated FCM source and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-fcm-once.yml
          git add service/src android/app/src/main android/app/build.gradle.kts ops/project-state.json ops/resource-registry.json tools/apply_fcm_foundation.py
          git commit -m "feat(notifications): add FCM device and background delivery"
          git push origin HEAD:main
