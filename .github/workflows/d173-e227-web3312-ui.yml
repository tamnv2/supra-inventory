name: D173 E227 Web3312 Eight UI Owner Scope CI
on:
  pull_request:
    paths:
      - 'web/src/operational-app.ts'
      - 'web/src/d173-tabler.css'
      - 'web/src/web-version.ts'
      - 'web/package.json'
      - 'tests/d173-e227-web3312-eight-ui.test.mjs'
      - 'tools/d173_e227_web3312_release_gate.py'
      - 'ops/d173-e227-web3312-release-authorization.json'
      - '.github/workflows/d173-e227-web3312-ui.yml'
      - '.github/workflows/deploy-beta.yml'
permissions:
  contents: read
jobs:
  ui-scope:
    if: contains(github.head_ref, 'd173-e227-web3312-eight-ui-fixes')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Eight owner UI regressions
        run: node --test tests/d173-e227-web3312-eight-ui.test.mjs
      - name: Web TypeScript and production assets
        working-directory: web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Install existing Worker test dependencies (read-only)
        working-directory: service
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: D172 independent regression (no Provider writes)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 tools/d173_isolation_guard.py --base "$BASE_SHA" --head HEAD
          node --test tests/d172-*.test.mjs
      - name: Exact Owner Web3.3.12 release preflight (read-only)
        run: python3 tools/d173_e227_web3312_release_gate.py --component web --preflight
      - name: Scope verified, release separately Owner-gated
        run: echo "D173_E227_WEB3312_SOURCE_PREFLIGHT_PASS__NO_PROVIDER_WRITES"
