name: Temp Repair Web Types

on:
  push:
    branches:
      - feat/legacy-operational-rebaseline-v1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/legacy-operational-rebaseline-v1
      - name: Repair TypeScript event target casts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/src/operational-app.ts')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('new FormData(event.currentTarget)', 'new FormData(event.currentTarget as HTMLFormElement)')
          s2 = s2.replace('markedResultEvents.add(row.result_event_id);', 'markedResultEvents.add(result.result_event_id);')
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          PY
          if git diff --quiet -- web/src/operational-app.ts; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/operational-app.ts
          git commit -m 'fix(web): satisfy strict TypeScript event typing'
          git push origin HEAD:feat/legacy-operational-rebaseline-v1
