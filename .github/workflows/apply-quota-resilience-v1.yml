name: Apply Quota Resilience V1 Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-quota-resilience-v1.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: beta
    env:
      APP_VERSION_CODE: "29"
      APP_VERSION_NAME: "0.2.0-beta.29"
      FIREBASE_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
      BETA_KEYSTORE_B64: ${{ secrets.BETA_KEYSTORE_B64 }}
      BETA_KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
      BETA_KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
      BETA_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Apply quota resilience patch
        run: |
          set -euo pipefail
          python3 tools/apply_quota_resilience_v1.py
          git diff --check
          python3 tools/quota_resilience_guard.py | tee /tmp/quota-resilience.json
          python3 tools/project_state_guard.py

      - name: Build Web regression
        working-directory: web
        env:
          VITE_API_BASE_URL: https://inventory-beta.supra.cc.cd
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
          VITE_FIREBASE_AUTH_DOMAIN: supra-inventory-beta.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: supra-inventory-beta
          VITE_FIREBASE_APP_ID: 1:572322098890:web:96459cf386b3fb6f400e33
          VITE_FIREBASE_MESSAGING_SENDER_ID: "572322098890"
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Typecheck service
        working-directory: service
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Compile Android delta cache debug gate
        run: |
          set -euo pipefail
          [ -n "${FIREBASE_API_KEY_BETA:-}" ] || { echo "Missing Firebase Beta API key"; exit 1; }
          gradle -p android :app:assembleDebug --no-daemon

      - name: Deploy schema v5 quota resilience to Beta
        working-directory: service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_INVENTORY_BETA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
        run: npx --yes wrangler@4 deploy --config wrangler.beta.toml --keep-vars --var "FIREBASE_WEB_API_KEY:${FIREBASE_WEB_API_KEY}"

      - name: Smoke schema v5 and protected read routes
        env:
          BETA_HOSTNAME: ${{ vars.BETA_HOSTNAME }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          for attempt in $(seq 1 18); do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp" -w '%{http_code}' "https://${BETA_HOSTNAME}/health" || true)"
            status="$(jq -r '.status // empty' "$tmp" 2>/dev/null || true)"
            schema="$(jq -r '.storage.schema_version // 0' "$tmp" 2>/dev/null || true)"
            expected="$(jq -r '.storage.expected_schema_version // 0' "$tmp" 2>/dev/null || true)"
            [ "$code" = "200" ] && [ "$status" = "ok" ] && [ "$schema" = "5" ] && [ "$expected" = "5" ] && break
            [ "$attempt" -ge 18 ] || sleep 5
          done
          [ "$code" = "200" ] && [ "$status" = "ok" ] && [ "$schema" = "5" ] && [ "$expected" = "5" ] || { echo "Schema v5 health failed"; cat "$tmp"; exit 1; }

          check_guard() {
            path="$1"
            code="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp" -w '%{http_code}' "https://${BETA_HOSTNAME}${path}" || true)"
            error="$(jq -r '.error // empty' "$tmp" 2>/dev/null || true)"
            [ "$code" = "401" ] && [ "$error" = "AUTH_REQUIRED" ] || { echo "Auth guard failed ${path}: HTTP ${code}"; cat "$tmp"; exit 1; }
          }
          check_guard "/api/skus/catalog-delta?since=2026-09-01T00%3A00%3A00.000Z&after_updated_at=2026-09-01T00%3A00%3A00.000Z&after_sku=&limit=10"
          check_guard "/api/admin/dashboard?from=2026-09-10T17%3A00%3A00.000Z&to=2026-09-17T17%3A00%3A00.000Z"
          check_guard "/api/admin/reporting?from=2026-09-10T17%3A00%3A00.000Z&to=2026-09-17T17%3A00%3A00.000Z&limit=100&offset=0"
          echo "Schema v5 + auth guards PASS"

      - name: Non-destructive health burst
        env:
          BETA_HOSTNAME: ${{ vars.BETA_HOSTNAME }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, json, os, statistics, subprocess, time
          host = os.environ['BETA_HOSTNAME']
          url = f'https://{host}/health'

          def once(_):
              last = None
              for attempt in range(3):
                  start = time.perf_counter()
                  proc = subprocess.run(
                      [
                          'curl', '-sS', '--connect-timeout', '5', '--max-time', '15',
                          '-A', 'SUPRA-Inventory-CI/1.0', '-w', '\n%{http_code}', url,
                      ],
                      capture_output=True,
                      text=True,
                  )
                  latency = (time.perf_counter() - start) * 1000
                  raw, _, code_text = proc.stdout.rpartition('\n')
                  try:
                      code = int(code_text.strip())
                  except ValueError:
                      code = 0
                  try:
                      payload = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      payload = {}
                  ok = (
                      proc.returncode == 0
                      and code == 200
                      and payload.get('status') == 'ok'
                      and payload.get('storage', {}).get('schema_version') == 5
                  )
                  last = (ok, latency, code, attempt)
                  if ok:
                      return last
                  time.sleep(0.15 * (2 ** attempt))
              return last

          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              rows = list(pool.map(once, range(50)))
          if not all(x and x[0] for x in rows):
              print(rows)
              raise SystemExit('Non-destructive burst returned an error or wrong schema after bounded retries')
          lat = sorted(x[1] for x in rows)
          p50 = statistics.median(lat)
          p95 = lat[max(0, int(len(lat) * 0.95) - 1)]
          retries = sum(x[3] for x in rows)
          receipt = {
              'requests': len(rows),
              'concurrency': 10,
              'errors': 0,
              'bounded_retries_used': retries,
              'p50_ms': round(p50, 1),
              'p95_ms': round(p95, 1),
              'max_ms': round(max(lat), 1),
              'note': 'measurement only; Cloudflare-safe CI user-agent and bounded retry; no latency SLO claimed',
          }
          print(json.dumps(receipt, indent=2))
          open('/tmp/read-burst.json', 'w').write(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Verify signing configuration
        run: |
          set -euo pipefail
          for name in BETA_KEYSTORE_B64 BETA_KEYSTORE_PASSWORD BETA_KEY_ALIAS BETA_KEY_PASSWORD; do
            [ -n "${!name:-}" ] || { echo "Missing ${name}"; exit 1; }
          done
          key_path="$RUNNER_TEMP/supra-inventory-beta.jks"
          printf '%s' "$BETA_KEYSTORE_B64" | base64 --decode > "$key_path"
          keytool -list -keystore "$key_path" -storepass "$BETA_KEYSTORE_PASSWORD" -alias "$BETA_KEY_ALIAS" >/dev/null
          echo "BETA_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build signed beta-vc29
        run: |
          set -euo pipefail
          rm -rf android/dist
          mkdir -p android/dist
          gradle -p android :app:assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk android/dist/supra-inventory-beta.apk
          sha256sum android/dist/supra-inventory-beta.apk > android/dist/supra-inventory-beta.apk.sha256
          test -s android/dist/supra-inventory-beta.apk
          keytool -printcert -jarfile android/dist/supra-inventory-beta.apk >/dev/null
          echo "SIGNED_SHA256=$(cut -d' ' -f1 android/dist/supra-inventory-beta.apk.sha256)" >> "$GITHUB_ENV"
          echo "SIGNED_SIZE=$(stat -c%s android/dist/supra-inventory-beta.apk)" >> "$GITHUB_ENV"

      - name: Upload beta-vc29 artifact
        uses: actions/upload-artifact@v4
        with:
          name: supra-inventory-beta-apk
          path: |
            android/dist/supra-inventory-beta.apk
            android/dist/supra-inventory-beta.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish beta-vc29 OTA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="beta-vc${APP_VERSION_CODE}"
          title="SUPRA Inventory Beta ${APP_VERSION_NAME}"
          notes="Quota/resilience v1: schema v5 reporting indexes, materialized catalog metadata, delta-first PDA SKU sync. Concept 3 role workflows retained. Stable is not affected."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" android/dist/supra-inventory-beta.apk android/dist/supra-inventory-beta.apk.sha256 --clobber
          else
            gh release create "$tag" android/dist/supra-inventory-beta.apk android/dist/supra-inventory-beta.apk.sha256 --title "$title" --notes "$notes"
          fi
          gh release view "$tag" --json tagName,name,isDraft >/tmp/release.json
          jq -e '.tagName == "beta-vc29" and .isDraft == false' /tmp/release.json >/dev/null

      - name: Finalize quota resilience state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('ops/project-state.json')
          state = json.loads(p.read_text(encoding='utf-8'))
          state['current_status']['sqlite_schema'] = 5
          state['current_status']['business_api'] = 'IMPLEMENTED_AND_DEPLOYED_BETA_SCHEMA_V5'
          state['current_status']['android'] = 'CONCEPT3_ROLE_UI_DELTA_CATALOG_SIGNED_OTA_BETA_PASS'
          state['current_status']['latest_beta_apk'] = 'beta-vc29'
          state['current_status']['quota_resilience'] = 'INDEXED_REPORTING_DELTA_CATALOG_NONDESTRUCTIVE_BURST_PASS'
          pending = 'Quota/resilience optimization: materialized catalog metadata + delta-first PDA catalog sync + reporting timestamp indexes — Beta verification pending'
          passed = 'Quota/resilience v1: schema v5 materialized catalog metadata + delta-first PDA sync + reporting timestamp indexes + 50-request non-destructive Beta health burst — PASS'
          state['completed_capabilities'] = [x for x in state['completed_capabilities'] if x != pending]
          if passed not in state['completed_capabilities']: state['completed_capabilities'].append(passed)
          state['pending_build'] = [x for x in state['pending_build'] if x != 'Load/resilience/quota testing']
          if 'Isolated business-mutation load acceptance after Owner scale target is defined' not in state['pending_build']:
              state['pending_build'].append('Isolated business-mutation load acceptance after Owner scale target is defined')
          state['next_action']['primary'] = 'Field-verify physical PDA realtime/FCM and business flows, define Owner workload target for isolated mutation load acceptance, then Owner business acceptance.'
          p.write_text(json.dumps(state, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          p = Path('ops/resource-registry.json')
          registry = json.loads(p.read_text(encoding='utf-8'))
          registry['cloudflare']['beta_sqlite_schema_version'] = 5
          beta = registry['environments']['beta']
          beta['sqlite_schema_version'] = 5
          beta['business_api_status'] = 'IMPLEMENTED_DEPLOYED_SCHEMA_V5'
          beta['android_source_status'] = 'CONCEPT3_ROLE_UI_DELTA_CATALOG_SIGNED_OTA_PASS'
          beta['latest_signed_beta_release'] = 'beta-vc29'
          beta['latest_signed_beta_release_name'] = 'SUPRA Inventory Beta 0.2.0-beta.29'
          beta['latest_signed_beta_apk_sha256'] = os.environ['SIGNED_SHA256']
          beta['latest_signed_beta_apk_size_bytes'] = int(os.environ['SIGNED_SIZE'])
          registry['environments']['stable']['sqlite_schema_version_source'] = 5
          qr = registry.setdefault('quota_resilience', {})
          qr['catalog_sync'] = 'DELTA_FIRST_FULL_BOOTSTRAP_FALLBACK_ONLY_BETA_PASS'
          qr['reporting'] = 'BOUNDED_60D_INDEXED_TIME_RANGE_BETA_PASS'
          qr['source_status'] = 'BETA_SCHEMA_V5_BUILD_DEPLOY_BURST_PASS'
          qr['non_destructive_burst'] = json.loads(Path('/tmp/read-burst.json').read_text())
          completed = registry['application_build_completed']
          if 'quota_resilience_v1_delta_catalog_indexed_reporting' not in completed: completed.append('quota_resilience_v1_delta_catalog_indexed_reporting')
          registry['application_build_pending'] = [x for x in registry['application_build_pending'] if x != 'load_and_resilience_tests']
          if 'isolated_business_mutation_load_acceptance_after_owner_scale_target' not in registry['application_build_pending']:
              registry['application_build_pending'].append('isolated_business_mutation_load_acceptance_after_owner_scale_target')
          p.write_text(json.dumps(registry, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          python3 tools/quota_resilience_guard.py
          python3 tools/project_state_guard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-quota-resilience-v1.yml tools/apply_quota_resilience_v1.py
          git add service/src android/app/src/main/java/cd/cc/supra/inventory/beta docs/QUOTA_RESILIENCE.md docs/OWNER_DECISIONS.md tools/quota_resilience_guard.py ops/project-state.json ops/resource-registry.json
          git commit -m "feat(quota): deploy delta catalog and indexed reporting schema v5"
          git push origin HEAD:main
