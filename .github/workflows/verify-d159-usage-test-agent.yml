name: Verify D159 Usage Test Agent

on:
  pull_request:
    paths:
      - "usage-test-agent/**"
      - "ops/apps-script/firestore-usage-gateway-d159/**"
      - ".github/workflows/verify-d159-usage-test-agent.yml"
      - "ops/project-state.json"
      - "ops/project-scope.json"
      - "ops/resource-registry.json"
      - "ops/owner-actions.json"
      - "docs/OWNER_DECISIONS.md"
      - "docs/specs/AUTH_RBAC.md"
      - "docs/specs/UI_DESIGN_SYSTEM.md"
      - "docs/specs/ACCEPTANCE_TESTING.md"
  push:
    branches: [main]
    paths:
      - "usage-test-agent/**"
      - "ops/apps-script/firestore-usage-gateway-d159/**"
      - ".github/workflows/verify-d159-usage-test-agent.yml"
      - "ops/project-state.json"
      - "ops/project-scope.json"
      - "ops/resource-registry.json"
      - "ops/owner-actions.json"
      - "docs/OWNER_DECISIONS.md"
      - "docs/specs/AUTH_RBAC.md"
      - "docs/specs/UI_DESIGN_SYSTEM.md"
      - "docs/specs/ACCEPTANCE_TESTING.md"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  d159-usage-test:
    runs-on: windows-latest
    environment: beta
    env:
      FIREBASE_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
      D159_USAGE_GATEWAY_URL_BETA: ${{ vars.D159_USAGE_GATEWAY_URL_BETA }}
      FIREBASE_RULES_SA_JSON_BETA: ${{ secrets.FIREBASE_RULES_SA_JSON_BETA }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect D159 release payload changes
        id: release_scope
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publish = "false"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $publish = "true"
          } elseif ("${{ github.event_name }}" -eq "push") {
            $before = "${{ github.event.before }}"
            $head = "${{ github.sha }}"
            $zero = "0000000000000000000000000000000000000000"

            if ([string]::IsNullOrWhiteSpace($before) -or $before -eq $zero) {
              $files = git show --pretty="" --name-only $head
            } else {
              git fetch --no-tags --depth=1 origin $before | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Unable to fetch D159 push base $before." }
              $files = git diff --name-only $before $head
              if ($LASTEXITCODE -ne 0) { throw "Unable to diff D159 release payload." }
            }

            foreach ($file in $files) {
              if ($file -like "usage-test-agent/*" -or
                  $file -like "ops/apps-script/firestore-usage-gateway-d159/*") {
                $publish = "true"
                break
              }
            }
          }

          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "D159 release payload changed=$publish"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: D159 isolation and security guard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $program = ((Get-ChildItem usage-test-agent -Filter "*.cs" | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n")
          $config = Get-Content usage-test-agent/UsageTestConfig.cs -Raw
          $script = Get-Content ops/apps-script/firestore-usage-gateway-d159/Code.gs -Raw
          $manifest = Get-Content ops/apps-script/firestore-usage-gateway-d159/appsscript.json -Raw

          foreach ($marker in @(
            'session.bin',
            'ProtectedData.Unprotect',
            'get_firestore_usage',
            'RefreshMinutes = 15',
            'SUPRA Firebase Usage Test',
            'D159-v3',
            'Thông tin Usage',
            'Chỉ tamnv2 / admin khi tích hợp Agent',
            'D159_GATEWAY_NOT_CONFIGURED',
            'QuotaTextV3',
            'ByteQuotaText',
            'firebase_24h',
            'functions_24h',
            'rulesAvailable ? Number',
            ': "N/A"',
            'BuildProviderFailureStatus',
            'Dữ liệu N/A không được coi là 0.'
          )) {
            if (-not $program.Contains($marker) -and -not $config.Contains($marker)) {
              throw "D159 Windows isolation marker missing: $marker"
            }
          }

          foreach ($forbidden in @(
            'signInWithPassword',
            'ProtectedData.Protect',
            'SaveStoredSession',
            'confirmSkipItem',
            'wms-supra.winmart.vn',
            'relay_poc_jobs',
            'firestore.googleapis.com/v1/projects'
          )) {
            if ($program.Contains($forbidden)) {
              throw "D159 standalone EXE must not own login/business/Firestore/WMS mutation path: $forbidden"
            }
          }

          foreach ($marker in @(
            'firestore.googleapis.com/document/read_ops_count',
            'firestore.googleapis.com/document/write_ops_count',
            'firestore.googleapis.com/document/delete_ops_count',
            'firestore.googleapis.com/network/active_connections',
            'firestore.googleapis.com/network/snapshot_listeners',
            'firestore.googleapis.com/rules/evaluation_count',
            'firestore.googleapis.com/storage/data_and_index_storage_bytes',
            'serviceruntime.googleapis.com/api/request_count',
            'run.googleapis.com/request_count',
            'run.googleapis.com/container/instance_count',
            'run.googleapis.com/container/billable_instance_time',
            "fcm.googleapis.com",
            "identitytoolkit.googleapis.com",
            "securetoken.googleapis.com",
            "inventory-beta-picker-alerts",
            'CACHE_TTL_SECONDS = 15 * 60',
            'ROLE_ALLOWLIST',
            'ADMIN',
            'PICKPACK_ADMIN',
            'monitoring.googleapis.com/v3/projects/',
            'CacheService.getScriptCache',
            'LockService.getScriptLock',
            'availability: {',
            'reads: !results.reads.error',
            'rules: !results.rules.error',
            'monitoringFailureCode_',
            'MONITORING_HTTP_',
            "'X-Goog-User-Project': PROJECT_ID",
            "D159_FIREBASE_USAGE_V4_MULTI_SERVICE",
            "D159-GW-v4",
            "MISSING_MONITORING_TIMESERIES_LIST"
          )) {
            if (-not $script.Contains($marker)) {
              throw "D159 Apps Script monitoring guard missing: $marker"
            }
          }

          foreach ($forbidden in @(
            'DriveApp',
            'SpreadsheetApp',
            'firestore.googleapis.com/v1/',
            'UrlFetchApp.fetch("https://inventory-beta',
            'AGENT_LOG_GATEWAY_URL_BETA',
            'upload_agent_log'
          )) {
            if ($script.Contains($forbidden)) {
              throw "D159 usage gateway must remain isolated/read-only: $forbidden"
            }
          }

          if (-not $manifest.Contains('https://www.googleapis.com/auth/monitoring.read')) {
            throw "D159 Apps Script must request monitoring.read only for provider telemetry."
          }
          if ($manifest.Contains('https://www.googleapis.com/auth/drive')) {
            throw "D159 Apps Script must not request Drive scope."
          }

      - name: Syntax-check D159 Apps Script
        shell: pwsh
        run: |
          Copy-Item ops/apps-script/firestore-usage-gateway-d159/Code.gs "$env:RUNNER_TEMP\d159-code.js"
          node --check "$env:RUNNER_TEMP\d159-code.js"

      - name: Authenticate Google Cloud for D159 provider canary
        if: env.FIREBASE_RULES_SA_JSON_BETA != ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_RULES_SA_JSON_BETA }}

      - name: Set up gcloud for D159 provider canary
        if: env.FIREBASE_RULES_SA_JSON_BETA != ''
        uses: google-github-actions/setup-gcloud@v3

      - name: Diagnose D159 Monitoring API and IAM
        if: env.FIREBASE_RULES_SA_JSON_BETA != ''
        shell: bash
        run: |
          set -euo pipefail
          project="supra-inventory-beta"
          token="$(gcloud auth print-access-token)"

          enabled="$(gcloud services list --enabled --project="$project" --filter='config.name=monitoring.googleapis.com' --format='value(config.name)' 2>/dev/null || true)"
          if [ "$enabled" = "monitoring.googleapis.com" ]; then
            echo "D159_DIAG_MONITORING_API=ENABLED"
          else
            echo "D159_DIAG_MONITORING_API=NOT_CONFIRMED"
          fi

          tmp_perm="$(mktemp)"
          trap 'rm -f "$tmp_perm"' EXIT
          perm_code="$(curl -sS -o "$tmp_perm" -w '%{http_code}' -X POST             -H "Authorization: Bearer $token"             -H "X-Goog-User-Project: $project"             -H "Content-Type: application/json"             --data '{"permissions":["monitoring.timeSeries.list","serviceusage.services.use"]}'             "https://cloudresourcemanager.googleapis.com/v1/projects/$project:testIamPermissions")"
          if [ "$perm_code" = "200" ]; then
            has_monitoring="$(jq -r '(.permissions // []) | index("monitoring.timeSeries.list") != null' "$tmp_perm")"
            has_serviceuse="$(jq -r '(.permissions // []) | index("serviceusage.services.use") != null' "$tmp_perm")"
            echo "D159_DIAG_MONITORING_PERMISSION=$has_monitoring"
            echo "D159_DIAG_SERVICEUSAGE_PERMISSION=$has_serviceuse"
          else
            echo "D159_DIAG_IAM_TEST=HTTP_$perm_code"
          fi

      - name: Prove D159 Cloud Monitoring query against Beta
        if: env.FIREBASE_RULES_SA_JSON_BETA != ''
        shell: bash
        run: |
          set -euo pipefail
          project="supra-inventory-beta"
          token="$(gcloud auth print-access-token)"
          end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          start="$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -G             -H "Authorization: Bearer $token"             -H "X-Goog-User-Project: $project"             --data-urlencode 'filter=metric.type="firestore.googleapis.com/document/read_ops_count" AND resource.type="firestore.googleapis.com/Database" AND resource.labels.database_id="(default)"'             --data-urlencode "interval.startTime=$start"             --data-urlencode "interval.endTime=$end"             --data-urlencode 'view=FULL'             --data-urlencode 'pageSize=5'             "https://monitoring.googleapis.com/v3/projects/$project/timeSeries")"
          if [ "$code" != "200" ]; then
            status="$(jq -r '.error.status // "UNKNOWN_STATUS"' "$tmp" 2>/dev/null || echo UNKNOWN_STATUS)"
            reason="$(jq -r '[.error.details[]?.reason // empty][0] // ""' "$tmp" 2>/dev/null || true)"
            message="$(jq -r '.error.message // ""' "$tmp" 2>/dev/null || true)"
            upper="$(printf '%s' "$message" | tr '[:lower:]' '[:upper:]')"
            category="PERMISSION_OR_PROVIDER_UNKNOWN"
            if [[ "$upper" == *"MONITORING.TIMESERIES.LIST"* ]]; then category="MISSING_MONITORING_TIMESERIES_LIST"
            elif [[ "$upper" == *"SERVICEUSAGE.SERVICES.USE"* ]]; then category="MISSING_SERVICEUSAGE_SERVICES_USE"
            elif [[ "$upper" == *"INSUFFICIENT AUTHENTICATION SCOPES"* ]]; then category="OAUTH_SCOPE_INSUFFICIENT"
            elif [[ "$upper" == *"API HAS NOT BEEN USED"* || "$upper" == *"API IS DISABLED"* || "$upper" == *"SERVICE_DISABLED"* ]]; then category="MONITORING_API_DISABLED"
            elif [[ "$upper" == *"QUOTA PROJECT"* ]]; then category="QUOTA_PROJECT_REQUIRED"
            fi
            echo "D159 provider canary failed HTTP $code status=$status reason=${reason:-NONE} category=$category"
            exit 1
          fi
          jq -e 'has("timeSeries") or . == {} or (.timeSeries | type == "array")' "$tmp" >/dev/null
          echo "D159 Cloud Monitoring provider canary PASS"

      - name: Prove D159 v3 Firebase metric families
        if: env.FIREBASE_RULES_SA_JSON_BETA != ''
        shell: bash
        run: |
          set -euo pipefail
          project="supra-inventory-beta"
          token="$(gcloud auth print-access-token)"
          end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          start="$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"

          probe() {
            local name="$1"
            local filter="$2"
            local tmp
            tmp="$(mktemp)"
            local code
            code="$(curl -sS -o "$tmp" -w '%{http_code}' -G               -H "Authorization: Bearer $token"               -H "X-Goog-User-Project: $project"               --data-urlencode "filter=$filter"               --data-urlencode "interval.startTime=$start"               --data-urlencode "interval.endTime=$end"               --data-urlencode 'view=FULL'               --data-urlencode 'pageSize=5'               "https://monitoring.googleapis.com/v3/projects/$project/timeSeries")"
            if [ "$code" != "200" ]; then
              status="$(jq -r '.error.status // "UNKNOWN_STATUS"' "$tmp" 2>/dev/null || echo UNKNOWN_STATUS)"
              echo "D159 v3 metric probe failed name=$name HTTP=$code status=$status"
              rm -f "$tmp"
              exit 1
            fi
            rm -f "$tmp"
            echo "D159 v3 metric probe PASS name=$name"
          }

          probe "firestore-storage" 'metric.type="firestore.googleapis.com/storage/data_and_index_storage_bytes" AND resource.type="firestore.googleapis.com/Database" AND resource.labels.database_id="(default)"'
          probe "fcm-api" 'metric.type="serviceruntime.googleapis.com/api/request_count" AND resource.type="consumed_api" AND resource.labels.service="fcm.googleapis.com"'
          probe "identity-toolkit-api" 'metric.type="serviceruntime.googleapis.com/api/request_count" AND resource.type="consumed_api" AND resource.labels.service="identitytoolkit.googleapis.com"'
          probe "secure-token-api" 'metric.type="serviceruntime.googleapis.com/api/request_count" AND resource.type="consumed_api" AND resource.labels.service="securetoken.googleapis.com"'
          probe "picker-alert-function" 'metric.type="run.googleapis.com/request_count" AND resource.type="cloud_run_revision" AND resource.labels.service_name="inventory-beta-picker-alerts"'

      - name: Inject bounded Beta build configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $apiKey = "${env:FIREBASE_API_KEY_BETA}".Trim()
          $gateway = "${env:D159_USAGE_GATEWAY_URL_BETA}".Trim()
          $configured = "false"

          if ([string]::IsNullOrWhiteSpace($apiKey)) {
            $apiKey = "d159-ci-placeholder-key"
          }
          if ([string]::IsNullOrWhiteSpace($gateway)) {
            $gateway = "https://script.google.com/macros/s/d159-ci-placeholder/exec"
          } else {
            if ($gateway -notmatch '^https://script\.google\.com/macros/s/.+/exec$') {
              throw "D159_USAGE_GATEWAY_URL_BETA must be an Apps Script /exec URL."
            }
            if ([string]::IsNullOrWhiteSpace("${env:FIREBASE_API_KEY_BETA}")) {
              throw "Configured D159 build requires FIREBASE_WEB_API_KEY_BETA."
            }
            $configured = "true"
          }

          $path = "usage-test-agent/UsageTestConfig.cs"
          $content = Get-Content $path -Raw
          $content = $content.Replace("__FIREBASE_API_KEY_BETA__", $apiKey)
          $content = $content.Replace("__D159_USAGE_GATEWAY_URL_BETA__", $gateway)
          Set-Content $path $content -Encoding UTF8

          "D159_CONFIGURED=$configured" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Probe configured D159 gateway identity
        if: env.D159_CONFIGURED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "${env:D159_USAGE_GATEWAY_URL_BETA}".Trim()
          $passed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              $response = Invoke-RestMethod -Uri $url -Method Get -TimeoutSec 20
              if ($response.ok -eq $true -and
                  $response.service -eq "SUPRA_FIRESTORE_USAGE_GATEWAY_D159" -and
                  $response.project -eq "supra-inventory-beta" -and
                  $response.revision -eq "D159-GW-v4") {
                $passed = $true
                break
              }
            } catch {
              if ($attempt -ge 3) { throw }
              Start-Sleep -Seconds (2 * $attempt)
            }
          }
          if (-not $passed) { throw "Configured D159 gateway identity probe failed." }

      - name: Build D159 standalone EXE
        shell: pwsh
        run: |
          dotnet build usage-test-agent/SupraFirestoreUsageTest.csproj -c Release -o usage-test-agent/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run D159 parser self-test
        shell: pwsh
        run: |
          $exe = Get-ChildItem usage-test-agent/dist -Filter "SUPRA Firebase Usage Test.exe" | Select-Object -First 1
          if ($null -eq $exe) { throw "D159 EXE missing." }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "D159 self-test failed with exit code $($process.ExitCode)." }

      - name: Verify D159 standalone output
        shell: pwsh
        run: |
          $exe = Get-ChildItem usage-test-agent/dist -Filter "SUPRA Firebase Usage Test.exe" | Select-Object -First 1
          if ($null -eq $exe) { throw "D159 EXE missing." }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content "usage-test-agent/dist/SUPRA.Firebase.Usage.Test.exe.sha256" -Encoding ASCII
          Write-Host "D159 configured=$env:D159_CONFIGURED size=$($exe.Length) sha256=$hash"

      - uses: actions/upload-artifact@v4
        with:
          name: d159-firestore-usage-test-${{ github.sha }}
          path: |
            usage-test-agent/dist/SUPRA Firebase Usage Test.exe
            usage-test-agent/dist/SUPRA.Firebase.Usage.Test.exe.sha256
          if-no-files-found: error

      - name: Publish configured D159 field-test prerelease
        if: github.event_name != 'pull_request' && env.D159_CONFIGURED == 'true' && steps.release_scope.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "d159-usage-test-v3"
          $exe = "usage-test-agent/dist/SUPRA Firebase Usage Test.exe"
          $sha = "usage-test-agent/dist/SUPRA.Firebase.Usage.Test.exe.sha256"
          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag $exe $sha --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $exe $sha --prerelease --target "${{ github.sha }}" --title "D159 Firebase Usage Test v3" --notes "Isolated Beta D159-v3 field-test utility with Firestore, Firebase Auth, FCM and Cloud Functions provider metrics. No login UI, no WMS, no Firestore business operations, no D158 Agent v94 mutation. Requires an existing local Agent DPAPI session and the separate D159 Apps Script Usage Gateway."
          }
