name: D173 E260 Web UI Layout Code Only
on:
  pull_request:
    paths:
      - 'web/src/operational-app.ts'
      - 'web/src/d173-tabler.css'
      - 'web/src/d173-overview.css'
      - 'tests/d173-e260-web-ui-layout.test.mjs'
      - 'tests/d173-e252-web3318-overview.test.mjs'
      - '.github/workflows/d173-e260-web-ui-code-only.yml'
      - 'ops/change-continuity/D173.json'
      - 'ops/project-state.json'
permissions:
  contents: read
jobs:
  source-and-isolation:
    if: contains(github.head_ref, 'd173-e260-web3319-header-density-zoom')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Owner E260 and existing Web UI regression
        run: |
          node --test tests/d173-e260-web-ui-layout.test.mjs \\
            tests/d173-e252-web3318-overview.test.mjs \\
            tests/d173-e247-web3317-contractors-roster.test.mjs \\
            tests/d173-e242-web3316-ui-consistency.test.mjs \\
            tests/d173-e237-web3315-global-layout.test.mjs \\
            tests/d173-e233-web3314-cache-scroll.test.mjs \\
            tests/d173-e230-web3313-field-density.test.mjs \\
            tests/d173-e227-web3312-eight-ui.test.mjs
      - name: Web TypeScript and Vite build
        working-directory: web
        run: npm install --ignore-scripts --no-audit --no-fund && npm run build
      - name: D172 independence and cross-module isolation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 tools/d173_isolation_guard.py --base "$BASE_SHA" --head HEAD
          node --test tests/d172-*.test.mjs
      - name: Code only, never deploy
        run: echo "D173_E260_WEB_UI_CODE_ONLY__NO_PRODUCTION_MUTATION__D172_HOLD"
