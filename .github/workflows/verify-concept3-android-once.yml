name: Verify Concept 3 Android Signed Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-concept3-android-once.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: beta
    env:
      APP_VERSION_CODE: "28"
      APP_VERSION_NAME: "0.2.0-beta.28"
      BETA_KEYSTORE_B64: ${{ secrets.BETA_KEYSTORE_B64 }}
      BETA_KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
      BETA_KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
      BETA_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
      FIREBASE_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify signing and Firebase configuration
        run: |
          set -euo pipefail
          [ -n "${FIREBASE_API_KEY_BETA:-}" ] || { echo "Missing Firebase Beta API key"; exit 1; }
          for name in BETA_KEYSTORE_B64 BETA_KEYSTORE_PASSWORD BETA_KEY_ALIAS BETA_KEY_PASSWORD; do
            [ -n "${!name:-}" ] || { echo "Missing ${name}"; exit 1; }
          done
          key_path="$RUNNER_TEMP/supra-inventory-beta.jks"
          printf '%s' "$BETA_KEYSTORE_B64" | base64 --decode > "$key_path"
          keytool -list -keystore "$key_path" -storepass "$BETA_KEYSTORE_PASSWORD" -alias "$BETA_KEY_ALIAS" >/dev/null
          echo "BETA_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          echo "Fixed Beta signing key PASS"

      - name: Build signed Concept 3 APK
        run: |
          set -euo pipefail
          rm -rf android/dist
          mkdir -p android/dist
          gradle -p android :app:assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk android/dist/supra-inventory-beta.apk
          sha256sum android/dist/supra-inventory-beta.apk > android/dist/supra-inventory-beta.apk.sha256
          test -s android/dist/supra-inventory-beta.apk
          keytool -printcert -jarfile android/dist/supra-inventory-beta.apk >/dev/null
          echo "SIGNED_SHA256=$(cut -d' ' -f1 android/dist/supra-inventory-beta.apk.sha256)" >> "$GITHUB_ENV"
          echo "SIGNED_SIZE=$(stat -c%s android/dist/supra-inventory-beta.apk)" >> "$GITHUB_ENV"
          echo "Signed Concept 3 APK PASS"

      - name: Publish Beta APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: supra-inventory-beta-apk
          path: |
            android/dist/supra-inventory-beta.apk
            android/dist/supra-inventory-beta.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish beta-vc28 OTA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="beta-vc${APP_VERSION_CODE}"
          title="SUPRA Inventory Beta ${APP_VERSION_NAME}"
          notes="Concept 3 unified Android/PDA UI. Picker/Reporter business rules unchanged. Stable is not affected."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" android/dist/supra-inventory-beta.apk android/dist/supra-inventory-beta.apk.sha256 --clobber
          else
            gh release create "$tag" android/dist/supra-inventory-beta.apk android/dist/supra-inventory-beta.apk.sha256 --title "$title" --notes "$notes"
          fi
          gh release view "$tag" --json tagName,name,isDraft,isPrerelease >/tmp/release.json
          jq -e '.tagName == "beta-vc28" and .isDraft == false' /tmp/release.json >/dev/null
          echo "Published signed Beta release $tag"

      - name: Finalize canonical Android state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          state_path = Path('ops/project-state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['current_status']['android'] = 'CONCEPT3_ROLE_UI_SIGNED_OTA_BETA_PASS'
          state['current_status']['latest_beta_apk'] = 'beta-vc28'
          pending_line = 'Android/PDA Concept 3 visual refactor preserving Picker/Reporter role workflows — source patched, signed Beta CI pending'
          pass_line = 'Android/PDA Concept 3 visual refactor preserving Picker/Reporter role workflows — signed Beta beta-vc28 build/release PASS'
          state['completed_capabilities'] = [x for x in state['completed_capabilities'] if x != pending_line]
          if pass_line not in state['completed_capabilities']:
              state['completed_capabilities'].append(pass_line)
          state['next_action']['primary'] = 'Run load/resilience/quota testing, field-verify realtime/FCM on physical PDA, then Owner business acceptance.'
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          registry_path = Path('ops/resource-registry.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          beta = registry['environments']['beta']
          beta['android_source_status'] = 'CONCEPT3_ROLE_UI_SIGNED_OTA_PASS'
          beta['latest_signed_beta_release'] = 'beta-vc28'
          beta['latest_signed_beta_release_name'] = 'SUPRA Inventory Beta 0.2.0-beta.28'
          beta['latest_signed_beta_apk_sha256'] = os.environ['SIGNED_SHA256']
          beta['latest_signed_beta_apk_size_bytes'] = int(os.environ['SIGNED_SIZE'])
          registry.setdefault('ui_design', {})['android'] = 'LIGHT_GREEN_OPERATIONAL_SIGNED_OTA_PASS'
          completed = registry['application_build_completed']
          if 'android_concept3_unified_ui' not in completed:
              completed.append('android_concept3_unified_ui')
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python3 tools/project_state_guard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-concept3-android-once.yml
          git add ops/project-state.json ops/resource-registry.json
          git commit -m "chore(state): mark Concept 3 Android signed Beta PASS"
          git push origin HEAD:main
