name: Apply Android vc33 Native UI

on:
  push:
    branches: [fix/android-vc33-native-ui-update-gate]
    paths:
      - "tools/apply_android_vc33_native_ui.py"
      - ".github/workflows/apply-android-vc33-native-ui.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-vc33-native-ui-update-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply native Android UI codemod
        run: python3 tools/apply_android_vc33_native_ui.py
      - name: Validate canonical guards
        run: |
          set -euo pipefail
          python3 -m json.tool ops/project-state.json >/dev/null
          python3 tools/project_state_guard.py
          python3 tools/authority_guard.py
          python3 tools/ui_design_guard.py
      - name: Commit generated source and remove temporary automation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/AndroidManifest.xml \
                  android/app/src/main/java/cd/cc/supra/inventory/beta/MainActivity.kt \
                  tools/ui_design_guard.py \
                  docs/OWNER_DECISIONS.md \
                  docs/specs/UI_DESIGN_SYSTEM.md \
                  ops/project-state.json
          git add -u android/app/src/main/java/cd/cc/supra/inventory/beta/InventoryApplication.kt
          git rm tools/apply_android_vc33_native_ui.py .github/workflows/apply-android-vc33-native-ui.yml
          git commit -m "fix(android): render native narrow UI and fail-closed update gate"
          git push origin HEAD:fix/android-vc33-native-ui-update-gate
