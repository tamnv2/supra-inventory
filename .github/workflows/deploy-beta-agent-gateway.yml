name: Deploy Beta Agent Operations Gateway

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-beta-agent-gateway.yml"
      - "ops/apps-script/agent-log-gateway/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-beta-agent-gateway.yml"
      - "ops/apps-script/agent-log-gateway/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-agent-operations-gateway-deploy
  cancel-in-progress: false

jobs:
  source-check:
    name: Validate scoped Gateway source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce existing Beta script boundary
        shell: bash
        run: |
          set -euo pipefail
          src="ops/apps-script/agent-log-gateway"
          test -f "$src/Code.gs"
          test -f "$src/appsscript.json"
          grep -Fq "request_privileged_auth_code" "$src/Code.gs"
          grep -Fq "privileged_agent_login" "$src/Code.gs"
          grep -Fq "privileged_agent_reauth" "$src/Code.gs"
          grep -Fq "validateIdToken_" "$src/Code.gs"
          jq -e '.webapp.executeAs == "USER_DEPLOYING" and .webapp.access == "ANYONE_ANONYMOUS"' "$src/appsscript.json" >/dev/null
          echo "BETA_GATEWAY_SCOPED_SOURCE_PASS"

  deploy:
    name: Update existing scoped Beta script deployment
    if: github.event_name != 'pull_request'
    needs: source-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Apps Script CLI
        run: npm install --global @google/clasp@3.4.1 --ignore-scripts --no-audit --no-fund
      - name: Fail-closed existing-deployment update
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          AGENT_GATEWAY_URL: ${{ vars.AGENT_LOG_GATEWAY_URL_BETA }}
        run: |
          set -euo pipefail
          test -n "${CLASPRC_JSON:-}" || { echo "::error::Missing existing CLASPRC_JSON beta secret"; exit 1; }
          test -n "${AGENT_GATEWAY_URL:-}" || { echo "::error::Missing scoped Agent Gateway Beta URL variable"; exit 1; }
          if [[ ! "$AGENT_GATEWAY_URL" =~ ^https://script\.google\.com/macros/s/([A-Za-z0-9_-]+)/exec/?$ ]]; then
            echo "::error::Existing Gateway URL does not match the expected Google Apps Script deployment format"
            exit 1
          fi
          gateway_deployment="${BASH_REMATCH[1]}"
          umask 077
          mkdir -p "$HOME"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          unset CLASPRC_JSON

          work="$(mktemp -d)"
          cleanup() {
            rm -rf "$work"
            rm -f "$HOME/.clasprc.json"
          }
          trap cleanup EXIT

          # This harmless read also refreshes OAuth using the already-authorized clasp credential.
          clasp --json list-scripts >/dev/null
          access_token="$(jq -r '.tokens.default.access_token // .token.access_token // .access_token // empty' "$HOME/.clasprc.json")"
          test -n "$access_token" || { echo "::error::Apps Script authenticated token unavailable"; exit 1; }

          # Resource identity: EXACT canonical scoped name. Never infer, create,
          # rename, or select a similarly named script.
          http="$(curl -sS --max-time 30 -o "$work/matched.json" -w '%{http_code}' -G \
            -H "Authorization: Bearer $access_token" \
            --data-urlencode "q=name = 'SUPRA Inventory Beta - Agent Operations Gateway' and mimeType = 'application/vnd.google-apps.script' and trashed = false" \
            --data-urlencode "fields=nextPageToken,files(id,name,mimeType)" \
            --data-urlencode "pageSize=1000" \
            "https://www.googleapis.com/drive/v3/files")"
          [ "$http" = "200" ] || { echo "::error::Scoped Script Drive metadata not accessible (HTTP $http)"; exit 1; }
          count="$(jq -r '.files | length' "$work/matched.json")"
          [ "$count" = "1" ] && [ "$(jq -r '.nextPageToken // ""' "$work/matched.json")" = "" ] || {
            echo "::error::Existing Agent Gateway is not uniquely discoverable by canonical name; refusing mutation"
            exit 1
          }
          script_id="$(jq -r '.files[0].id // empty' "$work/matched.json")"
          test -n "$script_id" || exit 1
          cp ops/apps-script/agent-log-gateway/Code.gs "$work/Code.gs"
          cp ops/apps-script/agent-log-gateway/appsscript.json "$work/appsscript.json"
          jq -n --arg id "$script_id" '{scriptId:$id,rootDir:"."}' > "$work/.clasp.json"
          cd "$work"

          # The deployment must already exist on EXACTLY that script. This
          # protects all other Apps Script projects and the published URL.
          clasp --json list-deployments > before.json
          jq -e --arg id "$gateway_deployment" 'map(select(.deploymentId == $id)) | length == 1' before.json >/dev/null || {
            echo "::error::Existing scoped gateway deployment does not match script; refusing update"
            exit 1
          }

          clasp push --force >/dev/null
          clasp --json create-version "D165-Beta-Privileged-OTP-${GITHUB_RUN_ID}" > version.json
          version="$(jq -r '.versionNumber // empty' version.json)"
          [ -n "$version" ] || { echo "::error::Unable to determine new Apps Script version"; exit 1; }
          clasp --json create-deployment --deploymentId "$gateway_deployment" --versionNumber "$version" --description "D165-Beta-Privileged-OTP-${GITHUB_RUN_ID}" > deployed.json
          jq -e --arg id "$gateway_deployment" --arg v "$version" '.deploymentId == $id and (.versionNumber|tostring) == $v' deployed.json >/dev/null || exit 1
          clasp --json list-deployments > after.json
          jq -e --arg id "$gateway_deployment" --arg v "$version" 'map(select(.deploymentId == $id and ((.versionNumber|tostring) == $v))) | length == 1' after.json >/dev/null || {
            echo "::error::Existing Gateway deployment version readback mismatch"
            exit 1
          }
          echo "D165_BETA_EXISTING_GATEWAY_PUSH_VERSION_REDEPLOY_READBACK_PASS"
