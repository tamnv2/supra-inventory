name: D173 E278 Agent194 protected OTA release
on:
  push:
    branches: [main]
    paths: ["relay-agent/VERSION", ".github/workflows/d173-e278-agent194-ota.yml"]
permissions:
  contents: write
  actions: read
jobs:
  agent194-ota:
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'D173-E278_AGENT194_CONFIRM_INCIDENT_PROD_RELEASE:')
    runs-on: windows-latest
    environment: beta
    timeout-minutes: 40
    env:
      FIREBASE_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
      AGENT_LOG_GATEWAY_URL_BETA: ${{ vars.AGENT_LOG_GATEWAY_URL_BETA }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v5
        with: {dotnet-version: "8.0.x"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Gate exact Owner merge, CI and D172 scope
        shell: pwsh
        run: |
          python3 tools/d173_e278_release_gate.py --component agent
          if ($LASTEXITCODE -ne 0) { throw 'E278 release gate denied' }
      - name: Verify Worker Production SUCCESS at identical main commit
        shell: pwsh
        run: |
          $ok = $false
          for ($i=0; $i -lt 80; $i++) {
            $raw = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/deploy-beta.yml/runs?head_sha=$env:GITHUB_SHA&per_page=10"
            if ($LASTEXITCODE -ne 0) { throw 'Worker release verification unavailable' }
            $runs = @(($raw | ConvertFrom-Json).workflow_runs | Where-Object { $_.head_sha -eq $env:GITHUB_SHA -and $_.event -eq 'push' })
            if (@($runs | Where-Object { $_.conclusion -eq 'success' }).Count -gt 0) { $ok = $true; break }
            if (@($runs | Where-Object { $_.conclusion -in @('failure','cancelled','timed_out') }).Count -gt 0) { throw 'Worker deployment failed; Agent OTA held' }
            Start-Sleep -Seconds 12
          }
          if (-not $ok) { throw 'Worker exact-source deploy not verified; OTA held' }
          Write-Host 'E278_WORKER_SAME_SHA_RELEASE_VERIFIED'
      - name: Protect prior Agent193 and immutable Host14 OTA channel
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'e278-prev'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download inventory-channel --repo $env:GITHUB_REPOSITORY --pattern 'agent-latest.json' --pattern 'agent-browser-latest.json' --dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'Previous Agent OTA manifest unavailable' }
          $previous = Get-Content (Join-Path $dir 'agent-latest.json') -Raw | ConvertFrom-Json
          $browserHost = Get-Content (Join-Path $dir 'agent-browser-latest.json') -Raw | ConvertFrom-Json
          if ($previous.tag -ne 'relay-agent-v193' -or [int]$browserHost.host_build -ne 14) { throw 'Expected v193/Host14 baseline drift' }
          $tags = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 400 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0 -or $tags -contains 'relay-agent-v194') { throw 'Tag v194 exists or index unavailable' }
      - name: Inject existing protected Firebase and Apps Script configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FIREBASE_API_KEY_BETA) -or $env:FIREBASE_API_KEY_BETA.Contains('__')) { throw 'Firebase config missing' }
          $gateway = ([string]$env:AGENT_LOG_GATEWAY_URL_BETA).Trim()
          $uri = $null
          if (-not [System.Uri]::TryCreate($gateway,[System.UriKind]::Absolute,[ref]$uri) -or $uri.Scheme -ne 'https' -or $uri.Host -ne 'script.google.com' -or -not $uri.AbsolutePath.EndsWith('/exec')) { throw 'Gateway invalid' }
          $path = 'relay-agent/AgentConfig.cs'
          $src = Get-Content $path -Raw
          if (-not $src.Contains('__FIREBASE_API_KEY_BETA__') -or -not $src.Contains('__AGENT_LOG_GATEWAY_URL_BETA__')) { throw 'Placeholders missing' }
          Set-Content $path ($src.Replace('__FIREBASE_API_KEY_BETA__',$env:FIREBASE_API_KEY_BETA).Replace('__AGENT_LOG_GATEWAY_URL_BETA__',$gateway)) -Encoding utf8
      - name: Build Agent194 native WinForms and smoke
        shell: pwsh
        run: |
          dotnet build relay-agent/SupraInventoryRelayAgent.csproj -c Release -p:PlatformTarget=x64
          if ($LASTEXITCODE -ne 0) { throw 'Agent194 build failed' }
          $exe = (Resolve-Path 'relay-agent/bin/Release/net48/Agent Auto Confirm Pick Pack.exe').Path
          foreach ($arg in @('--startup-smoke','--e100-roster-self-test','--e103-activity-self-test','--d140-sync-safety-self-test')) {
            $p = Start-Process -FilePath $exe -ArgumentList $arg -PassThru
            if (-not $p.WaitForExit(20000)) { try {$p.Kill()} catch {}; throw "Agent194 smoke timeout $arg" }
            if ($p.ExitCode -ne 0) { throw "Agent194 smoke failed $arg" }
          }
          New-Item -ItemType Directory -Force -Path relay-agent/dist | Out-Null
          Copy-Item $exe 'relay-agent/dist/Agent.Auto.Confirm.Pick.Pack.exe'
          $sha = (Get-FileHash 'relay-agent/dist/Agent.Auto.Confirm.Pick.Pack.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha | Set-Content 'relay-agent/dist/Agent.Auto.Confirm.Pick.Pack.exe.sha256' -Encoding utf8
      - name: Publish SHA-verified Agent194 tag and switch Agent-only OTA
        shell: pwsh
        run: |
          python3 tools/d173_e278_release_gate.py --component agent
          if ($LASTEXITCODE -ne 0) { throw 'Release gate drift' }
          $tag = 'relay-agent-v194'
          $base = 'relay-agent/dist'
          $exe = "$base/Agent.Auto.Confirm.Pick.Pack.exe"
          $checksum = "$exe.sha256"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content $checksum -Raw).Trim().Split(' ')[0].ToLowerInvariant() -ne $sha) { throw 'Local hash mismatch' }
          gh release create $tag "$exe#Agent.Auto.Confirm.Pick.Pack.exe" "$checksum#Agent.Auto.Confirm.Pick.Pack.exe.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Agent Auto Confirm Pick Pack v194' --notes 'D173-E278: bounded Web Confirm recovery, safe Agent HA and single Owner incident email. Host14, Web UI, Android, D172 and Stable unchanged. FIELD pending.' --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release tag publish failed' }
          $check = Join-Path $env:RUNNER_TEMP 'e278-tag'
          New-Item -ItemType Directory -Force -Path $check | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern 'Agent.Auto.Confirm.Pick.Pack.exe' --pattern 'Agent.Auto.Confirm.Pick.Pack.exe.sha256' --dir $check
          if ($LASTEXITCODE -ne 0) { throw 'Tag readback missing' }
          $actual = (Get-FileHash (Join-Path $check 'Agent.Auto.Confirm.Pick.Pack.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $remoteText = (Get-Content (Join-Path $check 'Agent.Auto.Confirm.Pick.Pack.exe.sha256') -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          if ($actual -ne $sha -or $remoteText -ne $sha) { throw 'Tag SHA mismatch; OTA unchanged' }
          $manifest = [ordered]@{
            schema_version = 1; channel = 'beta'; tag = $tag
            name = 'Agent Auto Confirm Pick Pack v194'
            published_at = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            source = $env:GITHUB_SHA
            asset_name = 'Agent.Auto.Confirm.Pick.Pack.exe'
            size_bytes = (Get-Item (Join-Path $check 'Agent.Auto.Confirm.Pick.Pack.exe')).Length
            sha256 = $sha
            release_notes = @('Agent194: bounded Web Confirm recovery; safe HA; one Owner email per incident. Host14 unchanged. FIELD pending.')
          } | ConvertTo-Json -Compress
          $manifest | Set-Content "$base/agent-latest.json" -Encoding utf8
          gh release upload inventory-channel $exe $checksum --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'EXE update failed, manifest unchanged' }
          gh release upload inventory-channel "$base/agent-latest.json" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Manifest switch failed' }
          $final = Join-Path $env:RUNNER_TEMP 'e278-final'
          New-Item -ItemType Directory -Force -Path $final | Out-Null
          gh release download inventory-channel --repo $env:GITHUB_REPOSITORY --pattern 'Agent.Auto.Confirm.Pick.Pack.exe' --pattern 'Agent.Auto.Confirm.Pick.Pack.exe.sha256' --pattern 'agent-latest.json' --dir $final
          if ($LASTEXITCODE -ne 0) { throw 'Channel readback missing' }
          $finalSha = (Get-FileHash (Join-Path $final 'Agent.Auto.Confirm.Pick.Pack.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $fText = (Get-Content (Join-Path $final 'Agent.Auto.Confirm.Pick.Pack.exe.sha256') -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          $fManifest = Get-Content (Join-Path $final 'agent-latest.json') -Raw | ConvertFrom-Json
          if ($finalSha -ne $sha -or $fText -ne $sha -or $fManifest.tag -ne $tag -or $fManifest.sha256 -ne $sha) { throw 'OTA SHA mismatch' }
          Write-Host "D173_E278_AGENT194_OTA_TECH_PASS sha256=$sha FIELD_OWNER_PENDING"
