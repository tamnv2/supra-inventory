name: D171 Agent and Logging CODE ONLY Safety
on:
  pull_request:
    paths:
      - "relay-agent/**"
      - "android/app/src/main/java/cd/cc/supra/inventory/beta/**"
      - "android/app/build.gradle.kts"
      - "android/release-notes.json"
      - "web/src/runtime-logger.ts"
      - "web/src/web-version.ts"
      - "web/package.json"
      - "service/src/**"
      - "service/package.json"
      - "service/tsconfig.json"
      - "ops/apps-script/agent-log-gateway/Code.gs"
      - "tests/d171*.test.mjs"
      - "tools/d171-one-shot/**"
      - ".github/workflows/verify-d171-agent-code-only.yml"
jobs:
  code-only-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail-closed provider and stable release boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=2
          changed="$(git diff --name-only origin/main...HEAD)"
          protected="$(echo "$changed" | grep -E '^(firebase/|service/wrangler|\.github/workflows/deploy-beta-firestore|\.github/workflows/deploy-stable)' || true)"
          if [ -n "$protected" ]; then
            # Scope-specific D173-E005 exception: only the additive no-reply binding
            # on the same existing Worker; never skip D171/D172/Stable protections.
            if [ "${{ github.event_name }}" = "pull_request" ] &&
               [ "${{ github.head_ref }}" = "feature/d173-e005-cloudflare-email-cutover-20261023" ] &&
               [ "$protected" = "service/wrangler.beta.toml" ]; then
              python3 - <<'PYEMAIL'
          import json
          import subprocess
          from pathlib import Path
          main=subprocess.check_output(["git","show","origin/main:service/wrangler.beta.toml"],text=True)
          candidate=Path("service/wrangler.beta.toml").read_text()
          binding = (
            '# D173: bind ONLY the existing official Production Worker to its verified sender.\n'
            '# Activation is separate: PROJECT_MAIL_SENDER stays unset until a verified delivery test.\n'
            '[[send_email]]\n'
            'name = "EMAIL"\n'
            'allowed_sender_addresses = ["no-reply@supra.cc.cd"]\n\n'
          )
          sender_off='# Safety: keep the current Gmail sender until verified Cloudflare delivery and release receipt.\nPROJECT_MAIL_SENDER = ""\n'
          assert main.count("[[durable_objects.bindings]]")==1
          assert candidate.replace(binding,"").replace(sender_off,"")==main, "D173 changed unexpected Worker config"
          scope=json.loads(Path("ops/project-scope.json").read_text())
          assert any(x.get("key")=="cf-email-sending-prod" and x.get("worker_resource_key")=="worker-beta" and
                     x.get("allowed_sender_addresses")==["no-reply@supra.cc.cd"] for x in scope["resources"])
          journal=json.loads(Path("ops/change-continuity/D173.json").read_text())
          assert any(e.get("id")=="D173-E005" and e.get("owner_approval") is True for e in journal["entries"])
          print("D173_E005_EXACT_EMAIL_SCOPE_PASS_NO_GMAIL_SWITCH")
          PYEMAIL
            elif [ "${{ github.event_name }}" = "pull_request" ] &&
                 [ "${{ github.head_ref }}" = "release/d173-e010-no-reply-activate-20261023" ] &&
                 [ "$protected" = "service/wrangler.beta.toml" ]; then
              python3 - <<'PYACTIVATE'
          import subprocess
          from pathlib import Path
          old=subprocess.check_output(["git","show","origin/main:service/wrangler.beta.toml"],text=True)
          expected=old.replace(
            '# Activation is separate: PROJECT_MAIL_SENDER stays unset until a verified delivery test.',
            '# D173-E010: E007 real Gmail receipt and E008 200/day quota verified; sender activation scoped to four transactional mail types.'
          ).replace('PROJECT_MAIL_SENDER = ""','PROJECT_MAIL_SENDER = "no-reply@supra.cc.cd"')
          assert old != expected and Path("service/wrangler.beta.toml").read_text()==expected
          assert expected.count('[[send_email]]')==1
          print("D173_E010_ONLY_CONFIRMED_EMAIL_SENDER_FLAG_CHANGED_PASS")
          PYACTIVATE
            else
              test "$protected" = ".github/workflows/deploy-beta-firestore.yml" || {
                echo "D171 provider, Rules and Stable deployment paths are not approved"; exit 1;
              }
              python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          path=".github/workflows/deploy-beta-firestore.yml"
          old=subprocess.run(["git","show","origin/main:"+path],capture_output=True,text=True,check=True).stdout
          actual=Path(path).read_text(encoding="utf-8")
          anchor="startsWith(github.event.head_commit.message, 'D169-E061_ANDROID_ONLY:')"
          expected=old.replace(anchor,"startsWith(github.event.head_commit.message, 'D171-E074_ANDROID_ONLY:') || "+anchor,1)
          assert old.count(anchor)==1, "D171 E074 old guard missing"
          auth=json.loads(Path("ops/d171-release-authorization.json").read_text())
          assert auth.get("e074_vc117",{}).get("approved_by_owner") is True
          assert auth.get("approved_components")==["android"]
          assert actual==expected, "D171 E074 Firestore workflow change must be skip-only"
          print("D171_E074_NO_FIRESTORE_DEPLOY_SCOPE_PASS")
          PY
            fi
          fi
          test -f docs/D171_E030_CODE_ONLY_RELEASE_HOLD_2026-10-20.md
          grep -Fq 'D171-E039' docs/OWNER_DECISIONS.md || {
            echo "D171 E039 authority checkpoint missing"; exit 1;
          }
      - name: D171 combined HA, ACK and logging contracts
        run: |
          node --test tests/d171-agent-code-only.test.mjs
          node --test tests/d171-agent-android-v115.test.mjs
          node --test tests/d171-log-delivery.test.mjs
          node --test tests/d171-e054-usage-fixes.test.mjs
          node --test tests/d171-e058-displayed-only.test.mjs
          # E046 was an historical pre-cutover freeze, superseded by protected
          # Owner-limited D170/D171 closure; retain original test for old branches.
          if [ "${{ github.head_ref }}" = "feature/d173-e005-cloudflare-email-cutover-20261023" ] ||
             [ "${{ github.head_ref }}" = "release/d173-e010-no-reply-activate-20261023" ]; then
            node --test tests/d173-no-reply-otp.test.mjs
            python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("ops/project-state.json").read_text())
          assert j["change_control"]["accepted_base_change_id"]=="D171"
          assert j["change_control"]["current_change_id"]=="D173"
          assert j["d173"]["source_code_approved"] is True
          assert j["d173"]["production_deploy_approved"] is False
          print("D173_OWNER_LIMITED_BASELINE_PASS_NOT_D171_OLD_FREEZE")
          PY
          else
            node --test tests/d171-single-production-freeze.test.mjs
          fi
          node --test tests/d171-usage-hotpaths.test.mjs
          node --test tests/d169-client-code-only.test.mjs
          node --test tests/d170-official-client-hosts.test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: D171 single-DO A-D strict TypeScript typecheck (no deploy)
        run: |
          npm install --prefix service --no-audit --no-fund --ignore-scripts
          npm run typecheck --prefix service
      - name: Six-Agent forty-PDA isolated offline replay
        run: |
          python3 tools/d171-one-shot/simulate.py > /tmp/d171-sim.json
          python3 tools/d171-one-shot/load_replay.py > /tmp/d171-load.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/d171-load.json',encoding='utf-8'))
          assert p['status']=='OFFLINE_LOGIC_REPLAY_PASS'
          assert len(p['scenarios'])==3
          assert all(x['immutable_jobs']==2000 and x['terminal_acks']==1998 and
            x['firestore_requests']==0 and x['real_wms_mutations']==0
            for x in p['scenarios'])
          print('D171_OFFLINE_LOAD_PASS_NO_LIVE_PROVIDER_TEST')
          PY
      - name: Explicit no deployment receipt
        run: echo "D171_E039_CODE_ONLY__NO_MAIN_MERGE_OTA_PROVIDER_OR_STABLE_DEPLOY"
