name: D173-E055 Usage SQL Equivalence and D172 Isolation
on:
  pull_request:
    paths:
      - "service/src/operational-v2-core.ts"
      - "service/src/d167-route-usage.ts"
      - "service/src/d173-persistent-usage.ts"
      - "tools/d173_e055_usage_regression.py"
      - ".github/workflows/d173-e055-usage.yml"
permissions:
  contents: read
jobs:
  usage-sql-and-d172:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source-pinned release gate compiles without any provider action
        run: python -m py_compile tools/d173_e055_worker_release_gate.py tools/d167_release_gate.py
      - name: Fail-closed Owner Worker release preflight
        run: |
          if [ "${{ github.head_ref }}" = "feat/d173-e123-owner-approved-prod-bundle-20261103" ]; then
            # Retain E055 SQL parity/D172 checks below. Use the NEW approved
            # multi-component source boundary; old E055 Worker-only SHA must deny.
            python3 tools/d173_e123_release_gate.py --component worker --preflight
            if python3 tools/d173_e055_worker_release_gate.py --component worker --preflight >/dev/null 2>&1; then
              echo "Unsafe: E123 inherited E055 Worker-only release permission" >&2
              exit 1
            fi
          elif [ "${{ github.head_ref }}" = "docs/d173-e108-production-do-proposal-20261101" ]; then
            # This source has CODE ONLY approval and cannot reuse E055's old pin.
            python tools/d173_e109_code_only_guard.py --reject-old-e055-release
          elif [ "$(jq -r '.status' ops/d173-e055-worker-release-authorization.json)" = "OWNER_EXPLICIT_DEPLOY_APPROVED" ]; then
            python tools/d173_e055_worker_release_gate.py --component worker --preflight
          else
            echo "D173_E055_RELEASE_DENIED_CODE_ONLY_PENDING_CI"
          fi
      - name: Source and SQLite behavioral equivalence for old/new E055 queries
        run: python tools/d173_e055_usage_regression.py
      - name: Preserve E049 restart-durable exact diagnostic SQLite counters
        run: python tools/d173_e049_sqlite_fixture.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install service TypeScript dependencies for D172 test imports
        working-directory: service
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Independent D172 OBPP auth, Sheet and private SQLite business regression
        run: node --test tests/d172-*.test.mjs
      - name: Shared Worker TypeScript regression
        working-directory: service
        run: npm run typecheck
