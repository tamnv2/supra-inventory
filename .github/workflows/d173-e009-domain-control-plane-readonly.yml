name: D173 E009 Cloudflare domain mapping read-only
on:
  pull_request:
    paths:
      - ".github/workflows/d173-e009-domain-control-plane-readonly.yml"
      - "service/wrangler.beta.toml"
      - "docs/D173_LEGACY_RETIREMENT_AUDIT_2026-10-23.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  existing-domains-only:
    runs-on: ubuntu-latest
    environment: beta
    timeout-minutes: 6
    steps:
      - name: Current Production hostname binding GET only
        shell: bash
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN_INVENTORY_BETA }}
        run: |
          set -euo pipefail
          [[ "${CF_ACCOUNT_ID:-}" =~ ^[A-Fa-f0-9]{32}$ ]] || { echo "::error::Account scope unavailable"; exit 1; }
          [ -n "${CF_API_TOKEN:-}" ] || { echo "::error::Cloudflare token missing"; exit 1; }
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          status="$(curl --silent --show-error --max-time 20 -o "$tmp" -w '%{http_code}'             -H "Authorization: Bearer $CF_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/domains?per_page=100")"
          [[ "$status" == 200 ]] && jq -e '.success == true and (.result | type) == "array"' "$tmp" >/dev/null || {
            echo "::error::Cloudflare domain control-plane GET failed status=$status"; exit 1;
          }
          jq -e '
            ([.result[] | select(.hostname == "inventory.supra.cc.cd")] | length) == 1 and
            ([.result[] | select(.hostname == "inventory-beta.supra.cc.cd")] | length) == 1 and
            ([.result[] | select(.hostname == "inventory.supra.cc.cd" or .hostname == "inventory-beta.supra.cc.cd") | .service] | unique) == ["supra-inventory-beta"]
          ' "$tmp" >/dev/null || {
            echo "::error::Current hostname bindings differ from source baseline: stop removal"; exit 1;
          }
          echo "D173_E009_PROVIDER_GET_PASS__BOTH_HOSTS_SAME_PRODUCTION_WORKER__LEGACY_DETACH_NOT_AUTHORIZED"
          echo "NO_RESOURCE_MUTATION__D172_PENDING_HOLD__STABLE_OWNER_GATED"
