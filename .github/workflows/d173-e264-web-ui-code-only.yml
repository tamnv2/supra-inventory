name: D173 E264 Web Global UI Geometry Code Only
on:
  pull_request:
    paths:
      - 'web/src/d173-tabler.css'
      - 'tests/d173-e264-web-global-ui-rhythm.test.mjs'
      - 'docs/D173_E264_WEB_GLOBAL_UI_RHYTHM_2026-11-13.md'
      - 'ops/change-continuity/D173.json'
      - 'ops/project-state.json'
      - '.github/workflows/d173-e264-web-ui-code-only.yml'
      - '.github/workflows/deploy-beta.yml'
      - 'tests/d173-e265-web3321-release.test.mjs'
      - 'tools/d173_e265_web3321_release_gate.py'
      - 'ops/d173-e265-web3321-release-authorization.json'
      - 'web/src/web-version.ts'
      - 'web/package.json'
permissions:
  contents: read
jobs:
  presentation-and-isolation:
    if: contains(github.head_ref, 'd173-e264-web-global-ui-rhythm')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Web UI geometry and accepted regression contracts
        run: |
          node --test tests/d173-e265-web3321-release.test.mjs tests/d173-e264-web-global-ui-rhythm.test.mjs tests/d173-e260-web-ui-layout.test.mjs tests/d173-e252-web3318-overview.test.mjs tests/d173-e237-web3315-global-layout.test.mjs tests/d173-e230-web3313-field-density.test.mjs tests/d173-e242-web3316-ui-consistency.test.mjs
      - name: Web typecheck and Vite build
        working-directory: web
        run: npm install --ignore-scripts --no-audit --no-fund && npm run build
      - name: Install Worker test compiler for independent D172 guards
        working-directory: service
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: D172 separation and independent source regression
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 tools/d173_isolation_guard.py --base "$BASE_SHA" --head HEAD
          node --test tests/d172-*.test.mjs
      - name: Validate Owner release gate as no-deploy preflight
        run: python3 tools/d173_e265_web3321_release_gate.py --component web --preflight
      - name: Scope-bound source CI never deploys
        run: echo 'D173_E265_WEB3321_SOURCE_ONLY__NO_DEPLOY__D172_HOLD'
