name: Apply Android Realtime Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-android-realtime-once.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic Android realtime patch
        run: |
          set -euo pipefail
          python3 tools/apply_android_realtime.py
          git diff --check
          python3 tools/project_state_guard.py
      - name: Commit generated source and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-android-realtime-once.yml
          git add android/app/src/main/java/cd/cc/supra/inventory/beta/MainActivity.kt \
                  android/app/src/main/java/cd/cc/supra/inventory/beta/InventoryApi.kt \
                  android/app/src/main/java/cd/cc/supra/inventory/beta/AndroidRealtimeClient.kt \
                  android/app/build.gradle.kts \
                  ops/project-state.json \
                  ops/resource-registry.json
          git commit -m "feat(android): wire foreground realtime client"
          git push origin HEAD:main
