name: D170 Read-only Production Domain Preflight
# D170-E011: recheck mapping after Cloudflare HTTP200 DELETE response was not acknowledged by API body.

on:
  pull_request:
    paths:
      - ".github/workflows/d170-domain-preflight.yml"
      - "service/wrangler.beta.toml"
      - "service/wrangler.stable.toml"
      - "web/**"
      - "android/**"
      - "relay-agent/AgentConfig.cs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-preflight:
    name: Check actual Cloudflare domain ownership without mutation
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - uses: actions/checkout@v4
      - name: D170 same-Worker/domain/OAuth source safety invariants
        run: |
          bash -n tools/d170_domain_cutover.sh
          node --test tests/d170-domain-cutover.test.mjs
      - name: Verify existing Worker and custom-domain assignment (read only)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN_INVENTORY_BETA }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CF_API_TOKEN:-}" || ! "${CF_ACCOUNT_ID:-}" =~ ^[[:xdigit:]]{32}$ ]]; then
            echo "::error::Scoped Cloudflare read-only preflight cannot access existing CI token/account ID"
            exit 1
          fi
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          status="$(curl --silent --show-error --max-time 20 -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/domains?per_page=100")"
          if [[ "$status" != "200" ]] || ! jq -e '.success == true and (.result | type) == "array"' "$tmp" >/dev/null; then
            echo "::error::Cloudflare Workers Domains read-back not permitted (HTTP $status). No mutation attempted."
            exit 1
          fi
          old_services="$(jq -r '[.result[] | select(.hostname=="inventory-beta.supra.cc.cd") | .service] | unique | join(",")' "$tmp")"
          official_services="$(jq -r '[.result[] | select(.hostname=="inventory.supra.cc.cd") | .service] | unique | join(",")' "$tmp")"
          echo "Legacy hostname service: ${old_services:-<unmapped>}"
          echo "Official hostname service: ${official_services:-<unmapped>}"
          # E019: old host may be attached before sunset or absent afterwards;
          # never accept a third-party/old Stable binding on either hostname.
          if [[ -n "$old_services" && "$old_services" != "supra-inventory-beta" ]]; then
            echo "::error::Unexpected legacy domain owner; no mutation."
            exit 1
          fi
          if [[ "$official_services" != "supra-inventory-beta" ]]; then
            echo "::error::Official Production host changed owner; no mutation."
            exit 1
          fi
          if [[ -z "$old_services" ]]; then
            status_label="OFFICIAL_ONLY__LEGACY_ALREADY_DETACHED"
          else
            status_label="BOTH_ON_EXISTING_WORKER__LEGACY_DETACH_STILL_PENDING"
          fi
          echo "D170 actual-domain classification: $status_label"
          {
            echo "### D170 provider read-only preflight"
            echo "Live Worker: `$old_services`"
            echo "Official hostname current owner: `${official_services:-unassigned}`"
            echo "Cutover classification: `$status_label`"
            echo "No Worker/domain/DNS/database change was attempted."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status_label" == UNKNOWN_* ]]; then
            exit 1
          fi
      - name: Verify official public asset route without touching SQLite
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          status="$(curl --silent --show-error --max-time 20 -o "$tmp" -w '%{http_code}' \
            "https://inventory.supra.cc.cd/about")"
          if [[ "$status" != "200" ]] || ! test -s "$tmp"; then
            echo "::error::Official Production asset route did not return HTTP200; no mutation."
            exit 1
          fi
          echo "D173_E019_OFFICIAL_PUBLIC_ASSET_GET_PASS_NO_CORE_MIGRATION"
