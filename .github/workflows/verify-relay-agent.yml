name: Verify Beta Relay Agent

on:
  pull_request:
    paths:
      - "relay-agent/**"
      - "relay-agent-webview2-host/**"
      - "firebase/database.rules.json"
      - "firebase/firestore.rules"
      - "firebase/firestore.indexes.json"
      - ".github/workflows/verify-relay-agent.yml"
  push:
    branches: [main]
    paths:
      - "relay-agent/**"
      - "relay-agent-webview2-host/**"
      - "firebase/database.rules.json"
      - "firebase/firestore.rules"
      - "firebase/firestore.indexes.json"
      - ".github/workflows/verify-relay-agent.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay-agent:
    runs-on: windows-latest
    environment: beta
    env:
      FIREBASE_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
      AGENT_LOG_GATEWAY_URL_BETA: ${{ vars.AGENT_LOG_GATEWAY_URL_BETA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Validate Agent build channel
        shell: pwsh
        run: |
          $version = (Get-Content relay-agent/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+$') { throw "relay-agent/VERSION must be an integer." }
          $config = Get-Content relay-agent/AgentConfig.cs -Raw
          if ($config -notmatch "AgentBuild\s*=\s*$version\s*;") {
            throw "AgentConfig.AgentBuild does not match relay-agent/VERSION=$version"
          }

      - name: D126 browser UI confirmation and protected regression guard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content relay-agent/AgentConfig.cs -Raw
          $program = Get-Content relay-agent/Program.cs -Raw
          $browser = Get-Content relay-agent/SupraConfirmBrowser.cs -Raw
          $startup = Get-Content relay-agent/UserStartupRegistration.cs -Raw
          $exitAuth = Get-Content relay-agent/ExitAuthorization.cs -Raw
          $runtimeGuard = Get-Content relay-agent/AgentRuntimeGuard.cs -Raw
          $updater = Get-Content relay-agent/AgentUpdater.cs -Raw
          $transport = Get-Content relay-agent/FirestoreConfirmationTransport.cs -Raw
          $http = Get-Content relay-agent/FirestoreHttpTransport.cs -Raw
          $leader = Get-Content relay-agent/FirestoreAgentLeaderCoordinator.cs -Raw
          $rate = Get-Content relay-agent/FirestorePickerRateLimiter.cs -Raw
          $confirmGuard = Get-Content relay-agent/FirestoreConfirmationGuard.cs -Raw
          $rules = Get-Content firebase/firestore.rules -Raw
          $indexes = Get-Content firebase/firestore.indexes.json -Raw
          $ops = Get-Content relay-agent/D119AgentFeatures.cs -Raw
          $presence = Get-Content relay-agent/FirestorePickerPresence.cs -Raw
          $contact = Get-Content relay-agent/FirestorePickerContact.cs -Raw
          $fleet = Get-Content relay-agent/FirestoreFleetMetrics.cs -Raw
          $quota = Get-Content relay-agent/FirestoreQuotaGuard.cs -Raw
          $project = Get-Content relay-agent/SupraInventoryRelayAgent.csproj -Raw
          $browserBundle = Get-Content relay-agent/AgentBrowserBundle.cs -Raw
          $ownedHost = Get-Content relay-agent-webview2-host/Program.cs -Raw
          $projection = Get-Content service/src/firestore-projection.ts -Raw
          $sync = Get-Content relay-agent/FirestoreAgentSync.cs -Raw
          $serviceIndex = Get-Content service/src/index.ts -Raw
          $notifications = Get-Content service/src/notifications-core.ts -Raw
          $notificationApi = Get-Content service/src/notification-api.ts -Raw
          $agentLogBridge = Get-Content relay-agent/AgentLogUploadBridge.cs -Raw
          $functionsIndex = Get-Content functions/src/index.ts -Raw
          $agentLogDrain = Get-Content service/src/agent-log-drain.ts -Raw
          $d157 = Get-Content relay-agent/FirestoreD157Realtime.cs -Raw
          $d157Features = Get-Content relay-agent/D157AgentFeatures.cs -Raw
          $d160Browser = Get-Content relay-agent/SupraConfirmBrowserD160.cs -Raw
          $d160Pipeline = Get-Content relay-agent/D160ConfirmPipeline.cs -Raw
          $d160Ui = Get-Content relay-agent/D160UiHistory.cs -Raw
          $d160Usage = Get-Content relay-agent/D160Usage.cs -Raw
          $d160Resilience = Get-Content relay-agent/D160Resilience.cs -Raw

          if ($config -notmatch 'AgentBuild\s*=\s*95\s*;') { throw "D160 requires Agent v95 while Android remains hard-locked at beta-vc92." }
          if ($project -notmatch '<AssemblyVersion>0\.95\.0\.0</AssemblyVersion>' -or $project -notmatch '<FileVersion>0\.95\.0\.0</FileVersion>') {
            throw "D160 Agent assembly/file version must be 0.95."
          }
          foreach ($marker in @(
            'ConfirmManyExact',
            'FRESH_SUCCESS_SURFACE',
            'NO_FRESH_TERMINAL_SURFACE',
            'finalClicked:true',
            'TARGET_PRECHECKED',
            'FOREIGN_SELECTION'
          )) {
            if (-not $d160Browser.Contains($marker)) { throw "D160 bulk/fresh-terminal browser guard missing: $marker" }
          }
          foreach ($marker in @(
            'ProcessFirestoreConfirmationsD160',
            'D160_12S_MUTATION_FENCE',
            'WMS_DATA_UNAVAILABLE',
            'SearchMany(eligible.Select(work => work.Suffix), true, false, false)',
            'MaxConcurrentJobs',
            'EmitD160TerminalOutcomes',
            'D160_12S_MUTATION_FENCE'
          )) {
            if (-not $d160Pipeline.Contains($marker)) { throw "D160 mixed-batch pipeline guard missing: $marker" }
          }
          foreach ($marker in @('Lịch sử Picker xác nhận PickList','reset lúc 05:00','không thêm Firestore usage','Gửi Logs')) {
            if (-not $d160Ui.Contains($marker)) { throw "D160 history/log UI guard missing: $marker" }
          }
          foreach ($marker in @('tamnv2','admin','15 * 60 * 1000','get_firestore_usage','D160UsageAllowedForCurrentSession')) {
            if (-not $d160Usage.Contains($marker) -and -not $d160Ui.Contains($marker)) { throw "D160 restricted Usage guard missing: $marker" }
          }
          if (-not $d160Resilience.Contains('D160_401_AFTER_REFRESH') -or $d157.Contains('case StatusCode.Unauthenticated:')) {
            throw "D160 auth recovery guard regression."
          }

          foreach ($marker in @(
            'RenderD157OperationalListsFromMemory',
            'UpdateAgentFleetGrid(_leaderCoordinator.OnlineAgents)',
            'pickerWindowWasOpen',
            'provider_read=false provider_write=false'
          )) {
            if (-not $ops.Contains($marker)) { throw "D157 repair role-independent operational-list guard missing: $marker" }
          }

          foreach ($marker in @(
            'database=',
            'D158DesiredPollIntervalMs',
            'TryReserveD158ResilienceRead',
            'EnsureD158BusinessCounterDay',
            'SealLogoutAndFlush',
            'AgentLogGatewayUrl'
          )) {
            if (-not $d157.Contains($marker) -and -not $transport.Contains($marker) -and -not $quota.Contains($marker) -and -not $ops.Contains($marker) -and -not $program.Contains($marker) -and -not $config.Contains($marker)) {
              throw "D158 speed/health/counter/logging guard missing: $marker"
            }
          }

          foreach ($marker in @(
            'PendingDocumentNames',
            'PendingDocuments[documentName] = document'
          )) {
            if (-not $d157.Contains($marker)) { throw "D158 hotfix realtime coalescing guard missing: $marker" }
          }
          foreach ($marker in @(
            'Task.Run(() => ReadPendingDocuments(session))',
            'CanonicalizePendingDocuments',
            'CanonicalPendingIdentity',
            'duplicate_request=SKIP',
            'layer=TRANSPORT_BATCH'
          )) {
            if (-not $transport.Contains($marker)) { throw "D158 hotfix confirmation ingress guard missing: $marker" }
          }
          foreach ($marker in @(
            'PDA_CONFIRM_DUPLICATE business=SKIP',
            'PDA_CONFIRM_DUPLICATE mutation=BLOCK',
            'mutationRequestIds',
            'AgentRoleHintFile',
            'HTTP EXPECTED RESPONSE',
            'AUTH LOGIN result=FAIL'
          )) {
            if (-not $program.Contains($marker)) { throw "D158 hotfix business/auth guard missing: $marker" }
          }
          foreach ($marker in @(
            'GOOGLE_CONNECTIVITY',
            'IncidentOpen',
            'ObserveDiagnostic',
            'reason=ACTIVE_INCIDENT'
          )) {
            if (-not $agentLogBridge.Contains($marker)) { throw "D158 hotfix incident-log guard missing: $marker" }
          }

          foreach ($marker in @(
            'Runtime.enable',
            'Page.enable',
            'private const string SearchText = "Tìm kiếm"',
            'private const string ConfirmText = "Xác nhận lấy lại hàng"',
            '^PL[0-9]+$',
            "tr,[role=row]",
            'input[type=checkbox]',
            'CHECKBOX_NOT_UNIQUE',
            'CHECKBOX_VERIFY_FAILED',
            'CONFIRM_BUTTON_NOT_UNIQUE',
            'ROW_AMBIGUOUS',
            'ClickExactButtonNoLock(SearchText)',
            'SW_HIDE',
            'SW_RESTORE',
            'SetBrowserWindowsVisibleNoLock',
            'CONFIRM_DOM_PARTIAL',
            'ConfirmVisibleCount',
            '[role=grid]',
            'a,[role=button]',
            'await new Promise',
            'TryReconnectNoLock',
            'StopManagedBrowserNoLock',
            "getAttribute('aria-label')",
            "getAttribute('title')",
            "querySelectorAll('body *')",
            'decorationOnly',
            'searchDecoratedCount',
            "search|magnify|magnifying|glass|find|icon",
            'private const string ConfirmDialogTitle = "XÁC NHẬN LẤY LẠI HÀNG"',
            'private const string ConfirmDialogBody = "Bạn có chắc chắn cho phép lấy hàng lại không?"',
            'private const string ConfirmDialogButtonText = "Xác nhận"',
            'private const string ConfirmDialogCloseText = "Đóng"',
            'CONFIRM_DIALOG_NOT_FOUND',
            'CONFIRM_DIALOG_AMBIGUOUS',
            'CONFIRM_DIALOG_BUTTON_NOT_UNIQUE',
            'CONFIRM_DIALOG_CLOSE_NOT_UNIQUE',
            "stage:'DIALOG_CONFIRMED'",
            'dialog_required=true',
            'private const string PageSizeLabel = "Số dòng mỗi trang"',
            'private const string PageSizeTarget = "100"',
            'EnsurePageSize100NoLock',
            'PAGE_SIZE_100_VERIFY_FAILED',
            'UnselectableFragments',
            'StartOwnedWebView2NoLock',
            'StartLegacyBrowserNoLock',
            'OpenOrShowAgent',
            'OpenOrShowDesktop',
            'owned_webview2=FAILED',
            'auto_fallback=false',
            'PAGE_SIZE_CONTROL_NOT_FOUND',
            'private const string LoginMarkerText = "Lưu thông tin đăng nhập"',
            'LoginMarkerDetected',
            'PageLoaded',
            "document.readyState === 'complete'",
            'ResetDirectConfirmRecoveryNoLock',
            'route_recovery=DIRECT_CONFIRM_RETRY',
            'login_marker=DETECTED',
            'login_marker=CLEARED',
            'AUTO_RETRY_CONFIRM',
            'CONFIRM_RETRY_EXHAUSTED',
            'source_host_unrestricted=true',
            'stable_loaded_non_login_non_confirm',
            'TimeSpan.FromMilliseconds(750)',
            'TimeSpan.FromSeconds(3)',
            'AuthDashboardHost = "auth-supra.winmart.vn"',
            'AuthDashboardPath = "/dashboard"',
            'WmsAppDashboardPath = "/sft3/app/dashboard"',
            'DashboardArrowPath',
            'BuildDashboardAccessClickScript',
            'HY1_SFT3_SMALLEST_CARD',
            'chosen.button.click()',
            'dashboard_access=',
            'popup_semantics=preserve',
            'ReconnectToWmsPageTargetNoLock',
            'WaitForPageTarget(_port, timeout, true)',
            'DASHBOARD_ACCESS_CLICK',
            'DASHBOARD_ACCESS_FAILED',
            'dashboard_popup=SFT3_READY',
            'TimeSpan.FromSeconds(12)'
          )) {
            if (-not $browser.Contains($marker)) { throw "D126 browser semantic guard missing: $marker" }
          }
          if (-not $browser.Contains("names(e).some(v => fold(v) === fold('Xác nhận lấy lại hàng'))")) { throw "D126 H3 readiness confirm control must remain exact-label only." }
          if ($browser.Contains('state.Url.IndexOf("https://wms-supra.winmart.vn"')) { throw "D127 v67 current-page host must not gate Confirm recovery." }
          if ($browser.Contains('SessionBootstrapUrl')) { throw "D127 v67 must not directly navigate the observed /sft3/session target." }
          if ($browser.Contains('Input.dispatchMouseEvent') -or $browser.Contains('userGesture')) { throw "D127 v67 Dashboard recovery must stay on simple DOM click." }
          foreach ($marker in @('LayoutSupraCardControls','_agentDataStorageStatus','_openAgentDataFolder')) {
            if (-not $ops.Contains($marker)) { throw "D127 v67 responsive Supra layout guard missing: $marker" }
          }
          foreach ($marker in @(
            'RequiredHostBuild = 10',
            'RequiredHostArch = "x64"',
            'host-build.txt',
            'host-arch.txt',
            'WebView2Loader.dll',
            'CleanupObsoleteBackground',
            'CleanupInactiveBundles',
            'reclaimed_bytes',
            'BrowserDataRoot'
          )) {
            if (-not $browserBundle.Contains($marker)) { throw "D127 v67 browser bundle/storage guard missing: $marker" }
          }
          foreach ($marker in @(
            'Environment.Is64BitProcess',
            'CoreWebView2Environment.SetLoaderDllFolderPath(loaderFolder)',
            'loader", "x64"',
            'WebView2Loader.dll',
            'NewWindowRequested += HandleNewWindowRequested',
            'GetDeferral()',
            'ConfigureWebViewAsync(child)',
            'e.NewWindow = child.CoreWebView2',
            'e.Handled = true',
            '_activeWeb.Visible = false',
            'same dedicated profile',
            'genuine child'
          )) {
            if (-not $ownedHost.Contains($marker)) { throw "D127 v67 owned-host popup semantics guard missing: $marker" }
          }
          if ($ownedHost.Contains('_web.CoreWebView2.Navigate(target.AbsoluteUri)')) {
            throw "D127 v67 host must not convert Dashboard popup into same-tab Navigate()."
          }
          foreach ($retiredDashboardMarker in @(
            'ProbeDashboardAccessAsync',
            'BuildDashboardActivationScript',
            'DASHBOARD_',
            'MuiIconButton',
            'userGesture',
            '_warehouseEntry'
          )) {
            if ($ownedHost.Contains($retiredDashboardMarker)) { throw "D127 v67 retired Dashboard host automation remains: $retiredDashboardMarker" }
          }
          foreach ($retiredBrowserMarker in @(
            'BuildDashboardSft3EntryScript',
            'HY1_SFT3_CLICKED',
            'STRUCTURAL_ARROW_NOT_FOUND',
            '_warehouseEntryTriggered'
          )) {
            if ($browser.Contains($retiredBrowserMarker)) { throw "D127 v67 retired Dashboard controller automation remains: $retiredBrowserMarker" }
          }

          foreach ($forbidden in @(
            'Network.enable',
            'Network.getCookies',
            'Storage.getCookies',
            'Network.requestWillBeSent',
            'api-supra.winmart.vn',
            'confirmSkipItem',
            'APISID',
            'X-Signature',
            'HttpRequestHeader.Authorization',
            'document.cookie',
            'Cursor.Position',
            'SetCursorPos',
            'SendKeys.Send',
            'dialogClose[0].click'
          )) {
            if ($browser.Contains($forbidden)) { throw "D126 browser forbidden path present: $forbidden" }
          }

          foreach ($marker in @(
            'Đăng nhập Supra |',
            'Mở trình duyệt Agent',
            'Mở trình duyệt Desktop',
            'Mở thư mục dữ liệu',
            'Dữ liệu Agent:',
            'QueueAgentDataStorageRefresh',
            'OpenAgentDataFolder',
            'Runtime cài ',
            'Profile/cache ',
            'ResolveActiveBrowserBundleRoot',
            'Web Confirm sẵn sàng',
            'OpenSupraConfirmBrowser',
            'ToggleSupraBrowserVisibility',
            'HasReadyConfirmBrowser',
            'ProcessFirestoreConfirmations',
            'adapter=BROWSER_DOM',
            'VerifyPrimaryBeforeMutation(appSession)',
            'CONFIRM_IN_PROGRESS_OR_UNCERTAIN',
            'MarkLocalConfirmed',
            'ProbeSupraBrowserForTakeover'
          )) {
            if (-not $program.Contains($marker)) { throw "D126 Agent wiring marker missing: $marker" }
          }
          foreach ($forbidden in @(
            'CaptureWmsSession',
            'TryRestoreWmsSessionFileFirst',
            'WmsSessionStore',
            'WmsSessionSnapshot',
            'WmsPicklistConfirmClient',
            'WmsPicklistLookupClient',
            'WmsExactPicklistResolver',
            'WmsSkuCatalogClient',
            'FirestoreSkuSyncClient',
            'RunSkuSync(',
            'api-supra.winmart.vn',
            '--d096-self-test'
          )) {
            if ($program.Contains($forbidden)) { throw "D126 Program retains retired WMS/session path: $forbidden" }
          }

          foreach ($marker in @(
            'HasOperationalReadiness',
            'ReconcileOperationalReadiness',
            'QueueD128BrowserStateRefresh',
            'EnsureD128BrowserReadyPath',
            'SetD128ResourceMonitoringPaused',
            'ApplyD128ResourceMetrics',
            'Picklist nhận:',
            'Picklist xác nhận:',
            'Picklist lỗi:',
            'Cài đặt bảng nổi'
          )) {
            if (-not $program.Contains($marker) -and -not $ops.Contains($marker)) { throw "D128 Agent marker missing: $marker" }
          }
          foreach ($marker in @(
            'OpenAgentBackground',
            'IsAgentOwnedMode',
            'IsDesktopSelected',
            'SampleResourceUsage',
            'CreateToolhelp32Snapshot',
            'ProcessTreeIds',
            'state.LoginMarkerDetected && _hidden',
            'state.Ready && !_hidden'
          )) {
            if (-not $browser.Contains($marker)) { throw "D128 browser marker missing: $marker" }
          }
          if ($program.Contains('_trayStatusItem.Text = metrics.MenuText()')) {
            throw "D128 must not expose CPU/RAM through tray hover/status."
          }

          foreach ($marker in @(
            'Hệ thống Agent |',
            'Đăng nhập Supra |',
            'Xử lý PickList |',
            'VerifyCurrentAgentPasswordForBrowserAction',
            'Mở Web Agent',
            'Tắt Web Agent',
            'Chuyển sang Web Desktop',
            'Chuyển Web chạy nền',
            'Hiện Web'
          )) {
            if (-not $program.Contains($marker)) { throw "D129 compact/exclusive browser UI marker missing: $marker" }
          }
          foreach ($marker in @(
            'HasActiveBrowser',
            'ActiveModeLabel',
            'StopManagedBrowser',
            '_manualVisibilityOverride'
          )) {
            if (-not $browser.Contains($marker)) { throw "D129 browser lifecycle marker missing: $marker" }
          }
          foreach ($marker in @(
            'MinimumSize = new Size(120, 24)',
            'MaximumSize = new Size(7680, 4320)',
            'AutoFitToContent',
            'size_customized',
            'Nguồn xác nhận',
            'Kích User',
            'Liên hệ picker',
            'Auto size cột: Bật',
            'Auto size cột: Tắt'
          )) {
            if (-not $ops.Contains($marker)) { throw "D134 PDA/overlay/UI marker missing: $marker" }
          }
          if ($ops.Contains('_autoSizeColumnsButton')) { throw "D134 Auto size control must exist only in Hệ thống Agent." }
          if ($ops.Contains('PickerDisconnectGraceSeconds') -or $ops.Contains('PDA_GRACE')) {
            throw "D134 must not restore heartbeat/disconnect-grace Picker presence."
          }
          if ($program.Contains('Đăng nhập Supra · v')) { throw "D129 must remove version from the Supra card title." }
          if ($program.Contains('QueueSharedScheduleRefresh')) { throw "D129 must not restore the parallel UI schedule-refresh loop." }
          foreach ($marker in @(
            'ReferenceReadsPerDay = 50000L',
            'ReferenceWritesPerDay = 20000L',
            'ratio >= 70.0',
            'ratio >= 85.0',
            'ratio >= 95.0',
            'reference_only=true provider_poll=false'
          )) {
            if (-not $quota.Contains($marker)) { throw "D129 local quota guard marker missing: $marker" }
          }
          if (-not $http.Contains('FirestoreQuotaGuard.Record(method, url, component, log)')) {
            throw "D129 Firestore transport must feed the local quota guard."
          }
          foreach ($marker in @(
            'relay_poc_coordination/daily_',
            'ReceivedTotal',
            'ConfirmedTotal',
            'ErrorTotal',
            'provider_write=false'
          )) {
            if (-not $fleet.Contains($marker)) { throw "D131 durable fleet-counter marker missing: $marker" }
          }
          if ($transport -notmatch 'PrimaryActivePollIntervalMs\s*=\s*3000' -or
              $transport -notmatch 'PrimaryInactivePollIntervalMs\s*=\s*15000' -or
              $transport -notmatch 'PrimaryHotPollIntervalMs\s*=\s*1000' -or
              $leader -notmatch 'PrimaryLeaseHeartbeatMs\s*=\s*10000' -or
              $leader -notmatch 'FailoverAfterMs\s*=\s*15000') {
            throw "D131 queue/lease/failover cadence regression."
          }

          foreach ($marker in @(
            'DefaultConnectionLimit = Math.Max(ServicePointManager.DefaultConnectionLimit, 16)',
            'FIRESTORE transport supervisor restart=',
            'RefreshD130ResourceClock',
            '_lastD130ResourceSampleUtc'
          )) {
            if (-not $program.Contains($marker) -and -not $ops.Contains($marker)) {
              throw "D130 Agent live-metrics/relay-supervisor marker missing: $marker"
            }
          }
          foreach ($marker in @(
            'retry_ms=',
            '4000',
            '"CONFIRM_QUERY"',
            '2);'
          )) {
            if (-not $transport.Contains($marker)) { throw "D130 bounded confirmation transport marker missing: $marker" }
          }
          if (-not $http.Contains('int safeReadAttempts = 3') -or -not $http.Contains('Math.Max(1, safeReadAttempts)')) {
            throw "D130 safe-read budget control missing."
          }

          foreach ($retiredFile in @(
            'relay-agent/WmsIntegration.cs',
            'relay-agent/WmsSessionStore.cs',
            'relay-agent/WmsPicklistLookup.cs',
            'relay-agent/WmsPicklistExactResolver.cs',
            'relay-agent/WmsPicklistConfirm.cs',
            'relay-agent/WmsSkuCatalog.cs',
            'relay-agent/PicklistCacheCoordinator.cs',
            'relay-agent/FirestoreSkuSync.cs'
          )) {
            if (Test-Path $retiredFile) { throw "D126 retired source still packaged: $retiredFile" }
          }
          if ($config -match 'api-supra\.winmart\.vn|confirmSkipItem|binStocks|sku_sync_jobs') { throw "D126 direct WMS/SKU configuration remains." }
          foreach ($forbidden in @('Cập nhật SKU','RunSkuSync','FirestoreSkuSyncClient','WmsSkuCatalogClient','NextSkuSyncDayUtc')) {
            if ($ops.Contains($forbidden)) { throw "D126 Agent SKU sync must be retired: $forbidden" }
          }
          if ($rules -notmatch 'match /sku_sync_jobs/\{jobId\}' -or $rules -notmatch 'allow read, write: if false;' -or $rules -match 'AGENT_WMS_BINSTOCK_V1') {
            throw "D126 retired sku_sync_jobs must remain deny-all."
          }

          if ($leader -notmatch 'FailoverAfterMs\s*=\s*15000' -or $leader -notmatch 'PrimaryLeaseHeartbeatMs\s*=\s*10000') { throw "D131 HA cadence regression." }
          foreach ($marker in @('PRIMARY','NEXT_A','NEXT_B','DEEP_HIBERNATE','PromoteStandbyForTakeover','VerifyPrimaryBeforeMutation','PublishScheduleDecision','PublishEarlyStartAndClaimPrimary','ANY_AUTHENTICATED_AGENT')) {
            if (-not $leader.Contains($marker)) { throw "Protected D131 HA/schedule marker missing: $marker" }
          }
          if ($transport -notmatch 'PrimaryActivePollIntervalMs\s*=\s*3000' -or $transport -notmatch 'PrimaryInactivePollIntervalMs\s*=\s*15000' -or $transport -notmatch 'PrimaryHotPollIntervalMs\s*=\s*1000' -or $transport -notmatch 'StandbyPollIntervalMs\s*=\s*0' -or $transport -notmatch 'MaxConcurrentJobs\s*=\s*15') {
            throw "D160 bounded Firestore cadence/batch regression."
          }
          if ($transport -match 'PROCESSING|TryClaim' -or -not $transport.Contains('CONFIRM_ACK_VERIFY')) { throw "Firestore direct-ACK guard regression." }
          foreach ($marker in @('MaxPendingAgeMs = 20000L','GREATER_THAN_OR_EQUAL','QUERY_FRESH_ONLY','stale_list_fallback=false','CONFIRM_ACK_DURABLE_COMMIT','business_day','terminal_duration_ms')) {
            if (-not $transport.Contains($marker)) { throw "D131 queue/audit guard missing: $marker" }
          }
          if ($transport.Contains('?pageSize=' + 'MaxDocumentsPerPoll')) { throw "D127 unsafe stale list fallback returned." }
          foreach ($marker in @('relay_poc_confirm_guards','OriginalJobProvesConfirmed','MarkLocalConfirmed')) {
            if (-not $confirmGuard.Contains($marker)) { throw "Confirmation idempotency marker missing: $marker" }
          }
          if ($rate -notmatch 'StrikeWindowMs\s*=\s*60L\s*\*\s*1000L' -or -not $rate.Contains('return 5;') -or -not $rate.Contains('return 30;') -or -not $rate.Contains('return 60;')) { throw "PDA anti-spam regression." }
          if (-not $http.Contains('WebRequest.DefaultWebProxy') -or -not $http.Contains('WebRequest.GetSystemWebProxy') -or $http.Contains('CorporateProxyFallback')) { throw "Firestore Windows proxy route regression." }
