name: Verify Beta Relay Agent

on:
  pull_request:
    paths:
      - "relay-agent/**"
      - "firebase/database.rules.json"
      - ".github/workflows/verify-relay-agent.yml"
  push:
    branches: [main]
    paths:
      - "relay-agent/**"
      - "firebase/database.rules.json"
      - ".github/workflows/verify-relay-agent.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay-agent:
    runs-on: windows-latest
    environment: beta
    env:
      FIREBASE_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Validate Agent build channel
        shell: pwsh
        run: |
          $version = (Get-Content relay-agent/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+$') { throw "relay-agent/VERSION must be an integer." }
          $config = Get-Content relay-agent/AgentConfig.cs -Raw
          if ($config -notmatch "AgentBuild\s*=\s*$version\s*;") {
            throw "AgentConfig.AgentBuild does not match relay-agent/VERSION=$version"
          }

      - name: D089 relay regression guard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content relay-agent/AgentConfig.cs -Raw
          $program = Get-Content relay-agent/Program.cs -Raw
          $leader = Get-Content relay-agent/AgentLeaderCoordinator.cs -Raw
          $cache = Get-Content relay-agent/PicklistCacheCoordinator.cs -Raw
          $rate = Get-Content relay-agent/PickerRateLimiter.cs -Raw
          $startup = Get-Content relay-agent/UserStartupRegistration.cs -Raw
          $overlay = Get-Content relay-agent/StatusOverlay.cs -Raw
          $sessionStore = Get-Content relay-agent/WmsSessionStore.cs -Raw
          $exitAuth = Get-Content relay-agent/ExitAuthorization.cs -Raw
          $runtimeGuard = Get-Content relay-agent/AgentRuntimeGuard.cs -Raw
          $lookup = Get-Content relay-agent/WmsPicklistLookup.cs -Raw
          $wms = Get-Content relay-agent/WmsIntegration.cs -Raw
          $rules = Get-Content firebase/database.rules.json -Raw
          $overlaySettings = Get-Content relay-agent/OverlaySettingsForm.cs -Raw
          $project = Get-Content relay-agent/SupraInventoryRelayAgent.csproj -Raw
          $iconScript = Get-Content relay-agent/GenerateIcon.ps1 -Raw

          if ($config -notmatch 'AgentBuild\s*=\s*15\s*;') { throw "D089 requires Agent v15." }
          if ($leader -notmatch 'HeartbeatIntervalMs\s*=\s*3000' -or $leader -notmatch 'FailoverAfterMs\s*=\s*10000') { throw "D085 HA timing guard failed." }
          if ($leader -notmatch 'HttpRequestHeader\.IfMatch') { throw "D085 leader election must use conditional ETag writes." }
          if ($cache -notmatch 'FreshMissGuardSeconds\s*=\s*10' -or $cache -notmatch 'JOIN_INFLIGHT' -or $cache -notmatch 'LoadSnapshot') { throw "D085 Picklist cache/single-flight guard failed." }
          if ($rate -notmatch 'StrikeWindowMs\s*=\s*60L\s*\*\s*1000L' -or $rate -notmatch 'ResetEscalationAfterMs\s*=\s*24L') { throw "D085 anti-spam timing guard failed." }
          if ($rate -notmatch 'return 5;' -or $rate -notmatch 'return 30;' -or $rate -notmatch 'return 60;') { throw "D085 5/30/60 lock escalation guard failed." }
          if ($startup -notmatch 'Registry\.CurrentUser' -or $startup -notmatch 'CurrentVersion\\Run' -or $startup -notmatch 'admin_required=false') { throw "D085 per-user autostart guard failed." }
          if ($program -notmatch 'Đăng nhập hệ thống Supra' -or $program -notmatch 'TryRestoreWmsSessionFileFirst' -or $program -notmatch '_leaderCoordinator\.IsLeader') { throw "D086 Agent UI/session/leader wiring guard failed." }
          if ($program -notmatch 'ControlBox\s*=\s*false' -or $program -notmatch 'RequestProtectedExit' -or $program -notmatch 'Interval\s*=\s*60000') { throw "D086 persistent/protected/low-frequency shell guard failed." }
          if ($sessionStore -notmatch 'ProtectedData\.Protect' -or $sessionStore -notmatch 'DataProtectionScope\.CurrentUser' -or $sessionStore -notmatch 'ProtectedData\.Unprotect') { throw "D086 WMS session file must be DPAPI CurrentUser protected." }
          if ($exitAuth -notmatch 'Rfc2898DeriveBytes' -or $exitAuth -notmatch 'ProtectedData\.Protect') { throw "D086 protected exit verifier guard failed." }
          if ($runtimeGuard -notmatch '--watchdog' -or $runtimeGuard -notmatch 'WaitForExit' -or $runtimeGuard -notmatch '--watchdog-restart') { throw "D086 runtime watchdog guard failed." }
          if ($overlay -notmatch 'WsExTransparent' -or $overlay -notmatch 'SetExtendedStyle' -or $overlay -notmatch 'WmNcHitTest') { throw "D086 locked overlay must use true cross-process click-through." }
          if ($overlay -notmatch '_settings != null' -or $overlay -notmatch 'UpdateMetrics') { throw "D087 overlay null-safe/two-layer guard failed." }
          if ($program -notmatch 'WriteAudit' -or $program -notmatch 'pda-agent-audit-' -or $program -notmatch 'technical-ai-' -or $program -notmatch 'picklist_last5') { throw "D087 split sanitized logging guard failed." }
          if ($program -notmatch 'FormBorderStyle\.None' -or $program -notmatch 'MinimizeToTray' -or $program -notmatch 'ShowInTaskbar\s*=\s*false') { throw "D088 tray-only minimize guard failed." }
          if ($program -notmatch 'MainInstanceMutexName' -or $program -notmatch 'EventWaitHandle\.OpenExisting' -or $program -notmatch 'ListenForSecondLaunch') { throw "D089 single-instance activation guard failed." }
          if ($program -notmatch '"client_type", "AGENT"' -or $config -notmatch 'Agent\.Auto\.Confirm\.Pick\.Pack\.exe') { throw "D088 Agent identity/channel guard failed." }
          if ($overlay -notmatch 'SetOverlaySize' -or $overlay -notmatch 'BackgroundArgb' -or $overlay -notmatch 'TextArgb' -or $overlay -notmatch 'HtBottomRight') { throw "D088 overlay resize/color persistence guard failed." }
          if ($overlay -notmatch 'ShowCpu' -or $overlay -notmatch 'ShowMemory' -or $overlay -notmatch 'ShowAgentOnline' -or $overlay -notmatch 'ShowWmsSession') { throw "D089 granular overlay persistence guard failed." }
          if ($overlaySettings -notmatch 'ColorDialog' -or $overlaySettings -notmatch 'NumericUpDown' -or $overlaySettings -notmatch 'Bật hiển thị Overlay' -or $overlaySettings -notmatch 'Thông tin Laptop' -or $overlaySettings -notmatch 'Thông tin Agent') { throw "D089 professional overlay checklist UI guard failed." }
          if ($project -notmatch '<AssemblyName>Agent Auto Confirm Pick Pack</AssemblyName>' -or $project -notmatch '<ApplicationIcon>app.ico</ApplicationIcon>') { throw "D088 EXE name/icon guard failed." }
          if ($iconScript -notmatch 'app-icon\.png' -or $iconScript -notmatch 'HighQualityBicubic') { throw "D089 approved Agent icon source guard failed." }
          if (-not (Test-Path "relay-agent/app-icon.png")) { throw "D089 approved Agent icon asset missing." }
          if ($leader -notmatch 'PresenceHeartbeatIntervalMs\s*=\s*30000' -or $leader -notmatch 'PresenceReadIntervalMs\s*=\s*60000' -or $leader -notmatch 'PresenceFreshMs\s*=\s*90000') { throw "D087 Agent presence cadence guard failed." }
          if ($rules -notmatch 'coordination' -or $rules -notmatch 'rate_limits' -or $rules -notmatch 'PICKER_LOCKED' -or $rules -notmatch 'SWITCHING') { throw "D085 RTDB Rules guard failed." }

          foreach ($source in @($lookup, $wms)) {
            if ($source -match 'request\.Method\s*=\s*"(POST|PUT|PATCH|DELETE)"') {
              throw "WMS mutation method found; D085 remains read-only."
            }
          }
          Write-Host "D089 relay regression guard PASS"

      - name: Prepare Beta Agent config
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${env:FIREBASE_API_KEY_BETA}")) { throw "FIREBASE_WEB_API_KEY_BETA is required." }
          $path = "relay-agent/AgentConfig.cs"
          $content = Get-Content $path -Raw
          $content = $content.Replace("__FIREBASE_API_KEY_BETA__", "${env:FIREBASE_API_KEY_BETA}")
          Set-Content -Path $path -Value $content -Encoding UTF8

      - name: Build lightweight Windows Agent
        shell: pwsh
        run: |
          dotnet build relay-agent/SupraInventoryRelayAgent.csproj -c Release
          $exe = (Resolve-Path "relay-agent/bin/Release/net48/Agent Auto Confirm Pick Pack.exe").Path
          $smoke = Start-Process -FilePath $exe -ArgumentList "--startup-smoke" -PassThru
          if (-not $smoke.WaitForExit(15000)) {
            try { $smoke.Kill() } catch {}
            throw "Agent startup smoke timed out."
          }
          if ($smoke.ExitCode -ne 0) {
            throw "Agent startup smoke failed with exit code $($smoke.ExitCode)."
          }
          Write-Host "Agent startup smoke PASS"
          New-Item -ItemType Directory -Force -Path relay-agent/dist | Out-Null
          $primary = "relay-agent/dist/Agent Auto Confirm Pick Pack.exe"
          $legacy = "relay-agent/dist/SUPRA-Inventory-Relay-Test.exe"
          Copy-Item $exe $primary
          # Compatibility alias lets v12 update directly while v14 updater uses GitHub-normalized dotted asset names.
          Copy-Item $exe $legacy
          Copy-Item relay-agent/README.md relay-agent/dist/
          Copy-Item firebase/database.rules.json relay-agent/dist/
          (Get-FileHash $primary -Algorithm SHA256).Hash.ToLower() | Set-Content "relay-agent/dist/Agent Auto Confirm Pick Pack.exe.sha256"
          (Get-FileHash $legacy -Algorithm SHA256).Hash.ToLower() | Set-Content "relay-agent/dist/SUPRA-Inventory-Relay-Test.exe.sha256"

      - name: Upload Agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: supra-inventory-relay-poc-agent
          path: relay-agent/dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish dedicated Agent prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content relay-agent/VERSION -Raw).Trim()
          $tag = "relay-agent-v$version"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Agent release $tag already exists. Increment relay-agent/VERSION before publishing another Agent binary."
          }
          gh release create $tag `
            "relay-agent/dist/Agent Auto Confirm Pick Pack.exe#Agent Auto Confirm Pick Pack.exe" `
            "relay-agent/dist/Agent Auto Confirm Pick Pack.exe.sha256#Agent Auto Confirm Pick Pack.exe.sha256" `
            "relay-agent/dist/SUPRA-Inventory-Relay-Test.exe#SUPRA-Inventory-Relay-Test.exe" `
            "relay-agent/dist/SUPRA-Inventory-Relay-Test.exe.sha256#SUPRA-Inventory-Relay-Test.exe.sha256" `
            "relay-agent/dist/README.md#README.md" `
            --repo "${{ github.repository }}" `
            --title "Agent Auto Confirm Pick Pack v$version" `
            --notes "Beta Agent for Pick Pack / Inventory relay. Canonical executable: Agent Auto Confirm Pick Pack.exe. Legacy alias retained for pre-D088 updater compatibility; GitHub normalizes the canonical release asset filename to dots. WMS remains read-only." `
            --prerelease
