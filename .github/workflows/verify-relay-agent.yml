name: Verify Beta Relay Agent

on:
  pull_request:
    paths:
      - "relay-agent/**"
      - "relay-agent-webview2-host/**"
      - "firebase/database.rules.json"
      - "firebase/firestore.rules"
      - "firebase/firestore.indexes.json"
      - ".github/workflows/verify-relay-agent.yml"
  push:
    branches: [main]
    paths:
      - "relay-agent/**"
      - "relay-agent-webview2-host/**"
      - "firebase/database.rules.json"
      - "firebase/firestore.rules"
      - "firebase/firestore.indexes.json"
      - ".github/workflows/verify-relay-agent.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay-agent:
    runs-on: windows-latest
    environment: beta
    env:
      FIREBASE_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Validate Agent build channel
        shell: pwsh
        run: |
          $version = (Get-Content relay-agent/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+$') { throw "relay-agent/VERSION must be an integer." }
          $config = Get-Content relay-agent/AgentConfig.cs -Raw
          if ($config -notmatch "AgentBuild\s*=\s*$version\s*;") {
            throw "AgentConfig.AgentBuild does not match relay-agent/VERSION=$version"
          }

      - name: D126 browser UI confirmation and protected regression guard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content relay-agent/AgentConfig.cs -Raw
          $program = Get-Content relay-agent/Program.cs -Raw
          $browser = Get-Content relay-agent/SupraConfirmBrowser.cs -Raw
          $startup = Get-Content relay-agent/UserStartupRegistration.cs -Raw
          $exitAuth = Get-Content relay-agent/ExitAuthorization.cs -Raw
          $runtimeGuard = Get-Content relay-agent/AgentRuntimeGuard.cs -Raw
          $updater = Get-Content relay-agent/AgentUpdater.cs -Raw
          $transport = Get-Content relay-agent/FirestoreConfirmationTransport.cs -Raw
          $http = Get-Content relay-agent/FirestoreHttpTransport.cs -Raw
          $leader = Get-Content relay-agent/FirestoreAgentLeaderCoordinator.cs -Raw
          $rate = Get-Content relay-agent/FirestorePickerRateLimiter.cs -Raw
          $confirmGuard = Get-Content relay-agent/FirestoreConfirmationGuard.cs -Raw
          $rules = Get-Content firebase/firestore.rules -Raw
          $indexes = Get-Content firebase/firestore.indexes.json -Raw
          $ops = Get-Content relay-agent/D119AgentFeatures.cs -Raw
          $presence = Get-Content relay-agent/FirestorePickerPresence.cs -Raw
          $contact = Get-Content relay-agent/FirestorePickerContact.cs -Raw
          $fleet = Get-Content relay-agent/FirestoreFleetMetrics.cs -Raw
          $project = Get-Content relay-agent/SupraInventoryRelayAgent.csproj -Raw
          $browserBundle = Get-Content relay-agent/AgentBrowserBundle.cs -Raw
          $ownedHost = Get-Content relay-agent-webview2-host/Program.cs -Raw
          $projection = Get-Content service/src/firestore-projection.ts -Raw

          if ($config -notmatch 'AgentBuild\s*=\s*56\s*;') { throw "D127 hotfix requires Agent v56." }
          if ($project -notmatch '<AssemblyVersion>0\.56\.0\.0</AssemblyVersion>' -or $project -notmatch '<FileVersion>0\.56\.0\.0</FileVersion>') {
            throw "D127 hotfix assembly/file version must be 0.56."
          }

          foreach ($marker in @(
            'Runtime.enable',
            'Page.enable',
            'private const string SearchText = "Tìm kiếm"',
            'private const string ConfirmText = "Xác nhận lấy lại hàng"',
            '^PL[0-9]+$',
            "tr,[role=row]",
            'input[type=checkbox]',
            'CHECKBOX_NOT_UNIQUE',
            'CHECKBOX_VERIFY_FAILED',
            'CONFIRM_BUTTON_NOT_UNIQUE',
            'ROW_AMBIGUOUS',
            'ClickExactButtonNoLock(SearchText)',
            'SW_HIDE',
            'SW_RESTORE',
            'SetBrowserWindowsVisibleNoLock',
            'CONFIRM_DOM_PARTIAL',
            'ConfirmVisibleCount',
            '[role=grid]',
            'a,[role=button]',
            'await new Promise',
            'TryReconnectNoLock',
            'StopManagedBrowserNoLock',
            "getAttribute('aria-label')",
            "getAttribute('title')",
            "querySelectorAll('body *')",
            'decorationOnly',
            'searchDecoratedCount',
            "search|magnify|magnifying|glass|find|icon",
            'private const string ConfirmDialogTitle = "XÁC NHẬN LẤY LẠI HÀNG"',
            'private const string ConfirmDialogBody = "Bạn có chắc chắn cho phép lấy hàng lại không?"',
            'private const string ConfirmDialogButtonText = "Xác nhận"',
            'private const string ConfirmDialogCloseText = "Đóng"',
            'CONFIRM_DIALOG_NOT_FOUND',
            'CONFIRM_DIALOG_AMBIGUOUS',
            'CONFIRM_DIALOG_BUTTON_NOT_UNIQUE',
            'CONFIRM_DIALOG_CLOSE_NOT_UNIQUE',
            "stage:'DIALOG_CONFIRMED'",
            'dialog_required=true',
            'private const string PageSizeLabel = "Số dòng mỗi trang"',
            'private const string PageSizeTarget = "100"',
            'EnsurePageSize100NoLock',
            'PAGE_SIZE_100_VERIFY_FAILED',
            'UnselectableFragments',
            'StartOwnedWebView2NoLock',
            'StartLegacyBrowserNoLock',
            'OpenOrShowAgent',
            'OpenOrShowDesktop',
            'owned_webview2=FAILED',
            'auto_fallback=false',
            'PAGE_SIZE_CONTROL_NOT_FOUND',
            'BuildDashboardSft3EntryScript',
            'HY1_SFT3_CLICKED',
            'CONFIRM_NAVIGATE_SAME_TAB',
            'AUTO_RECOVERING_CONFIRM',
            "leafMatches('kho hưng yên 1')",
            "leafMatches('sft3')",
            'inside(center(ar), rect, 18)',
            'right-most action in this card wins naturally'
          )) {
            if (-not $browser.Contains($marker)) { throw "D126 browser semantic guard missing: $marker" }
          }
          if (-not $browser.Contains("names(e).some(v => fold(v) === fold('Xác nhận lấy lại hàng'))")) { throw "D126 H3 readiness confirm control must remain exact-label only." }
          foreach ($marker in @(
            'RequiredHostBuild = 4',
            'RequiredHostArch = "x64"',
            'host-build.txt',
            'host-arch.txt',
            'WebView2Loader.dll'
          )) {
            if (-not $browserBundle.Contains($marker)) { throw "D127 v54 browser bundle freshness guard missing: $marker" }
          }
          foreach ($marker in @(
            'Environment.Is64BitProcess',
            'CoreWebView2Environment.SetLoaderDllFolderPath(loaderFolder)',
            'loader", "x64"',
            'WebView2Loader.dll',
            'NewWindowRequested += HandleNewWindowRequested',
            'e.Handled = true',
            '_web.CoreWebView2.Navigate(target.AbsoluteUri)'
          )) {
            if (-not $ownedHost.Contains($marker)) { throw "D127 v55 owned-host routing guard missing: $marker" }
          }

          foreach ($forbidden in @(
            'Network.enable',
            'Network.getCookies',
            'Storage.getCookies',
            'Network.requestWillBeSent',
            'api-supra.winmart.vn',
            'confirmSkipItem',
            'APISID',
            'X-Signature',
            'HttpRequestHeader.Authorization',
            'document.cookie',
            'Cursor.Position',
            'SetCursorPos',
            'SendKeys.Send',
            'dialogClose[0].click'
          )) {
            if ($browser.Contains($forbidden)) { throw "D126 browser forbidden path present: $forbidden" }
          }

          foreach ($marker in @(
            'Mở trình duyệt Agent',
            'Mở trình duyệt Desktop',
            'Web Confirm sẵn sàng',
            'OpenSupraConfirmBrowser',
            'ToggleSupraBrowserVisibility',
            'HasReadyConfirmBrowser',
            'ProcessFirestoreConfirmations',
            'adapter=BROWSER_DOM',
            'VerifyPrimaryBeforeMutation(appSession)',
            'CONFIRM_IN_PROGRESS_OR_UNCERTAIN',
            'MarkLocalConfirmed',
            'ProbeSupraBrowserForTakeover'
          )) {
            if (-not $program.Contains($marker)) { throw "D126 Agent wiring marker missing: $marker" }
          }
          foreach ($forbidden in @(
            'CaptureWmsSession',
            'TryRestoreWmsSessionFileFirst',
            'WmsSessionStore',
            'WmsSessionSnapshot',
            'WmsPicklistConfirmClient',
            'WmsPicklistLookupClient',
            'WmsExactPicklistResolver',
            'WmsSkuCatalogClient',
            'FirestoreSkuSyncClient',
            'RunSkuSync(',
            'api-supra.winmart.vn',
            '--d096-self-test'
          )) {
            if ($program.Contains($forbidden)) { throw "D126 Program retains retired WMS/session path: $forbidden" }
          }

          foreach ($retiredFile in @(
            'relay-agent/WmsIntegration.cs',
            'relay-agent/WmsSessionStore.cs',
            'relay-agent/WmsPicklistLookup.cs',
            'relay-agent/WmsPicklistExactResolver.cs',
            'relay-agent/WmsPicklistConfirm.cs',
            'relay-agent/WmsSkuCatalog.cs',
            'relay-agent/PicklistCacheCoordinator.cs',
            'relay-agent/FirestoreSkuSync.cs'
          )) {
            if (Test-Path $retiredFile) { throw "D126 retired source still packaged: $retiredFile" }
          }
          if ($config -match 'api-supra\.winmart\.vn|confirmSkipItem|binStocks|sku_sync_jobs') { throw "D126 direct WMS/SKU configuration remains." }
          foreach ($forbidden in @('Cập nhật SKU','RunSkuSync','FirestoreSkuSyncClient','WmsSkuCatalogClient','NextSkuSyncDayUtc')) {
            if ($ops.Contains($forbidden)) { throw "D126 Agent SKU sync must be retired: $forbidden" }
          }
          if ($rules -notmatch 'match /sku_sync_jobs/\{jobId\}' -or $rules -notmatch 'allow read, write: if false;' -or $rules -match 'AGENT_WMS_BINSTOCK_V1') {
            throw "D126 retired sku_sync_jobs must remain deny-all."
          }

          if ($leader -notmatch 'FailoverAfterMs\s*=\s*10000' -or $leader -notmatch 'PrimaryLeaseHeartbeatMs\s*=\s*7000') { throw "D117 HA cadence regression." }
          foreach ($marker in @('PRIMARY','STANDBY','FROZEN','PromoteStandbyForTakeover','VerifyPrimaryBeforeMutation','PublishScheduleDecision','PublishEarlyStartAndClaimPrimary','ANY_AUTHENTICATED_AGENT')) {
            if (-not $leader.Contains($marker)) { throw "Protected HA/schedule marker missing: $marker" }
          }
          if ($transport -notmatch 'PrimaryIdlePollIntervalMs\s*=\s*4000' -or $transport -notmatch 'PrimaryHotPollIntervalMs\s*=\s*2000' -or $transport -notmatch 'StandbyPollIntervalMs\s*=\s*0' -or $transport -notmatch 'MaxConcurrentJobs\s*=\s*12') {
            throw "D117 bounded Firestore cadence regression."
          }
          if ($transport -match 'PROCESSING|TryClaim' -or -not $transport.Contains('CONFIRM_ACK_VERIFY')) { throw "Firestore direct-ACK guard regression." }
          foreach ($marker in @('MaxPendingAgeMs = 20000L','GREATER_THAN_OR_EQUAL','QUERY_FRESH_ONLY','stale_list_fallback=false','ANDROID_PRESENCE_V1','picker_presence_current')) {
            if (-not $transport.Contains($marker)) { throw "D127 quota/event queue guard missing: $marker" }
          }
          if ($transport.Contains('?pageSize=' + 'MaxDocumentsPerPoll')) { throw "D127 unsafe stale list fallback returned." }
          foreach ($marker in @('relay_poc_confirm_guards','OriginalJobProvesConfirmed','MarkLocalConfirmed')) {
            if (-not $confirmGuard.Contains($marker)) { throw "Confirmation idempotency marker missing: $marker" }
          }
          if ($rate -notmatch 'StrikeWindowMs\s*=\s*60L\s*\*\s*1000L' -or -not $rate.Contains('return 5;') -or -not $rate.Contains('return 30;') -or -not $rate.Contains('return 60;')) { throw "PDA anti-spam regression." }
          if (-not $http.Contains('WebRequest.DefaultWebProxy') -or -not $http.Contains('WebRequest.GetSystemWebProxy') -or $http.Contains('CorporateProxyFallback')) { throw "Firestore Windows proxy route regression." }
          foreach ($marker in @('relay_poc_jobs','ANDROID_CONFIRM_V1','relay_poc_rate_limits','relay_poc_coordination','relay_poc_agents','relay_poc_confirm_guards','relay_agent_log_uploads','picker_alerts')) {
            if (-not $rules.Contains($marker)) { throw "Protected Firestore rule marker missing: $marker" }
          }
          if ($rules.Contains("status == 'PROCESSING'")) { throw "Firestore Rules must not reintroduce PROCESSING." }
          if (-not $indexes.Contains('relay_poc_jobs') -or -not $indexes.Contains('created_at') -or -not $indexes.Contains('ASCENDING')) { throw "Pending queue index regression." }

          if (-not $startup.Contains('Registry.CurrentUser') -or -not $startup.Contains('CurrentVersion\Run')) { throw "Per-user autostart regression." }
          if (-not $exitAuth.Contains('Rfc2898DeriveBytes') -or -not $exitAuth.Contains('ProtectedData.Protect')) { throw "Protected Agent exit regression." }
          if (-not $runtimeGuard.Contains('--watchdog') -or -not $runtimeGuard.Contains('WaitForExit')) { throw "Runtime watchdog regression." }
          if (-not $program.Contains('identitytoolkit.googleapis.com/v1/accounts:signInWithPassword') -or -not $program.Contains('PICKPACK_ADMIN') -or -not $program.Contains('FirestoreAgentSessionGate')) { throw "Agent Firebase identity/RBAC regression." }
          if (-not $program.Contains('DataGridViewButtonColumn') -or -not $program.Contains('ConfirmManualPicklist(code)')) { throw "Manual row-confirm UI regression." }
          if (-not $program.Contains('CheckAfterHoursSchedule') -or -not $program.Contains('StartRelayBeforeSix') -or -not $program.Contains('ProbeSupraBrowserForTakeover')) { throw "D126 schedule/browser takeover wiring missing." }
          if (-not $program.Contains('30 * 60 * 1000') -or -not $updater.Contains('AgentUpdateManifestUrl')) { throw "Agent update cadence regression." }
          if ($program -match 'Bảng nổi|StatusOverlay|OverlaySettings' -or (Test-Path 'relay-agent/StatusOverlay.cs') -or (Test-Path 'relay-agent/OverlaySettingsForm.cs')) { throw "D124 Overlay must remain removed." }
          if (-not $ops.Contains('_agentRequestMetrics') -or -not $ops.Contains('Picker đang hoạt động trên PDA')) { throw "D124/D120 operational UI regression." }
          if (-not $ops.Contains('LoadOpen') -or -not $contact.Contains('CALL_SPECIALIST') -or -not $contact.Contains('BRING_TO_PACK')) { throw "Picker contact regression." }
          if (-not $contact.Contains('picker-contact-open-query') -or $contact.Contains('/picker_alerts?pageSize=100')) { throw "D127 Picker alert query must remain server-filtered." }
          if (-not $presence.Contains('schemaVersion != 3') -or -not $presence.Contains('ACTIVE_ANDROID_EVENT_DRIVEN')) { throw "D127 Picker presence schema regression." }
          if (-not $projection.Contains('ANDROID_PRESENCE_V1') -or -not $projection.Contains('picker_presence_current') -or -not $projection.Contains('ACTIVE_ANDROID_EVENT_DRIVEN')) { throw "D127 event-driven Picker projection missing." }
          if ($ops.Contains('TimeSpan.FromSeconds(15)')) { throw "D127 periodic 15-second Picker presence read returned." }
          foreach ($marker in @('PickerDisconnectGraceSeconds = 180','RefreshPickerWindowBoundary','05:00–23:00','ApplyEventDrivenPickerPresence')) {
            if (-not $ops.Contains($marker)) { throw "D127 Picker presence quota guard missing: $marker" }
          }
          if (-not $ops.Contains('TimeSpan.FromMinutes(30)') -or -not $fleet.Contains('relay_poc_jobs')) { throw "Fleet metric quota regression." }
          foreach ($marker in @('Microsoft.Web.WebView2','CoreWebView2Environment.CreateAsync','IsPasswordAutosaveEnabled','--remote-debugging-port')) {
            if (-not $ownedHost.Contains($marker)) { throw "D127 owned WebView2 host marker missing: $marker" }
          }
          foreach ($marker in @('AgentBrowserBundleManifestUrl','AgentBrowserBundleUrl','TryGetReady','sha256','inventory-beta.supra.cc.cd')) {
            if (-not $browserBundle.Contains($marker) -and -not $config.Contains($marker)) { throw "D127 browser bundle channel marker missing: $marker" }
          }
          foreach ($marker in @('SnapshotStatus','Downloading','Percent','Trình duyệt Agent khả dụng','Tải trình duyệt thất bại')) {
            if (-not $browserBundle.Contains($marker) -and -not $program.Contains($marker)) { throw "D127 hotfix browser progress marker missing: $marker" }
          }
          foreach ($marker in @('const int panelTop = 142','const int panelHeight = 88','_afterHoursPanel.BringToFront()','Tải trình duyệt Agent','Mở trình duyệt Agent','Mở trình duyệt Desktop')) {
            if (-not $program.Contains($marker)) { throw "D127 hotfix UI layout marker missing: $marker" }
          }
          if ($browser.Contains('fallback=system_browser') -or $browser.Contains('fallback=armed')) {
            throw "D127 v53 must not auto-fallback from Agent browser to Desktop browser."
          }

          Write-Host "D127 v56 geometric HY1/SFT3 arrow selector + same-tab recovery + page-size guards PASS"

      - name: Prepare Beta Agent config
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${env:FIREBASE_API_KEY_BETA}")) { throw "FIREBASE_WEB_API_KEY_BETA is required." }
          $path = "relay-agent/AgentConfig.cs"
          $content = Get-Content $path -Raw
          $content = $content.Replace("__FIREBASE_API_KEY_BETA__", "${env:FIREBASE_API_KEY_BETA}")
          Set-Content -Path $path -Value $content -Encoding UTF8

      - name: Build Agent-owned WebView2 host
        shell: pwsh
        run: |
          dotnet build relay-agent-webview2-host/SupraInventoryWebView2Host.csproj -c Release -p:PlatformTarget=x64
          $hostExe = "relay-agent-webview2-host/bin/Release/net48/SUPRA.Inventory.WebView2Host.exe"
          $hostProject = Get-Content relay-agent-webview2-host/SupraInventoryWebView2Host.csproj -Raw
          if ($hostProject -notmatch '<PlatformTarget>x64</PlatformTarget>' -or $hostProject -notmatch '<Prefer32Bit>false</Prefer32Bit>') {
            throw "Agent WebView2 host must be x64 because the published Fixed Runtime is x64."
          }
          if (-not (Test-Path $hostExe)) { throw "Agent WebView2 host build output missing." }
          $loaderX64 = Get-ChildItem "relay-agent-webview2-host/bin/Release/net48" -Recurse -Filter "WebView2Loader.dll" |
            Where-Object { $_.FullName -match 'runtimes[\\/]win-x64[\\/]native[\\/]WebView2Loader\.dll$' } |
            Select-Object -First 1
          if ($null -eq $loaderX64) { throw "WebView2Loader x64 was not produced by the WebView2 SDK build." }
          Write-Host "Agent-owned WebView2 host build PASS loader=$($loaderX64.FullName)"

      - name: Build lightweight Windows Agent
        shell: pwsh
        run: |
          dotnet build relay-agent/SupraInventoryRelayAgent.csproj -c Release
          $exe = (Resolve-Path "relay-agent/bin/Release/net48/Agent Auto Confirm Pick Pack.exe").Path
          $smoke = Start-Process -FilePath $exe -ArgumentList "--startup-smoke" -PassThru
          if (-not $smoke.WaitForExit(15000)) {
            try { $smoke.Kill() } catch {}
            throw "Agent startup smoke timed out."
          }
          if ($smoke.ExitCode -ne 0) {
            throw "Agent startup smoke failed with exit code $($smoke.ExitCode)."
          }
          Write-Host "Agent startup smoke PASS"
          New-Item -ItemType Directory -Force -Path relay-agent/dist | Out-Null
          $primary = "relay-agent/dist/Agent Auto Confirm Pick Pack.exe"
          $legacy = "relay-agent/dist/SUPRA-Inventory-Relay-Test.exe"
          Copy-Item $exe $primary
          # Compatibility alias lets v12 update directly while v14 updater uses GitHub-normalized dotted asset names.
          Copy-Item $exe $legacy
          Copy-Item relay-agent/README.md relay-agent/dist/
          Copy-Item firebase/database.rules.json relay-agent/dist/
          (Get-FileHash $primary -Algorithm SHA256).Hash.ToLower() | Set-Content "relay-agent/dist/Agent Auto Confirm Pick Pack.exe.sha256"
          (Get-FileHash $legacy -Algorithm SHA256).Hash.ToLower() | Set-Content "relay-agent/dist/SUPRA-Inventory-Relay-Test.exe.sha256"

      - name: D102 night schedule regression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "relay-agent/bin/Release/net48/Agent Auto Confirm Pick Pack.exe").Path
          $selfTest = Start-Process -FilePath $exe -ArgumentList "--d102-self-test" -PassThru -Wait
          if ($selfTest.ExitCode -ne 0) {
            throw "D102 in-process night schedule regression failed with exit code $($selfTest.ExitCode)."
          }
          Write-Host "D102 night schedule regression PASS"

      - name: Upload Agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: supra-inventory-relay-poc-agent
          path: relay-agent/dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Resolve official Fixed WebView2 package
        shell: pwsh
        run: |
          npm install --no-save playwright-core@1.55.0
          node tools/d127_resolve_webview2_fixed.js latest

      - name: Publish dedicated Agent prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content relay-agent/VERSION -Raw).Trim()
          $tag = "relay-agent-v$version"
          $primary = "relay-agent/dist/Agent Auto Confirm Pick Pack.exe"
          $primarySha = "relay-agent/dist/Agent Auto Confirm Pick Pack.exe.sha256"
          $releaseSource = $env:GITHUB_SHA
          $channelSourceExe = $primary
          $channelSourceSha = $primarySha

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            $releaseSource = (gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --jq '.object.sha').Trim()
            if ([string]::IsNullOrWhiteSpace($releaseSource)) {
              throw "Agent release $tag exists but its tag source cannot be resolved."
            }

            $releaseCommitTree = (gh api "repos/${{ github.repository }}/git/commits/$releaseSource" --jq '.tree.sha').Trim()
            $currentCommitTree = (gh api "repos/${{ github.repository }}/git/commits/$env:GITHUB_SHA" --jq '.tree.sha').Trim()
            $releaseAgentTree = (gh api "repos/${{ github.repository }}/git/trees/$releaseCommitTree" --jq '.tree[] | select(.path=="relay-agent") | .sha').Trim()
            $currentAgentTree = (gh api "repos/${{ github.repository }}/git/trees/$currentCommitTree" --jq '.tree[] | select(.path=="relay-agent") | .sha').Trim()
            if ([string]::IsNullOrWhiteSpace($releaseAgentTree) -or [string]::IsNullOrWhiteSpace($currentAgentTree)) {
              throw "Unable to resolve relay-agent tree for existing release verification."
            }
            if ($releaseAgentTree -ne $currentAgentTree) {
              throw "Agent release $tag already exists but relay-agent source changed. Increment relay-agent/VERSION before publishing another Agent binary."
            }

            $verifyDir = Join-Path $env:RUNNER_TEMP "agent-release-$version"
            Remove-Item $verifyDir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null
            gh release download $tag --repo "${{ github.repository }}" --pattern "Agent.Auto.Confirm.Pick.Pack.exe" --dir $verifyDir
            if ($LASTEXITCODE -ne 0) {
              gh release download $tag --repo "${{ github.repository }}" --pattern "Agent Auto Confirm Pick Pack.exe" --dir $verifyDir
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Agent release $tag exists but the canonical EXE cannot be downloaded."
            }
            gh release download $tag --repo "${{ github.repository }}" --pattern "Agent.Auto.Confirm.Pick.Pack.exe.sha256" --dir $verifyDir
            if ($LASTEXITCODE -ne 0) {
              gh release download $tag --repo "${{ github.repository }}" --pattern "Agent Auto Confirm Pick Pack.exe.sha256" --dir $verifyDir
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Agent release $tag exists but the checksum asset cannot be downloaded."
            }

            $releasedExe = Get-ChildItem $verifyDir -Filter "*.exe" | Where-Object { $_.Name -notlike "SUPRA-Inventory-Relay-Test*" } | Select-Object -First 1
            $releasedShaFile = Get-ChildItem $verifyDir -Filter "*.sha256" | Where-Object { $_.Name -notlike "SUPRA-Inventory-Relay-Test*" } | Select-Object -First 1
            if ($null -eq $releasedExe -or $null -eq $releasedShaFile) {
              throw "Agent release $tag is missing canonical release assets."
            }
            $releasedSha = (Get-Content $releasedShaFile.FullName -Raw).Trim().Split(' ')[0].ToLowerInvariant()
            $actualReleasedSha = (Get-FileHash $releasedExe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($releasedSha -ne $actualReleasedSha) {
              throw "Agent release $tag checksum does not match the published EXE."
            }

            $channelSourceExe = $releasedExe.FullName
            $channelSourceSha = $releasedShaFile.FullName
            Write-Host "Agent release $tag already exists and relay-agent source tree is unchanged; reuse published release assets."
          } else {
            gh release create $tag `
              "$primary#Agent Auto Confirm Pick Pack.exe" `
              "$primarySha#Agent Auto Confirm Pick Pack.exe.sha256" `
              "relay-agent/dist/SUPRA-Inventory-Relay-Test.exe#SUPRA-Inventory-Relay-Test.exe" `
              "relay-agent/dist/SUPRA-Inventory-Relay-Test.exe.sha256#SUPRA-Inventory-Relay-Test.exe.sha256" `
              "relay-agent/dist/README.md#README.md" `
              --repo "${{ github.repository }}" `
              --title "Agent Auto Confirm Pick Pack v$version" `
              --notes "Beta Agent for Pick Pack / Inventory confirmation relay. D126 keeps Firestore PRIMARY/STANDBY/FROZEN HA and replaces Supra session/API integration with user-login managed-browser DOM confirmation. Mutation is fail-closed to the exact matched row checkbox and exact Xác nhận lấy lại hàng button. SKU updates are manual-file-only." `
              --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Unable to publish Agent release $tag." }
          }

          $channel = "inventory-channel"
          gh release view $channel --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $channel --repo "${{ github.repository }}" --target "$env:GITHUB_SHA" --title "SUPRA Inventory runtime channel" --notes "Machine-readable Beta distribution channel. Do not install directly from this release page." --prerelease
            if ($LASTEXITCODE -ne 0) {
              gh release view $channel --repo "${{ github.repository }}" *> $null
              if ($LASTEXITCODE -ne 0) { throw "Unable to create or read runtime channel release." }
            }
          }
          $aliasExe = "relay-agent/dist/Agent.Auto.Confirm.Pick.Pack.exe"
          $aliasSha = "relay-agent/dist/Agent.Auto.Confirm.Pick.Pack.exe.sha256"
          Copy-Item $channelSourceExe $aliasExe -Force
          Copy-Item $channelSourceSha $aliasSha -Force
          $sha256 = (Get-Content $aliasSha -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          $size = (Get-Item $aliasExe).Length
          $manifest = [ordered]@{
            schema_version = 1
            channel = "beta"
            tag = $tag
            name = "Agent Auto Confirm Pick Pack v$version"
            published_at = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            source = $releaseSource
            asset_name = "Agent.Auto.Confirm.Pick.Pack.exe"
            size_bytes = $size
            sha256 = $sha256
          } | ConvertTo-Json -Compress
          $manifest | Set-Content "relay-agent/dist/agent-latest.json" -Encoding utf8
          gh release upload $channel $aliasExe $aliasSha "relay-agent/dist/agent-latest.json" --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to update stable Agent runtime channel." }
          Write-Host "Updated stable Agent runtime channel $channel -> $tag"

      - name: Publish Agent-owned Fixed WebView2 browser bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $resolve = node tools/d127_resolve_webview2_fixed.js latest
          if ($LASTEXITCODE -ne 0) { throw "Unable to resolve the latest official Fixed WebView2 x64 package." }
          $match = [regex]::Match(($resolve -join "`n"), 'version=(\d+(?:\.\d+){3})')
          if (-not $match.Success) { throw "Resolved WebView2 version was not returned." }
          $runtimeVersion = $match.Groups[1].Value
          $hostBuild = 4
          $channel = "inventory-channel"
          $asset = "Agent.WebView2.FixedRuntime.x64.zip"
          $assetSha = "$asset.sha256"
          $manifestName = "agent-browser-latest.json"
          $reuse = $false
          $probeDir = Join-Path $env:RUNNER_TEMP "wv2-channel-probe"
          Remove-Item $probeDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          gh release download $channel --repo "${{ github.repository }}" --pattern $manifestName --dir $probeDir 2>$null
          if ($LASTEXITCODE -eq 0) {
            try {
              $existing = Get-Content (Join-Path $probeDir $manifestName) -Raw | ConvertFrom-Json
              if ($existing.version -eq $runtimeVersion -and
                  [int]$existing.host_build -eq $hostBuild -and
                  $existing.sha256 -match '^[0-9a-f]{64}$') {
                gh release download $channel --repo "${{ github.repository }}" --pattern $asset --dir $probeDir 2>$null
                gh release download $channel --repo "${{ github.repository }}" --pattern $assetSha --dir $probeDir 2>$null
                if ($LASTEXITCODE -eq 0) {
                  $actual = (Get-FileHash (Join-Path $probeDir $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
                  $expected = (Get-Content (Join-Path $probeDir $assetSha) -Raw).Trim().Split(' ')[0].ToLowerInvariant()
                  if ($actual -eq $expected -and $actual -eq [string]$existing.sha256) { $reuse = $true }
                }
              }
            } catch {}
          }
          if ($reuse) {
            Write-Host "Owned WebView2 bundle $runtimeVersion already verified on $channel."
            exit 0
          }

          $work = Join-Path $env:RUNNER_TEMP "wv2-fixed-$runtimeVersion"
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $filename = "Microsoft.WebView2.FixedVersionRuntime.$runtimeVersion.x64.cab"
          $cab = Join-Path $work $filename
          node tools/d127_resolve_webview2_fixed.js $runtimeVersion $cab
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $cab)) {
            throw "Unable to download official Microsoft Fixed WebView2 x64 CAB for $runtimeVersion."
          }
          if ((Get-Item $cab).Length -lt 100MB) { throw "Downloaded Fixed WebView2 CAB is unexpectedly small." }

          $expanded = Join-Path $work "expanded"
          New-Item -ItemType Directory -Force -Path $expanded | Out-Null
          & expand.exe $cab -F:* $expanded | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Unable to extract Fixed WebView2 CAB." }
          $engine = Get-ChildItem $expanded -Recurse -Filter msedgewebview2.exe | Select-Object -First 1
          if ($null -eq $engine) { throw "Fixed WebView2 runtime executable not found after extraction." }
          $runtimeRoot = $engine.Directory.FullName

          $bundle = Join-Path $work "bundle"
          $hostDir = Join-Path $bundle "host"
          $runtimeDir = Join-Path $bundle "runtime"
          New-Item -ItemType Directory -Force -Path $hostDir | Out-Null
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          Copy-Item "relay-agent-webview2-host/bin/Release/net48/*" $hostDir -Recurse -Force

          $loaderSource = Get-ChildItem "relay-agent-webview2-host/bin/Release/net48" -Recurse -Filter "WebView2Loader.dll" |
            Where-Object { $_.FullName -match 'runtimes[\\/]win-x64[\\/]native[\\/]WebView2Loader\.dll$' } |
            Select-Object -First 1
          if ($null -eq $loaderSource) { throw "WebView2Loader x64 missing from host build output." }
          $loaderDir = Join-Path $hostDir "loader/x64"
          New-Item -ItemType Directory -Force -Path $loaderDir | Out-Null
          Copy-Item $loaderSource.FullName (Join-Path $loaderDir "WebView2Loader.dll") -Force

          function Get-PeMachine([string]$path) {
            $stream = [System.IO.File]::OpenRead($path)
            try {
              $reader = New-Object System.IO.BinaryReader($stream)
              $stream.Position = 0x3c
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset + 4
              return $reader.ReadUInt16()
            } finally {
              $stream.Dispose()
            }
          }

          $hostMachine = Get-PeMachine (Join-Path $hostDir "SUPRA.Inventory.WebView2Host.exe")
          $loaderMachine = Get-PeMachine (Join-Path $loaderDir "WebView2Loader.dll")
          if ($hostMachine -ne 0x8664) { throw "Owned WebView2 host PE machine is not AMD64: $hostMachine" }
          if ($loaderMachine -ne 0x8664) { throw "WebView2Loader PE machine is not AMD64: $loaderMachine" }

          Copy-Item (Join-Path $runtimeRoot "*") $runtimeDir -Recurse -Force
          if (-not (Test-Path (Join-Path $hostDir "SUPRA.Inventory.WebView2Host.exe"))) { throw "Owned host missing from browser bundle." }
          if (-not (Test-Path (Join-Path $hostDir "loader/x64/WebView2Loader.dll"))) { throw "Owned host x64 WebView2Loader missing from browser bundle." }
          if (-not (Test-Path (Join-Path $runtimeDir "msedgewebview2.exe"))) { throw "Fixed runtime missing from browser bundle." }

          $zip = Join-Path $work $asset
          Compress-Archive -Path (Join-Path $bundle "*") -DestinationPath $zip -CompressionLevel Optimal
          $sha256 = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha256  $asset" | Set-Content (Join-Path $work $assetSha) -Encoding ascii
          $size = (Get-Item $zip).Length
          $manifest = [ordered]@{
            schema_version = 1
            channel = "beta"
            version = $runtimeVersion
            host_build = $hostBuild
            host_arch = "x64"
            asset_name = $asset
            size_bytes = $size
            sha256 = $sha256
          } | ConvertTo-Json -Compress
          $manifest | Set-Content (Join-Path $work $manifestName) -Encoding utf8

          gh release upload $channel $zip (Join-Path $work $assetSha) (Join-Path $work $manifestName) --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish Agent-owned browser bundle." }
          Write-Host "Published Agent-owned Fixed WebView2 $runtimeVersion host_build=$hostBuild host_arch=x64 bundle size=$size sha256=$sha256"

