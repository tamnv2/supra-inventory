# D173-E116: CI-only validation. No provider token, deployment, signing, or real outbound mail.
# Historical per-PR E005/E010 source-diff branches were retired after E115 cleanup.
# Actual Worker/Android/Agent releases remain controlled by separate owner-gated workflows.
name: D173 Email Service Sender Guard

on:
  pull_request:
    paths:
      - 'service/src/google-mail.ts'
      - 'service/src/index.ts'
      - 'service/src/auth.ts'
      - 'service/src/privileged-auth.ts'
      - 'service/src/firebase-auth-admin.ts'
      - 'service/src/system-reset.ts'
      - 'service/src/launcher-password.ts'
      - 'service/wrangler.beta.toml'
      - 'tests/d173*'
      - 'tests/d172-*'
      - '.github/workflows/d173-email-sender-guard.yml'
      - 'tools/d173_e109_email_preservation_guard.py'
      - 'ops/project-scope.json'
      - 'ops/resource-registry.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/d173-email-sender-guard.yml'
      - 'service/src/google-mail.ts'
      - 'service/src/privileged-auth.ts'
      - 'service/src/system-reset.ts'
      - 'service/src/launcher-password.ts'
      - 'service/wrangler.beta.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sender scope and all four unchanged mail templates
        run: node --test tests/d173-no-reply-otp.test.mjs
      - name: Mocked Gmail and Cloudflare transport, without actual sending
        run: node --experimental-strip-types --test tests/d173-e005-email-runtime.test.mjs
      - name: Validate GitHub workflow syntax structure and CI-only safety contract
        run: node --test tests/d173-e030-email-guard-yaml.test.mjs
      - name: Typecheck existing Worker source
        working-directory: service
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund
          npm run typecheck
      - name: Shared Worker and independent D172 regression
        run: node --test tests/d172-*.test.mjs
      - name: Source CI finished without provider mutation
        run: |
          echo "D173_E116_SOURCE_CI_ONLY__NO_PRODUCTION_DEPLOY_OR_REAL_EMAIL"
          echo "Production release authority remains in separately gated workflows"
