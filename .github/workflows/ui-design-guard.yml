name: UI Design Guard

on:
  push:
    branches: [main]
    paths:
      - "service/**"
      - "web/**"
      - "android/**"
      - "docs/specs/UI_DESIGN_SYSTEM.md"
      - "tools/ui_design_guard.py"
      - "ops/project-state.json"
      - ".github/workflows/ui-design-guard.yml"
  pull_request:
    branches: [main]
    paths:
      - "service/**"
      - "web/**"
      - "android/**"
      - "docs/specs/UI_DESIGN_SYSTEM.md"
      - "tools/ui_design_guard.py"
      - "ops/project-state.json"
      - ".github/workflows/ui-design-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-operational-v2:
    runs-on: ubuntu-latest
    environment: beta
    env:
      FIREBASE_API_KEY_BETA: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate Legacy Operational UI V2 source invariants
        run: |
          set -euo pipefail
          python3 tools/ui_design_guard.py

      - name: Run Operational V2 regression fixtures
        run: python3 tools/operational_v2_regression.py

      - name: Run realtime cursor regression fixtures
        run: python3 tools/realtime_cursor_regression.py

      - name: Run Web operational regression guard
        run: python3 tools/web_operational_regression.py

      - name: Typecheck Worker service
        working-directory: service
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Build Web production gate
        working-directory: web
        env:
          VITE_API_BASE_URL: https://inventory-beta.supra.cc.cd
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY_BETA || secrets.FIREBASE_WEB_API_KEY_BETA }}
          VITE_FIREBASE_AUTH_DOMAIN: supra-inventory-beta.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: supra-inventory-beta
          VITE_FIREBASE_APP_ID: 1:572322098890:web:96459cf386b3fb6f400e33
          VITE_FIREBASE_MESSAGING_SENDER_ID: "572322098890"
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Build Android debug gate
        run: |
          set -euo pipefail
          [ -n "${FIREBASE_API_KEY_BETA:-}" ] || { echo "Missing Firebase Beta API key"; exit 1; }
          gradle -p android :app:assembleDebug --no-daemon
