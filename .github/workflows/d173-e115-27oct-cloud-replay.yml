name: D173 E115 Oct27 Traffic Profile Cloudflare Replay (TEST ONLY)
on:
  pull_request:
    types: [opened, synchronize, labeled]
permissions:
  contents: read
concurrency:
  group: d173-e115-oct27-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  offline-gate:
    if: github.event.pull_request.head.ref == 'poc/d173-e115-27oct-trace-driven-replay-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify LAB scope and D172 no cross-mutation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python tools/d173_e113_cloud_lab/guard.py
          python tools/public_repo_secret_guard.py
          python tools/d173_isolation_guard.py --base "$BASE_SHA" --head HEAD
      - name: Install existing local toolchain
        run: npm install --prefix service --no-audit --no-fund
      - name: Current source compile without deploy
        run: node service/node_modules/wrangler/bin/wrangler.js deploy --config tools/d173_e113_cloud_lab/wrangler.toml --dry-run --outdir /tmp/e115-worker
      - name: Validate day27 real profile and native Core HTTP/WS 1-to-1 read sample
        run: |
          node tools/d173_e115_day27/validate-profile.mjs
          node tools/d173_e115_day27/test-real-day27.mjs
  metered-cloud-once:
    needs: offline-gate
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'm2-day27-once' &&
      github.event.pull_request.head.ref == 'poc/d173-e115-27oct-trace-driven-replay-20261031' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: m2-cloud-lab
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact LAB namespace/Worker and Cloudflare permission read-only gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_M2_LAB }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python tools/d173_e113_cloud_lab/guard.py
          node tools/d173_e115_day27/preflight-existing-lab.mjs
          node tools/d173_e113_cloud_lab/namespace-attribution.mjs
      - name: Generate one short-lived LAB-only access key in runner
        run: |
          set -euo pipefail
          npm install --prefix service --no-audit --no-fund
          KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$KEY"
          echo "M2_LAB_GATE_KEY=$KEY" >> "$GITHUB_ENV"
          echo "M2_LAB_EXPIRES_AT=$(node -e 'process.stdout.write(String(Date.now()+120*60000))')" >> "$GITHUB_ENV"
          node -e 'const j=require("./artifacts/d173-e115/preflight-existing-test-worker.json");process.stdout.write("M2_LAB_URL="+j.origin+"\n")' >> "$GITHUB_ENV"
      - name: Update ONLY named test Worker with real Core and distinct 27-Oct fixture instances
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_M2_LAB }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node service/node_modules/wrangler/bin/wrangler.js deploy --config tools/d173_e113_cloud_lab/wrangler.toml
          printf '%s' "$M2_LAB_GATE_KEY" | node service/node_modules/wrangler/bin/wrangler.js secret put M2_LAB_GATE_KEY --config tools/d173_e113_cloud_lab/wrangler.toml
          printf '%s' "$M2_LAB_EXPIRES_AT" | node service/node_modules/wrangler/bin/wrangler.js secret put M2_LAB_EXPIRES_AT --config tools/d173_e113_cloud_lab/wrangler.toml
      - name: Actual Cloudflare 27-Oct profile A/B 2.5 percent eligible read operations, strict 700-frame ceiling
        run: node tools/d173_e115_day27/test-real-day27.mjs
      - name: Read-only after-provider namespace measurements
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_M2_LAB }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: node tools/d173_e113_cloud_lab/namespace-attribution.mjs
      - name: Save all real usage and HTTP/M2 measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: D173-E115-27OCT-REAL-CLOUD-AB-AND-PROVIDER
          path: |
            artifacts/d173-e115/*
            artifacts/d173-e113/namespace-attribution.json
          if-no-files-found: warn
          retention-days: 21
