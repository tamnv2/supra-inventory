name: D173 E109 DO optimization code only
on:
  pull_request:
    paths:
      - 'service/**'
      - 'web/**'
      - 'android/**'
      - 'tools/d173_e108*'
      - 'tools/d173_e109*'
      - 'tools/d173_e086*'
      - 'tests/d173-e108*'
      - 'ops/d173-e109-code-authorization.json'
      - '.github/workflows/d173-e109-do-optimization.yml'
permissions:
  contents: read
concurrency:
  group: d173-e109-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  code-only-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify code-only authorization and canonical state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('ops/d173-e109-code-authorization.json').read_text())
          assert a['code_permission'] is True and a['stop_at']=='CODE_READY'
          for key in ['merge_main_permission','deployment_permission','provider_write_permission','ota_publication_permission','stable_permission','d172_business_changes']:
              assert a[key] is False, key
          PY
          python3 tools/authority_guard.py
          python3 tools/project_state_guard.py
          python3 tools/change_continuity_guard.py
          python3 tools/public_repo_secret_guard.py
      - name: Service dependencies and typecheck
        working-directory: service
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm run typecheck
      - name: Actual SQLite, WebSocket and background contracts (no provider)
        # Client fixtures execute actual Web TypeScript modules.
        # Install first so a clean runner has the compiler dependency.
        run: |
          npm --prefix web install --no-package-lock --ignore-scripts --no-audit --no-fund
          node tools/d173_e108_snapshot_regression.mjs
          node tools/d173_e109_command_regression.mjs
          node tools/d173_e109_audience_regression.mjs
          node tools/d173_e108_background_regression.mjs
          node tools/d173_e108_assets_regression.mjs
          node tools/d173_e086_ws_regression.mjs
          node --test tests/d173-e108-client-transport.test.mjs
      - name: Web build only
        working-directory: web
        run: |
          npm run build
      - name: Preserve D172 independent source boundary
        run: python3 tools/d173_isolation_guard.py --base '${{ github.event.pull_request.base.sha }}' --head HEAD
  android-debug-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Android debug unit tests and compile only (no signing, no device, no release)
        env:
          FIREBASE_API_KEY_BETA: 'CODE_ONLY_NO_PROVIDER'
          APP_VERSION_CODE: '122'
          APP_VERSION_NAME: '0.2.0-beta-code-only'
        run: gradle -p android :app:testDebugUnitTest :app:assembleDebug --no-daemon
