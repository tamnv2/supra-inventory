name: Apply Picker Password Hotfix

on:
  push:
    branches: [fix/android-vc32-update-ui-picker-password]
    paths:
      - "tools/apply_picker_password_hotfix.py"
      - ".github/workflows/apply-picker-password-hotfix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-vc32-update-ui-picker-password
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply deterministic codemod
        run: python3 tools/apply_picker_password_hotfix.py
      - name: Typecheck service
        working-directory: service
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
      - name: Commit generated source and remove temporary automation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service/src/index.ts
          git rm tools/apply_picker_password_hotfix.py .github/workflows/apply-picker-password-hotfix.yml
          git commit -m "fix(auth): initialize legacy Picker default password"
          git push origin HEAD:fix/android-vc32-update-ui-picker-password
