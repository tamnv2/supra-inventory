name: D173-E060 VPS Usage Agent Isolation & Regression
on:
  pull_request:
    paths:
      - 'relay-agent/**'
      - 'service/src/d173-vps-usage.ts'
      - 'service/src/index.ts'
      - 'tools/d173_e060_vps_usage_guard.py'
      - 'tools/d173_e064_agent_history_usage_guard.py'
      - 'tools/d173_e096_source_guard.py'
      - 'tools/d173_e060_email_preservation_guard.py'
      - 'tools/d173_e060_usage_release_gate.py'
      - 'tools/d173_e060_grouping_provider_probe.py'
      - 'ops/d173-e060-usage-release-authorization.json'
      - '.github/workflows/d173-e060-vps-usage.yml'
      - '.github/workflows/deploy-beta.yml'
      - '.github/workflows/verify-relay-agent.yml'
permissions:
  contents: read
jobs:
  vps-usage-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source/Owner deployment authorization gate
        shell: bash
        run: |
          set -euo pipefail
          # E060 is an immutable Agent149 release receipt. Its historical pin must
          # never authorize Agent150, nor reject future CODE-ONLY pull requests.
          if [ "$(cat relay-agent/VERSION | tr -d '\\r\\n')" = "149" ] && [ "$(jq -r '.source_ci_verified' ops/d173-e060-usage-release-authorization.json)" = "true" ]; then
            python tools/d173_e060_usage_release_gate.py --component worker --preflight
            python tools/d173_e060_usage_release_gate.py --component agent --preflight
          else
            echo "D173_E060_HISTORICAL_PIN_NOT_APPLICABLE__NEW_AGENT_RELEASE_GATED_SEPARATELY"
          fi
      - name: Provider read-only security, VPS auth and existing Agent theme contract
        run: |
          python tools/d173_e060_vps_usage_guard.py
          python tools/d173_e096_source_guard.py
          python tools/d173_e064_agent_history_usage_guard.py
          python tools/d173_e060_email_preservation_guard.py
          python tools/d173_isolation_guard.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
          python tools/public_repo_secret_guard.py
      - name: Install existing Worker dependencies
        working-directory: service
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Worker TypeScript compile (no deployment)
        working-directory: service
        run: npm run typecheck
      - name: Independent D172 business regression
        run: node --test tests/d172-*.test.mjs
  provider-grouping:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: beta
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
      D166_CF_READ_TOKEN: ${{ secrets.D166_CF_READ_TOKEN }}
      D173_CF_EMAIL_ANALYTICS_READ: ${{ secrets.D173_CF_EMAIL_ANALYTICS_READ }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual Cloudflare grouping schema for 24h 7d 30d
        run: python tools/d173_e060_grouping_provider_probe.py
