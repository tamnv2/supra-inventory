name: D161 Phase0A Branch Authority Patch

on:
  push:
    branches: [d161-phase0a-continuation-canary]
    paths:
      - ".github/workflows/d161-phase0a-branch-authority-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d161-phase0a-continuation-canary
          fetch-depth: 0
      - name: Patch D161 Phase 0A registry and state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          registry_path=Path("ops/resource-registry.json")
          registry=json.loads(registry_path.read_text(encoding="utf-8"))
          registry.setdefault("d161", {})["phase0a_continuation_canary"]={
            "status":"AUTHORIZED__PENDING_TECHNICAL_PASS",
            "resource_key":"d161-phase0a-provider-canary-beta",
            "name":"d161Phase0aCanary",
            "purpose":"GEN2_FUNCTION_RUNTIME_IDENTITY__FCM_VALIDATE_ONLY__HR_DRIVE_WATCH_INITIAL_SYNC_REPLACE_STOP_CLEANUP",
            "firestore_state":"EXISTING_relay_poc_coordination_DISPOSABLE_DOC_ONLY__DELETE_SAME_RUN",
            "resource_lifecycle":"CREATE_BETA_ONLY__VERIFY__DELETE_SAME_RUN",
            "stable":"FORBIDDEN"
          }
          registry_path.write_text(json.dumps(registry,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          state_path=Path("ops/project-state.json")
          state=json.loads(state_path.read_text(encoding="utf-8"))
          d161=state["d161"]
          d161["phase0a"]["result"]="REPAIRING_PREFLIGHT_AUTOMATION__CONTINUATION_CANARY_AUTHORIZED"
          d161["phase0a"]["continuation_workflow"]=".github/workflows/d161-phase0a-continuation.yml"
          d161["phase0a"]["continuation_scope"]="FUNCTIONS_FCM__MONITORING__HR_SHEETS__HR_DRIVE_WATCH__AGENT_GATEWAY_GLOBAL_CONTROL__AGENT_V97_BUILD"
          d161["next_action"]="RUN_PHASE0A_CONTINUATION_TO_PASS__AGGREGATE_WITH_FRESH_PHASE0A_AND_APPS_SCRIPT_EVIDENCE__THEN_PHASE0_SAFETY"
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git rm .github/workflows/d161-phase0a-branch-authority-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/resource-registry.json ops/project-state.json
          git commit -m "D161: register Phase 0A continuation canary"
          git push origin HEAD:d161-phase0a-continuation-canary
