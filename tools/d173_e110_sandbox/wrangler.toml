name = "d173-e110-private-lab-only"
main = "./worker.mjs"
compatibility_date = "2026-09-16"
workers_dev = false
preview_urls = false
[dev]
ip = "127.0.0.1"
port = 9897
local_protocol = "http"
[[durable_objects.bindings]]
name = "POC_CORE"
class_name = "M2Sandbox"
[[migrations]]
tag = "local-v1"
new_sqlite_classes = ["M2Sandbox"]
[assets]
directory = "./web"
binding = "ASSETS"
run_worker_first = true
