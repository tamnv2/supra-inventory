name = "supra-inventory-beta"
main = "src/index.ts"
compatibility_date = "2026-09-16"
workers_dev = false
preview_urls = false
keep_vars = true

[[routes]]
pattern = "inventory-beta.supra.cc.cd"
custom_domain = true

# D170: second official hostname on the SAME Worker, NOT legacy Stable.
[[routes]]
pattern = "inventory.supra.cc.cd"
custom_domain = true

# D173: bind ONLY the existing official Production Worker to its verified sender.
# Activation is separate: PROJECT_MAIL_SENDER stays unset until a verified delivery test.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["no-reply@supra.cc.cd"]

[[durable_objects.bindings]]
name = "INVENTORY_CORE"
class_name = "InventoryCore"

[exports.InventoryCore]
type = "durable-object"
storage = "sqlite"

[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true

[secrets]
required = [
  "GOOGLE_RUNTIME_SA_JSON",
  "GOOGLE_DRIVE_OAUTH_CLIENT_SECRET",
  "GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN"
]

[vars]
# Safety: keep the current Gmail sender until verified Cloudflare delivery and release receipt.
PROJECT_MAIL_SENDER = ""
APP_ENV = "beta"
PROJECT_KEY = "supra-inventory"
FIREBASE_PROJECT_ID = "supra-inventory-beta"
# D170 E024: one official OAuth callback, same existing OAuth client and Worker.
# Legacy hostname stays attached until every supported installed client is migrated.
GOOGLE_DRIVE_OAUTH_REDIRECT_URI = "https://inventory.supra.cc.cd/api/oauth/google/callback"
ARCHIVE_SHEET_ID = "1WU9RDUEevE74Twyq1aA80xvL3Wr1mTA21PRA8ypIMOA"
PDA_REGISTRY_SHEET_ID = "1zPwYzM6DWqVMI0rV_IRMJUH9nZwrlHQA997JRUD8pyI"
ARCHIVE_FOLDER_ID = "1hVmzMziL9nKw-AEnzd8pJm6fmOdyd-5a"
EXPORTS_FOLDER_ID = "1BgYPpoXHyr9TLzQxE2tOQEvHxfMpKtBh"
LOGS_FOLDER_ID = "17Ealimu__NFxeEzG3mUfivpEEacX_vgo"
LAUNCHER_LOGS_FOLDER_ID = "1Gm-O5nl_ITXZJ1SaLDAOeYaYcpmJ16YO"
RETENTION_DAYS = "60"

[observability]
enabled = true

[observability.logs]
enabled = true

[triggers]
crons = ["*/5 * * * *", "15 20 * * *"]
