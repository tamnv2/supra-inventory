plugins {
    id 'com.android.application'
}

import java.util.Properties
import java.util.Base64

// Explicit D173-only test Firebase configuration, absent by default.
def pocCfg = { key -> (project.findProperty(key) ?: System.getenv(key) ?: '').toString() }
def pocQuote = { value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

final def versionNameProp = project.findProperty('VERSION_NAME') ?: '0.3.26-session-test'
final def versionCodeProp = (project.findProperty('VERSION_CODE') ?: '32601').toInteger()
final def keystorePropertiesFile = rootProject.file('keystore.properties')
final def keystoreProperties = new Properties()
final def generatedResDir = layout.buildDirectory.dir('generated/supraRes')

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'vn.supra.pdalauncher'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'vn.supra.pdalauncher.identitytest'
        buildConfigField 'String', 'TEST_FIREBASE_PROJECT_ID', pocQuote('supra-inventory-beta')
        buildConfigField 'String', 'TEST_FIREBASE_API_KEY', pocQuote(pocCfg('D173_POC_FIREBASE_API_KEY'))
        buildConfigField 'String', 'TEST_FIREBASE_APP_ID', pocQuote('1:572322098890:android:3e483937876cbcc0400e33')
        buildConfigField 'String', 'TEST_QA_USERNAME', pocQuote(pocCfg('D173_POC_TEST_USERNAME'))
        minSdk 23
        targetSdk 35
        versionCode versionCodeProp
        versionName versionNameProp
    }

    sourceSets {
        main {
            res.srcDir(generatedResDir)
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('decodeSupraLogo') {
    final def inputFile = file('src/main/logo.b64')
    final def outputFileProvider = generatedResDir.map { it.file('drawable/supra_logo.png') }
    inputs.file(inputFile)
    outputs.file(outputFileProvider)

    doLast {
        final def outputFile = outputFileProvider.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.bytes = Base64.decoder.decode(inputFile.text.trim())
    }
}

tasks.named('preBuild').configure {
    dependsOn('decodeSupraLogo')
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.zxing:core:3.5.3'
}
